//     （--side-gap 变负，牌像真牌一样一张压一张），数学上保证永不溢出。
//
// 设计尺寸怎么拿：先摘掉上一轮写进去的内联变量，用真实元素量一次，量完立刻装回。
// ⚠️ 不要去 parseFloat 读 --side-w 这类变量：⑤ 大屏档里它们是 calc()/clamp()，
//    parseFloat 会得到 NaN，整个自适应就会静默失效（这里踩过一次）。
function measureBack(hand,varNames){
  const root=document.documentElement, style=root.style;
  if(!hand||typeof hand.querySelector!=='function')return {w:0,h:0};
  const prev=[];
  varNames.forEach(n=>{
    prev.push(style&&typeof style.getPropertyValue==='function'?style.getPropertyValue(n):'');
    if(style&&typeof style.removeProperty==='function')style.removeProperty(n);
  });
  const el=hand.querySelector('.back')||hand.querySelector('.tile');
  let w=0,h=0;
  if(el){
    // 🔴 必须用 offsetWidth/offsetHeight，**不能**用 getBoundingClientRect()：
    //    左右两家的牌背带 rotate(90deg)，rect 量到的是"旋转后的外接框"，宽高会被对调
    //    （实测把 --side-w/h 的 15×21 量成 21×15）→ 长宽比算反 → 牌背被压成 13×19 的细条。
    //    offsetWidth/offsetHeight 是布局盒尺寸，不受 transform 影响，量的才是真实设计尺寸。
    w=el.offsetWidth||0; h=el.offsetHeight||0;
    if(!w||!h){
      const r=el.getBoundingClientRect();w=r.width;h=r.height;
    }
  }
  varNames.forEach((n,i)=>{
    if(prev[i]&&style&&typeof style.setProperty==='function')style.setProperty(n,prev[i]);
  });
  return {w:w,h:h};
}
/* ===== 弃牌尺寸：跟手牌一致 =====
   用户实测反馈"弃出去的牌比手上的小一圈"。根因是两套尺寸各自写死（手牌由 fitRow 算、
   弃牌由各档 CSS 写死），手牌一变就对不上。这里改成**单一来源**：
     ① 量出手牌实际尺寸，写进 --dtw/--dth（各档只用 --dt-max-w/--dt-max-h 限上限）；
     ② 侧边牌河若因牌多而被挤得太宽（超过 --dt-budget 的比例），再逐级缩小这一侧，
        并把结果写在该 zone 上（就近覆盖，不影响别家）。
   ⚠️ 量尺寸要用 offsetWidth/offsetHeight：弃牌里有 rotate 的牌，rect 会把宽高对调。 */
/* 弃牌尺寸**与手牌一致**：数值由 JS 按"手牌实测尺寸"写进 --dtw/--dth（见 fitDiscards），
   各档只通过 --dt-max-w/--dt-max-h 限制最大值。
   🔴 不要再逐档写死弃牌尺寸 —— 那正是"弃出去的牌比手上的小一圈"的根源（用户实测反馈）：
      写死的数字与手牌尺寸是两套，手牌一变化就对不上。 */
function fitDiscards(){
  const root=document.documentElement,mh=document.getElementById('myHand');
  if(!root||!root.style||!mh||typeof mh.querySelector!=='function')return;
  // ===== 左右侧栏宽度先对齐 =====
  // 名字标签里「庄 ●」只加在庄家那一侧 → 那一侧的标签更长、侧栏更宽（实测 44 vs 33.5），
  // 于是中排整体被推偏 5px（中央信息块偏出中线）。这里先把两条侧栏撑到同宽，后面的
  // 宽度预算（牌河/副露）才是对称的。⚠️ 先清掉上一轮的 minWidth 再量，否则会一轮轮越撑越宽。
  if(document.querySelectorAll){
    const sd=document.querySelectorAll('.side');
    if(sd&&sd.length===2&&sd[0].style&&sd[1].style){
      sd[0].style.minWidth=''; sd[1].style.minWidth='';
      const sw=Math.max(sd[0].offsetWidth||0, sd[1].offsetWidth||0);
      if(sw>0){sd[0].style.minWidth=sw+'px'; sd[1].style.minWidth=sw+'px';}
    }
  }
  const t=mh.querySelector('.tile');if(!t)return;
  let tw=t.offsetWidth||0, th=t.offsetHeight||0;
  if(!tw||!th)return;
  const capW=cssNum(root,'--dt-max-w',32), capH=cssNum(root,'--dt-max-h',43);
  tw=Math.min(tw,capW); th=Math.min(th,capH);
  // 侧栏副露（碰/杠）的牌尺寸：跟着手牌走（小一号）。fitSideMelds() 用它算占位盒。
  // ===== 四家副露统一尺寸（用户反馈"每一家的副牌区比例不对"）=====
  // 实测四家各不相同：自己 20×27、对家 14×20、左右两家 10.9×14.7，而手牌是 26×35 ——
  // 三家副露明显偏小、彼此也不一致。这里改成**单一来源**：全部 = 手牌 × --mel-ratio，
  // 各档只用 --mel-max-w/h 限上限，放不下时四家**一起**缩（保持彼此一致）。
  const mCapW=cssNum(root,'--mel-max-w',24), mCapH=cssNum(root,'--mel-max-h',32);
  const mRatio=cssNum(root,'--mel-ratio',0.85);
  let melW=Math.min(tw*mRatio,mCapW), melH=Math.min(th*mRatio,mCapH);
  const setMel=(w,h)=>{
    const ww=Math.round(w*10)/10, hh=Math.round(h*10)/10;
    root.style.setProperty('--mel-w',ww+'px');
    root.style.setProperty('--mel-h',hh+'px');
    root.style.setProperty('--smw',ww+'px');      // 兼容旧变量名（占位盒还在读）
    root.style.setProperty('--smh',hh+'px');
  };
  // 先把牌河算完（下面的循环要用到 midRow 的真实余量），副露放到最后一起定尺寸：
  const applyMelds=()=>{
    // 放不下就让**副露**先让位（四家一起缩，保持彼此一致），牌河最后才缩 ——
    // 牌河是主要信息，副露是"已完成的牌组"。
    const rows=[document.getElementById('myMelds'),document.getElementById('topMelds'),
                document.getElementById('leftMelds'),document.getElementById('rightMelds')];
    const mid=document.querySelector('.midRow');
    for(let i=0;i<14;i++){
      setMel(melW,melH);
      fitSideMelds();                        // 占位盒跟着变，否则量到的还是上一轮的宽度
      let over=false;
      rows.forEach(r=>{
        if(!r||!r.children||!r.children.length)return;
        if((r.scrollWidth||0)>(r.clientWidth||0)+1)over=true;
        if((r.scrollHeight||0)>(r.clientHeight||0)+1)over=true;
      });
      if(mid&&typeof mid.scrollWidth==='number'&&mid.scrollWidth>mid.clientWidth+1)over=true;
      // ⚠️ 还要盯**中央块的内部溢出**：中排用 space-between 排布，整体没溢出、
      //    但中央列（积分板）可能已经比自己的格子宽 —— 多出来的部分就压到两侧牌河上
      //    （实测：四家各一副露 + 18 张弃牌时，积分板左右各压 5px，而整行 scrollWidth 正好等于 clientWidth，
      //     所以上面那一条抓不到）。中央块不吃 shrink（会被压溢出，踩过），只能让副露让位。
      const ci=document.querySelector('.centerInfo');
      if(ci&&typeof ci.scrollWidth==='number'&&ci.scrollWidth>ci.clientWidth+1)over=true;
      if(!over)break;
      if(melW*0.9<9)break;
      melW*=0.9; melH*=0.9;
    }
    setMel(melW,melH);
    fitSideMelds();
  };
  // 每侧牌河的宽度预算：**按中央区的实际需要反推**，而不是「桌面宽 × 固定比例」。
  // 踩过：按比例算（0.24×400≈96px）太宽松，矮横屏下 3 列牌河直接把中央积分板压住（实测）。
  // ⚠️ 基准必须是**稳定的桌面宽度**。曾经用 midRow.clientWidth —— 它会随牌河宽度变化
  //    （河越宽→中央越窄→预算越小→继续缩），是个自反馈，实测把横屏的弃牌缩到 20×15。
  const midRow=document.querySelector('.midRow');
  const table=document.getElementById('table');
  const W=(table&&table.clientWidth)?table.clientWidth:400;
  let railsW=0;
  if(document.querySelectorAll)document.querySelectorAll('.side').forEach(el=>{railsW+=(el.offsetWidth||0);});
  const ci=document.querySelector('.centerInfo');
  // 中央块的"需要宽度"：**不能读 offsetWidth** —— .centerInfo 现在是 flex:1（吃掉所有余量），
  // 它的 offsetWidth 是"被拉宽后"的结果，会随窗口/牌河变化；拿它算预算会把两侧牌河
  // 误判成"太宽"而缩掉（实测竖屏 26×35 被缩成 20×27 —— 用户看到的就是"上下家的弃牌比别人小"）。
  // 这里改成量它**内容**需要的宽度：横排（矮横屏）= 子元素之和 + 间隙，竖排 = 最宽的子元素。
  let infoW=88;
  if(ci){
    const kids=[].slice.call(ci.children||[]);
    if(kids.length){
      const ccs=(typeof getComputedStyle==="function")?getComputedStyle(ci):null;
      const isRow=ccs?String(ccs.flexDirection||"row").indexOf("row")>=0:false;
      let sum=0,max=0;
      kids.forEach(k=>{const w=k.offsetWidth||0;sum+=w;if(w>max)max=w;});
      infoW=(isRow?sum:max)+14;
    }
  }
  const lm=document.getElementById('leftMelds'), rm=document.getElementById('rightMelds');
  const meldsW=((lm&&lm.offsetWidth)?lm.offsetWidth:0)+((rm&&rm.offsetWidth)?rm.offsetWidth:0);
  const gaps=4*(cssNum(midRow,'gap',4)||4)+8;                      // 左副露/左河/中/右河/右副露 之间的间隙
  const budget=Math.max(24,(W-railsW-infoW-meldsW-gaps)/2);
  const ratio=cssNum(root,'--dt-budget',0.21);                     // 兜底上限，防止极端窄屏
  const cap=Math.min(budget,Math.max(24,W*ratio));
  ['discardLeft','discardRight','discardTop','discardBottom'].forEach(id=>{
    const z=document.getElementById(id);
    if(!z||!z.style)return;
    const side=(id==='discardLeft'||id==='discardRight');
    let k=1;
    // 清掉上一轮对齐用的 min-width 再量（不清的话量到的是被撑过的宽度 → 一轮轮压小牌河）
    if(side&&z.style.removeProperty)z.style.removeProperty('min-width');
    z.style.setProperty('--dtw',tw+'px');
    z.style.setProperty('--dth',th+'px');
    // 放不下就逐级缩小（最多 12 级 ≈ 0.37 倍）。判据直接看容器溢出：
    //   · 侧边牌河（横躺）的**宽**受 --dt-budget 限制（太宽会挤到中央积分板）
    //   · 上下两家牌河的**高**受各档 max-height 限制（矮横屏最容易夹到）
    // 竖屏能放下时 k 一直是 1 → 弃牌与手牌同尺寸（用户明确要求过）。
    for(let i=0;i<12;i++){
      const w=Math.max(z.offsetWidth||0,z.scrollWidth||0);
      const h=Math.max(z.offsetHeight||0,z.scrollHeight||0);
      const overW=side?(w>cap):(w>(z.clientWidth||0)+1);
      const overH=h>(z.clientHeight||0)+1;
      if(!overW&&!overH)break;
      if(tw*k<11)break;                                        // 再小就没法看了
      k*=0.92;
      z.style.setProperty('--dtw',Math.round(tw*k*10)/10+'px');
      z.style.setProperty('--dth',Math.round(th*k*10)/10+'px');
    }
  });
  // 硬条件：整行（副露+牌河+中央+牌河+副露）必须放得下。
  // 只按"每侧预算"缩是不够的：中央被挤到小于 min-width 时，积分板会溢出来压住牌河
  // （实测 14 个场景报这种遮挡）。这里直接盯**行自身的溢出**，两侧一起缩到不溢出为止。
  const row=document.querySelector('.midRow');
  if(row&&typeof row.scrollWidth==='number'){
    const zL=document.getElementById('discardLeft'),zR=document.getElementById('discardRight');
    for(let i=0;i<12;i++){
      if(row.scrollWidth<=row.clientWidth+1)break;
      const gL=zL&&zL.style?parseFloat(zL.style.getPropertyValue('--dtw')):0;
      const gR=zR&&zR.style?parseFloat(zR.style.getPropertyValue('--dtw')):0;
      const cur=Math.min(gL||tw,gR||tw);
      const nx=Math.round(cur*0.9*10)/10;
      if(!isFinite(nx)||nx<12)break;
      const rr=tw>0?nx/tw:1;
      [zL,zR].forEach(z=>{
        if(!z||!z.style)return;
        z.style.setProperty('--dtw',nx+'px');
        z.style.setProperty('--dth',Math.round(th*rr*10)/10+'px');
      });
    }
  }
  // ===== 确定性适配：按「牌数 + 可用像素」反算牌尺寸（不靠量溢出）=====
  // 牌河是 overflow:hidden + flex 换行。溢出量在**部分内核**（iPad/iPhone Safari）报不出来 ——
  // 实测牌河自己的 scrollHeight === clientHeight，于是上面那些"量到超了才缩一档"的判断全不触发，
  // 牌一多就被静默裁掉（用户反馈：iPad Pro 11 上上下家的弃牌被裁切）。
  // 这里改成先算后设：给定可用宽高与牌数，直接求最大可行的缩放 k，再写 --dtw/--dth ——
  // 结果与内核无关，Safari 与 Chromium 算出来一样。
  //   列数 = floor((可用宽 + 间隙) / (牌占位宽 + 间隙))，行数 = ceil(牌数 / 列数)
  //   需要高 = 行数 × 牌占位高 + (行数 - 1) × 间隙  ≤  可用高
  // ⚠️ 左右两家的牌河牌是**横躺**的（.tbox.dt 宽高互换）：占位宽 = --dth、占位高 = --dtw。
  const zoneFitK=(n,availW,availH,bw,bh,gap)=>{
    if(n<=0||!(availW>0)||!(availH>0)||!(bw>0)||!(bh>0))return 1;
    let k=1;
    for(let i=0;i<40;i++){
      const w=bw*k,h=bh*k;
      const cols=Math.max(1,Math.floor((availW+gap)/(w+gap)));
      const rows=Math.ceil(n/cols);
      const needH=rows*h+(rows-1)*gap;
      if(needH<=availH+0.5&&w<=availW+0.5)break;
      if(bw*k<=11)break;                    // 下限：再小就看不清了
      k*=0.96;
    }
    return k;
  };
  ['discardLeft','discardRight','discardTop','discardBottom'].forEach(id=>{
    const z=document.getElementById(id);
    if(!z||!z.style||!z.children||!z.children.length)return;
    const n=z.children.length;
    const side=(id==='discardLeft'||id==='discardRight');
    const cs=(typeof getComputedStyle==='function')?getComputedStyle(z):null;
    const mhPx=cs?parseFloat(cs.maxHeight):NaN;
    let availW,availH;
    if(side){
      availW=Math.max(24,cap);                                        // 侧栏牌河的宽度预算（上面算过）
      availH=(isFinite(mhPx)&&mhPx>0)?mhPx:Math.max(0,((z.parentElement&&z.parentElement.clientHeight)||0)-8);
    }else{
      availW=(z.parentElement&&z.parentElement.clientWidth)||z.clientWidth||0;
      availH=(isFinite(mhPx)&&mhPx>0)?mhPx:(z.clientHeight||0);       // 上下两家由 max-height 卡着
    }
    const gap=2;
    const bw=side?th:tw, bh=side?tw:th;
    const k=zoneFitK(n,availW,availH,bw,bh,gap);
    if(!(k<1))return;                        // 放得下 → 保持原尺寸（能放下就和手牌同尺寸）
    const cur=parseFloat(z.style.getPropertyValue('--dtw'))||tw;
    const nx=Math.round(Math.min(cur,tw*k)*10)/10;
    if(!isFinite(nx)||nx<=0)return;
    z.style.setProperty('--dtw',nx+'px');
    z.style.setProperty('--dth',Math.round(th*(tw>0?nx/tw:1)*10)/10+'px');
  });

  applyMelds();     // 副露尺寸（内部会调 fitSideMelds 更新占位盒）
  /* 最后再跑一次"牌河裁切兜底"（同一个任务里同步跑完）。
     为什么必须在这里同步跑：看门狗（MutationObserver）要等 120ms 防抖才动手，
     那期间浏览器已经画过一帧"牌太大、被 overflow:hidden 裁掉"的样子 —— 换个内核每次
     渲染都闪一下，比偶尔裁一次还难受。放在这里，浏览器只会在本任务结束后绘制，
     画出来就是已经缩好的最终样子（零闪烁）。观察者保留，用来兜"不是 render 引起的"布局变化。 */
  if(typeof fitDiscardClipGuard==='function'){try{fitDiscardClipGuard();}catch(e){}}
}

/* 左右两家副露的**占位盒**尺寸：牌转了 90°，占位必须宽高互换，
   否则 flex 仍按「横排的一副牌」排版 → 相邻两副重叠、整块挤爆中排。
   占位 = (牌高+内边距) × (牌宽×n + 间隙 + 内边距)，全由 --smw/--smh 推出来，不用量。 */
function fitSideMelds(){
  const root=document.documentElement;
  if(!root||typeof getComputedStyle!=='function')return;
  const gv=n=>{try{const v=parseFloat(getComputedStyle(root).getPropertyValue(n));return isFinite(v)&&v>0?v:0;}catch(e){return 0;}};
  const smw=gv('--mel-w')||gv('--smw')||11, smh=gv('--mel-h')||gv('--smh')||15;
  const boxes=document.querySelectorAll('#leftMelds .tbox.ml, #rightMelds .tbox.ml');
  if(!boxes||!boxes.forEach)return;
  boxes.forEach(bx=>{
    const wrap=bx.firstElementChild;if(!wrap)return;
    const meld=wrap.querySelector?wrap.querySelector('.meld'):null;
    const n=(meld&&meld.children&&meld.children.length)?meld.children.length:3;
    bx.style.width=Math.round(smh+4)+'px';
    bx.style.height=Math.round(n*smw+(n-1)+4)+'px';
  });

  // ===== 左右两家副露宽度**对称化** =====
  // 左右两家副露的副数常常不一样（一边 1 副、一边 2 副），占宽就不同 → 中排是
  // space-between 排布，两边不等宽会把**中央信息块（牌墙+积分板）整块推偏**，
  // 连带自己的弃牌也跟着偏（实测中心偏移 ~50px，副露变大后更明显）。
  // 这里把两侧都撑到较宽的那一侧，中线就回到牌桌正中。
  // ⚠️ 先清掉上一轮的 minWidth 再量，否则会一轮一轮越撑越宽（自反馈）。
  const lmEl=document.getElementById('leftMelds'), rmEl=document.getElementById('rightMelds');
  if(lmEl&&rmEl&&lmEl.style&&rmEl.style){
    lmEl.style.minWidth=''; rmEl.style.minWidth='';
    const w=Math.max(lmEl.offsetWidth||0, rmEl.offsetWidth||0);
    if(w>0){lmEl.style.minWidth=w+'px'; rmEl.style.minWidth=w+'px';}

  // ===== 左右**牌河**宽度同样对齐 =====
  // 两家的牌数几乎不会一样，牌河宽度就不同 → 中央信息块（牌墙+积分板）被推偏
  // （实测「一家 1 张、另一家 0 张」时偏 19px）。这里把两条牌河都撑到较宽的那条。
  // ⚠️ 撑宽后若整行放不下，就一起逐步收回 —— 否则中央块会被两条牌河挤住。
  const zlEl=document.getElementById('discardLeft'), zrEl=document.getElementById('discardRight');
  if(zlEl&&zrEl&&zlEl.style&&zrEl.style){
    zlEl.style.removeProperty('min-width'); zrEl.style.removeProperty('min-width');
    let w2=Math.max(zlEl.offsetWidth||0, zrEl.offsetWidth||0);
    const rowEl=document.querySelector('.midRow');
    for(let k=0;k<10&&w2>0;k++){
      zlEl.style.minWidth=w2+'px'; zrEl.style.minWidth=w2+'px';
      // ⚠️ 只用 midRow 自己的溢出判断是**不够**的：中排被撑大时，它的 clientWidth 会跟着
      //    一起变大（scrollWidth==clientWidth），于是永远判不出溢出 —— 而真正被挤出去的是
      //    两侧的侧栏（手牌列跑到屏幕外，实测越界 5px）。所以直接量"侧栏 + 中央 + 侧栏"的总宽。
      const tbEl=document.getElementById('table'), ceEl=document.querySelector('.center');
      const sdEls=document.querySelectorAll?document.querySelectorAll('.side'):[];
      let need=0, have=0;
      if(ceEl)need+=ceEl.scrollWidth||0;
      if(sdEls&&sdEls.forEach)sdEls.forEach(el=>{need+=el.offsetWidth||0;});
      if(tbEl)have=tbEl.clientWidth||0;
      const overRow=(rowEl&&typeof rowEl.scrollWidth==='number'&&rowEl.scrollWidth>rowEl.clientWidth+1);
      const overSides=(have>0&&need>have+1);
      if(!overRow&&!overSides)break;
      w2=Math.round(w2*0.9*10)/10;
      if(w2<12)break;
    }
  }
  }
}

function fitBacks(){
  const root=document.documentElement;
  const table=document.getElementById('table');
  if(!table||typeof table.getBoundingClientRect!=='function')return;
  const rectH=el=>(el&&typeof el.getBoundingClientRect==='function')?el.getBoundingClientRect().height:0;
  // --- 左右两家（竖排；亮牌时是 3 列网格）---
  [['leftHand','leftMelds'],['rightHand','rightMelds']].forEach(([hid,mid])=>{
    const hand=document.getElementById(hid);
    const side=hand&&hand.parentElement;
    if(!hand||!side||typeof hand.classList==='undefined')return;
    const reveal=hand.classList.contains('reveal');
    const ds=measureBack(hand,['--side-bw','--side-bh','--side-gap']);
    const designSideW=ds.w||15, designSideH=ds.h||21;
    const sideRatio=(designSideH/designSideW)||1.36;
    const tag=side.querySelector?side.querySelector('.nameTag'):null;
    const melds=document.getElementById(mid);
    let gap=3;
    if(typeof getComputedStyle==='function'){
      const gv=parseFloat(getComputedStyle(side).getPropertyValue('row-gap'));
      if(isFinite(gv))gap=gv;
    }
    const kids=side.children?side.children.length:1;
    // 可用高度按**实测坐标**算，而不是"格子高 - 各块高度"：侧栏可能有 padding
    // （横屏给整列加了 padding-top 让开右上角的悬浮按钮），高度相减会把这些让位漏算。
    // ⚠️ 上限必须取**整列盒子的下沿**（侧栏被 align-items:stretch 撑到牌桌内容区底部，
    //    位置稳定），再减去副露的**高度**；绝不能用副露的 top —— 副露在文档流里紧跟手牌列，
    //    top 会随 --side-bh 一起变，形成"缩小→可用更小→再缩小"的正反馈，
    //    最后把牌压成一叠（实测 13 张只剩 168px 高、还被挤到 97px 的盒子里溢出压住副露）。
    const rectOf=el=>(el&&el.getBoundingClientRect)?el.getBoundingClientRect():null;
    const sR=rectOf(side), tR=rectOf(tag);
    // ⚠️ 副露已搬到中排（各家的前面），**不在侧栏里了** → 只有它还在侧栏时才扣高度。
    const inRail=!!(melds&&side&&side.contains&&side.contains(melds));
    const mR=(inRail&&melds.children&&melds.children.length)?rectOf(melds):null;
    // 手牌列自己的上下留白（margin/padding）也要一起扣掉
    let handBox=0, meldsBox=0;
    if(typeof getComputedStyle==='function'){
      const hc=getComputedStyle(hand);
      handBox=(parseFloat(hc.marginTop)||0)+(parseFloat(hc.marginBottom)||0)
        +(parseFloat(hc.paddingTop)||0)+(parseFloat(hc.paddingBottom)||0);
      if(mR&&melds){
        const mc=getComputedStyle(melds);
        meldsBox=(parseFloat(mc.marginTop)||0)+(parseFloat(mc.marginBottom)||0);
      }
    }
    // ⚠️ 基准必须用**外框行高**，不能用侧栏自己的 bottom：
    //    侧栏现在 align-self:center（整块居中），它的 bottom 会随内容变化 ——
    //    拿它当基准就是「牌越大 → 可用越小 → 牌越小」的自反馈（实测会把整列压成一叠）。
    //    那一行是 flex:1 + align-items:stretch，高度由牌桌决定，稳定。
    const row=side.parentElement;
    const rowH=(row&&row.clientHeight)?row.clientHeight:((sR?sR.height:0)||0);
    const tagH=tR?tR.height:0;
    // 末尾留 8px 余量：副露在侧栏里紧跟在手牌列下面，实测两者边缘会碰 2~3px。
    const avail=Math.max(24, rowH-tagH-gap*((kids||1)-1)-handBox
      -(mR?(mR.height+meldsBox):0)-8);
    const n=hand.children.length;
    if(!n)return;
    // 亮牌 / 未亮牌**共用同一套算法**：一列 n 张、按可用高度排（原位置翻面，不重排）。
    // 牌背转 90° 后，每张在屏幕上占的"高度"是牌的**宽** → 按 bw 排高度、bh 由比例推。
    // 未亮牌：一列 n 张，先按"最小间距 1px"算能长多高，不够就叠压。
    const minGap=1;
    // （旧算法：按牌高排高度。牌转过 90° 后不适用，已改为按牌宽排。）
    // 宽度按比例推出。
    // 🔴 牌背是**转过 90° 的**（朝向这一家自己），所以它在屏幕上占的"高度"是牌的**宽**，
    //    不是牌高 —— 按 bw 排高度、bh 由比例推出来（与"竖排牌"的算法正好互换）。
    //    踩过：按牌高排高度 → 一列 13 张直接溢出侧栏、压住副露。
    let bw=Math.min(designSideW*1.25,(avail-minGap*(n-1))/n);
    let g=minGap;
    if(bw<7){ bw=7; g=(avail-bw*n)/(n-1||1); }
    let bh=Math.round(Math.max(12,bw*sideRatio)*10)/10;
    bw=Math.round(bw*10)/10;
    // 空间不够时先保住最小高度 12px，再把间距压成负数（牌叠压）。
    // ⚠️ 间距要按 n 张牌一起算：(avail − bh*n)/(n−1)。漏掉那个 n 会算出"正间距"，
    //    牌列总高反而比可用高度还大（实测 avail=113 却摆出 168px，溢出压住副露）。
    root.style.setProperty('--side-bw',bw+'px');
    root.style.setProperty('--side-bh',bh+'px');
    root.style.setProperty('--side-gap',(Math.round(Math.min(minGap,g)*10)/10)+'px');
  });
  // --- 对家（横排一整行）---
  const th=document.getElementById('topHand');
  if(th&&th.classList){
    const n=th.querySelectorAll?th.querySelectorAll('.back,.tile').length:0;
    if(n){
      const dt=measureBack(th,['--top-bw','--top-bh']);
      const designTopW=dt.w||18, designTopH=dt.h||25;
      // 可用宽度要扣掉左右内边距（竖屏给悬浮按钮留了 44px×2，见 CSS）
      let padX=0;
      if(typeof getComputedStyle==='function'){
        const cs=getComputedStyle(th);
        padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
      }
      const availW=(th.clientWidth||table.getBoundingClientRect().width)-padX;
      const gap=cssNum(th,'gap',1)||1;
      let bw=Math.min(designTopW*1.25,(availW-gap*(n-1)-2)/n);
      if(!isFinite(bw)||bw<=0)bw=designTopW;
      bw=Math.max(8,Math.round(bw*10)/10);
      const bh=Math.min(designTopH*1.25,Math.round(bw*1.36*10)/10);
      root.style.setProperty('--top-bw',bw+'px');
      root.style.setProperty('--top-bh',bh+'px');
    }
  }
}
function syncLayout(){
  const root=document.documentElement;
  const mh=document.getElementById('myHand');
  const mm=document.getElementById('myMelds');
  const ac=document.getElementById('actions');
  // 量不到尺寸就跳过（Node 端逻辑测试用的是轻量 DOM 桩，没有布局能力）
  if(!mh||typeof mh.getBoundingClientRect!=='function')return;
  const rectH=el=>(el&&typeof el.getBoundingClientRect==='function')
    ?el.getBoundingClientRect().height:0;
  const handRaw=rectH(mh);                                   // 只有手牌
  const meldH=(mm&&mm.children.length)?rectH(mm):0;          // 只有副露
  const handH=handRaw+meldH;
  // 手牌顶边（操作条锚点，不含副露）—— 必须最先写，后面量操作条要用到它
  root.style.setProperty('--hand-raw-h',Math.round(handRaw)+'px');
  // 副露顶边（副露站在操作条之上，见 CSS）
  root.style.setProperty('--hand-h',Math.round(handH)+'px');
  // 顶部那块（对家名字 + 手牌背面 + 副露）占多高 —— 收起态结算窗（peek）用它算最大高度：
  // 窗体停在底部往上长，长过头就会顶到对家的手牌（实测横屏压到 16x6）。写进 --top-h 给 CSS 用。
  {
    const rB=el=>{
      if(!el||typeof el.getBoundingClientRect!=='function')return 0;
      const b=el.getBoundingClientRect();
      return (b.height>0)?b.bottom:0;
    };
    const topH=Math.max(rB(document.getElementById('topHand')),rB(document.getElementById('topMelds')))+6;
    if(topH>0)root.style.setProperty('--top-h',Math.round(topH)+'px');
  }
  // 操作条高度：**实测**。它是绝对定位的浮层，高度只取决于按钮和容器宽度，
  // 与自己的 bottom 无关，所以直接量不会形成循环依赖（旧注释担心的循环不存在）。
  // 用实测值的理由：按钮多到换行时（碰 + 过 + 多个杠），实际高度能到 110px+，
  // 写死 56px 会让预留高度不够 → 副露被迫站在按钮里面、弃牌区伸到按钮底下（互相遮挡）。
  let actH=0;
  if(ac&&ac.children.length){
    // ⚠️ 必须区分"有按钮"和"有按钮但被藏起来"：
    // 完局时 body.isOver 会把操作条 display:none（不让它浮在结算窗上），
    // 此时若还按 ACT_H() 预留，副露会被顶高 56px、和手牌之间空出一条缝，
    // 结算窗也可能盖在副露上。所以先看计算样式，藏起来就按 0 算。
    const cs=(typeof getComputedStyle==='function')?getComputedStyle(ac):null;
    if(!(cs&&cs.display==='none')){
      const measured=rectH(ac);
      actH=Math.round(measured>0?measured:ACT_H());
    }
  }
  // 结算后底部会多出「本局详情 / 再来一局」两个按钮，它们与操作条**共用同一层**
  //（手牌正上方的那条空档）。把它的实测高度并进 actH：
  //   ① 预留高度够 → 按钮不会压到牌桌的弃牌区；
  //   ② 副露的 bottom 是 handRaw+pad+actH，会自动站到按钮之上，不被压住。
  // ⚠️ 完局时操作条是 display:none（actH 本来算 0），这一层正好让给这两个按钮。
  const eb=document.getElementById('endBtns');
  if(eb&&eb.classList&&eb.classList.contains('on')){
    const bh=Math.round(rectH(eb));
    if(bh>0)actH=Math.max(actH,bh+22);           // +22 = 上下留气，也给"建议打出的牌"的弹跳留出空间
    // bottom 抬高到 14px：手牌里那张「建议打出的牌」有弹跳动画（向上 9px），
    // 贴太近会被按钮压住（实测 myHand .sug × #reopen 相交 2px）。
    if(eb.style)eb.style.bottom=Math.round(handRaw+botPad()+14)+'px';
  }
  root.style.setProperty('--act-h',actH+'px');
  // ⚠️ 预留里必须带上手牌底部那块留白（--bot-pad，竖屏比横屏大，见 CSS）：
  // 漏掉它，牌桌内容区会往下多伸那么多，压到副露/手牌上（实测 1~3px 的相压）。
  const BOT_PAD=botPad();
  const LIFT=10;   // 预选牌抬起的高度（见 .hand .tile.picked 的注释）；底部整摞必须预留这么多
  root.style.setProperty('--reserve',Math.round(handRaw+actH+meldH+BOT_PAD+LIFT)+'px');
  // 三层位置直接落成内联值：同一帧内就位，不依赖 CSS 变量在下一帧才生效。
  //  手牌贴底 → 操作条落在手牌上沿 → 副露再落在操作条上沿
  if(mh.style)mh.style.bottom=BOT_PAD+'px';
  if(ac&&ac.style)ac.style.bottom=Math.round(handRaw+BOT_PAD+LIFT)+'px';   // 让开预选牌的抬起区
  if(mm&&mm.style)mm.style.bottom=Math.round(handRaw+BOT_PAD+actH+LIFT)+'px';
  // 最后再算他家手牌背面：这一步依赖上面刚写好的 --reserve
  // （预留变高 → 牌桌变矮 → 侧栏可用高度跟着变），所以必须放在最后。
  fitBacks();
  fitDiscards();   // 弃牌尺寸跟手牌对齐（必须在 fitRow 之后）
}
function render(){
  const mh=document.getElementById('myHand');mh.innerHTML='';  // 理牌顺序：万→条→筒，同花色内 1→9 从小到大（与真实麻将摆牌惯例一致）
  const list=toList(G.hands[PLAYER]);list.sort((a,b)=>a-b);
  const drawnTile=(G.drawn!==null&&G.phase==='discard')?G.drawn:null;
  // 该你出牌时算一张"建议打出的牌"：碰/杠之后没有"刚摸到的那张"，手牌 11 张肉眼很难挑。
  // 只在轮到玩家、且没有待决动作（碰/杠/胡按钮）时算。
  const myTurn=(G.phase==='discard'&&G.turn===PLAYER&&!G.pendingAction);
  const sug=myTurn?suggestCard(PLAYER):null;
  // 碰完（G.drawn===null）没有可参考的牌 → 把日志栏高亮起来（文字由碰/杠流程写好：
  // 「碰了 X，该你出牌 · 建议打 Y」），配合手牌上那张绿色虚线牌一起提示。
  // 正常摸牌不高亮：金色的"刚摸到的牌"本身已经够醒目，每回合都闪反而吵。
  if(myTurn&&sug!==null&&G.drawn===null)showTip(null);
  else if(!myTurn||G.drawn!==null)hideTip();
  // ===== 「现在就能碰/杠」的临场提醒 =====
  // 常驻标记（成对的牌底下画色条）已按用户反馈去掉：看不明白那是什么、只显得牌面脏。
  // 这里只处理"别人刚打出这张、我现在真的能碰/杠"的情况 → 让手里那一组牌跳出来，
  // 配合操作条的「碰 / 可碰 X / 过」按钮，含义明确。
  const paC=G.pendingAction;
  const wantP=(paC&&paC.type==='peng')?paC.card:null;
  const wantG=(paC&&(paC.type==='gang'||paC.type==='angang'||paC.type==='bugang'))?paC.card:null;
  // 统计每种牌在手牌中出现的次序，用于给同一张牌的第2/3/4张加角标
  // 预选的牌必须还在手里（碰/杠/换局后可能已经没了），否则清掉，避免"幽灵预选"
  if(G.picked!==null&&!G.hands[PLAYER][G.picked])G.picked=null;
  // ===== 同一时间**只允许一张牌立起来**（用户要求）=====
  // 有预选牌时，其它牌一律"收回手牌"：
  //   · "刚摸到"的那张不再抬起（只留细金环，给 CSS 的 #myHand.picking 去处理）——
  //     否则它和预选牌会双双立着，看不出到底要打哪张；
  //   · "建议打出的那张"的绿色虚线框 + 弹跳整个收掉（建议文字日志里还看得到）；
  //   · 顺手解决一个隐患：若预选的正好是"刚摸到"的那张，两个抬起叠加会有 -20px，
  //     抬进副露里。
  const picking=(G.picked!==null);
  mh.classList.toggle('picking',picking);
  const seen={};
  list.forEach(c=>{
    const k=seen[c]=(seen[c]||0);seen[c]++;
    const el=tileEl(c,false,k);
    // 摸到的牌自动插回它应在的位置（不甩到末尾），仅加金色高亮
    if(drawnTile!==null&&c===drawnTile&&k===G.hands[PLAYER][c]-1)el.classList.add('drawn');
    // 预选：这张牌抬起 + 金框（同一种牌可能有多张，只在最后那一份上加，避免整组一起抬）
    if(G.picked!==null&&c===G.picked&&k===G.hands[PLAYER][c]-1)el.classList.add('picked');
    // 建议打出的那张：绿色虚线框（和"刚摸到"的金色高亮区分开，两张同时出现也看得懂：
    // 金色=你摸到的是这张，绿色虚线=建议打这张）
    // ⚠️ 但**已经预选了别的牌**时不再标（预选牌保留绿框/弹跳会变成两张牌同时立着）。
    else if(!picking&&sug!==null&&c===sug&&k===G.hands[PLAYER][c]-1)el.classList.add('sug');
    if(wantP!==null&&c===wantP)el.classList.add('wantpeng');
    else if(wantG!==null&&c===wantG)el.classList.add('wantgang');
    el.onclick=()=>onTileClick(c);
    mh.appendChild(el);
  });
  // 自己可胡时整排手牌泛光，提示"该你胡了"
  const canZimo=G.phase==='discard'&&G.turn===PLAYER&&G.drawn!==null&&canHu(G.hands[PLAYER],G.melds[PLAYER],{zimo:true});
  mh.classList.toggle('huReady',canZimo);
  // 自己的副露（含类型标签）
  const mm=document.getElementById('myMelds');mm.innerHTML='';
  G.melds[PLAYER].forEach(m=>mm.appendChild(meldEl(m,false)));
  // 三家手牌 + 副露（正面，摆在自己一侧，方便查看别人碰杠了什么）
  // 完局（phase==='over'）或玩家手动亮牌后，三家手牌全部翻正面：能看清每家到底叫了什么、差哪张
  const reveal=(G.phase==='over'||G.revealAll===true);
  // 座位映射：**左＝上家(3)、右＝下家(1)**、上＝对家(2)。
  // 这样 turn 递增（p+1）在屏幕上看就是**逆时针** —— 麻将的取牌/出牌方向。
  [[3,'leftHand','leftMelds'],[2,'topHand','topMelds'],[1,'rightHand','rightMelds']].forEach(([p,hid,mid])=>{
    const h=document.getElementById(hid);h.innerHTML='';
    // 这一家的朝向：左＝上家(+90°)、右＝下家(-90°)；对家 180° 由容器 rotate 处理、自己 0°。
    const rot=(p===3)?1:(p===1)?-1:0;
    h.classList.toggle('reveal',reveal);
    h.classList.toggle('revealWin',reveal&&G.result&&G.result.winner===p);
    if(reveal){
      // 亮牌：按 万→条→筒、同花色 1→9 理牌，与玩家自己手牌的排序口径一致
      const list=toList(G.hands[p]);list.sort((a,b)=>a-b);
      const seen={};
      list.forEach(c=>{
        const k=seen[c]=(seen[c]||0);seen[c]++;
        const el=tileEl(c,false,k);
        // 胡牌那张（点炮得的那张不在手牌里）标出金色边框
        if(G.result&&G.result.winner===p&&G.result.winTile===c&&k===G.hands[p][c]-1)el.classList.add('drawn');
        if(rot){const bx=document.createElement('div');bx.className='tbox bk'+(rot<0?' r':'');bx.appendChild(el);h.appendChild(bx);}
        else h.appendChild(el);

    }else{

    for(let i=0;i<27;i++){

      if(G.hands[PLAYER][i]>=4&&canMelded(PLAYER,'angang'))

    G.melds[PLAYER].forEach(m=>{if(m.type==='peng'&&G.hands[PLAYER][m.card]>=1&&canMelded(PLAYER,'bugang'))mkBtn('补杠'+cname(m.card),'gray',()=>doBuGang(PLAYER,m.card),'爬坡豆：叫牌时三家各付 3 个（有被抢杠的风险）');});

  if(document.body&&document.body.classList)

  syncLayout();

/* ===== 出牌：**两步确认**（用户明确要求）=====
   ① 点**任何**没被预选的牌 → 只是把它预选并弹起来（**不会打出**，包括"建议打出的那张"）；
   ② 点**当前预选的那张** → 才真的打出。
   换牌时旧的那张自动收回（任何时刻只有一张是预选态）；收回去的那张再点一次又是"弹起来"，
   不会因为"曾经预选过"就变成一点即出。
   ⚠️ 曾经留过一条"点建议牌一点即出"的快捷路径 —— 用户实测后否掉了：那会让"点其它牌"
      偶尔直接打出去（点到的正好是建议牌时），和"两步确认"的预期冲突。
   ⚠️ 预选的视觉必须**不影响布局**：用 transform 抬起（不改宽高、不挤动旁边的牌），
      并且底部整摞预留了 10px 的「抬起区」（见 syncLayout 的 LIFT），抬起时不会压到副露。 */
function onTileClick(c){
  // 点得动就"嗒"、点不动（不是自己回合 / 有动作待决）就"唔" —— 手感和提示一次给足。
  // 音频引擎在没有 WebAudio、被静音、还没解锁时都是**静默空转**，绝不影响牌局逻辑。
  if(G.phase!=='discard'||G.turn!==PLAYER||G.pendingAction){SFX.play('deny');return;}
  if(c===G.picked){                    // 就是当前预选的那张 → 打出
    G.picked=null;
    discard(PLAYER,c);
    return;
  }
  G.picked=c;                          // 其它牌一律先预选（弹起来），等下一次点击
  SFX.play('tap');                     // 选中：轻点一声
  log('已选中 '+cname(c)+'，再点一次出牌');
  render();
}

/* ===== 提示：建议打哪张 =====
   碰/杠之后手牌里没有"刚摸到的那张"可参考，玩家常常不知道该打哪张
   （尤其是碰完只剩 11 张，肉眼很难看出哪张最该丢）。
   建议算法直接复用 AI 的出牌启发式 aiDiscardSmart()：向听数优先、
   兼顾进张数、危险度和番型倾向 —— 人和 AI 用同一套判断，行为一致、也不额外维护两份逻辑。
   注意它只读 G（对 counts 的加减是配对的），不会污染牌局状态。 */
function suggestCard(p){
  p=(p===undefined)?PLAYER:p;
  const hand=G.hands[p];
  if(!hand)return null;
  if(hand.reduce((a,b)=>a+b,0)%3!==2)return null;   // 不是"该出牌"的张数（如杠完补摸前）
  if(p===PLAYER&&typeof aiDiscardSmart==='function')return aiDiscardSmart(p);
  return (typeof aiDiscardSmart==='function')?aiDiscardSmart(p):null;
}

/* 最新牌的"放大兜底"函数已删除：

// 横竖屏切换 / 窗口尺寸变化时重算布局。
// 这里直接走 render()：旋转后不只是底部高度变了，牌宽、字号、他家手牌背面的

// 事件监听做存在性判断：Node 端跑逻辑测试时用的是轻量 DOM 桩，没有这些方法。
if(typeof window.addEventListener==='function'){
/* ===== 牌河裁切兜底（用户反馈：iPad Pro 11 横屏、上/下家的牌河摆成两行后牌被裁）=====
   ⚠️ 这个函数以前是**空转的**（2026-09-16 修）—— 两个 bug 叠在一起，看起来在跑、其实什么都没做：
     ① 判据用 z.scrollWidth/scrollHeight：牌河是 flex-wrap + overflow:hidden 的容器，
        溢出量在某些内核上根本报不出来（scrollHeight === clientHeight）→「超了才缩」永不触发；
     ② 缩的时候写在 **root** 的 --dtw/--dth 上：可每块牌河在 fitDiscards 里被写了**它自己元素上**的
        内联 --dtw/--dth（内联声明优先于继承来的值）→ 改 root 对四块牌河一律无效。
   现在改成「量真实几何 + 只缩溢出的那一块」：
     · 溢出量 = **子元素 rect 的并集超出牌河 client rect** 的部分 —— getBoundingClientRect 在任何引擎上
       都可信，而且它报的是**布局位置**，不会被父级的 overflow:hidden 影响（这正是要看的东西）；
     · 四边都量（上下两家的牌河是 justify-content:center，内容超宽时左右两边会一起溢出）；
     · 哪一块溢出就缩哪一块（只改那一块自己的内联 --dtw/--dth）；只缩不放大（放大由 fitDiscards 负责）；
     · 有下限（11px）与轮次上限，不会死循环。
   触发：① fitDiscards 末尾**同步**调一次（本次渲染就不会闪出被裁的样子）；
         ② 防抖的 MutationObserver —— 兜住"不是 render 引起的"布局变化（换字体、图片就位、旋转）。 */
function fitDiscardClipGuard(){
  if(!document.getElementById||!document.documentElement)return;
  const ids=['discardLeft','discardRight','discardTop','discardBottom'];
  const EPS=0.5;
  for(let step=0;step<40;step++){
    let worst=null,worstOver=EPS;
    for(let q=0;q<ids.length;q++){
      const z=document.getElementById(ids[q]);
      if(!z||!z.children||!z.children.length)continue;
      if(typeof z.getBoundingClientRect!=='function')continue;
      if(!(z.clientWidth>0)&&!(z.clientHeight>0))continue;      // 整块不可见 → 跳过
      const zb=z.getBoundingClientRect();
      const boxR=zb.left+z.clientWidth, boxB=zb.top+z.clientHeight;
      let maxR=-1e9,maxB=-1e9,minL=1e9,minT=1e9;
      for(let i=0;i<z.children.length;i++){
        const b=z.children[i].getBoundingClientRect();
        if(b.width<=0&&b.height<=0)continue;                    // display:none 的牌不算
        if(b.right>maxR)maxR=b.right;
        if(b.bottom>maxB)maxB=b.bottom;
        if(b.left<minL)minL=b.left;
        if(b.top<minT)minT=b.top;
      }
      if(maxR===-1e9)continue;
      const over=Math.max(maxR-boxR, maxB-boxB, zb.left-minL, zb.top-minT);
      if(over>worstOver){worstOver=over;worst=z;}
    }
    if(!worst)return;                       // 没有溢出 → 立刻返回（绝大多数情况走这条）
    const cur=parseFloat(worst.style.getPropertyValue('--dtw'));
    const curH=parseFloat(worst.style.getPropertyValue('--dth'));
    if(!isFinite(cur)||cur<=0)return;
    if(cur<=11)return;                      // 已经很小了，别再缩（宁可略溢出也别看不清）
    // 步子按溢出量给：小溢出就微调（4% 左右，避免不必要的缩小），大溢出最多一步 10%
    // —— 收敛到"刚好放得下"时最多比理论最优小 10%，且轮数有限（40 步覆盖 0.9^40≈1.5%）。
    const k=Math.max(0.90, 1-Math.min(worstOver,20)/Math.max(curH||cur,1));
    const nx=Math.round(cur*k*10)/10;
    if(!(nx<cur))return;
    worst.style.setProperty('--dtw',nx+'px');
    worst.style.setProperty('--dth',Math.round((curH||cur)*k*10)/10+'px');
  }
}
if(typeof MutationObserver==='function'&&document.body){
  let _clipT=0;
  const _clipCheck=()=>{clearTimeout(_clipT);_clipT=setTimeout(()=>{try{fitDiscardClipGuard();}catch(e){}},120);};
  try{new MutationObserver(_clipCheck).observe(document.body,{childList:true,subtree:true});}catch(e){}
  window.addEventListener('resize',_clipCheck);
  window.addEventListener('orientationchange',_clipCheck);
  setTimeout(_clipCheck,900);                // 首屏再兜一次（首次布局可能早于字体/图片就位）
}
  window.addEventListener('resize',onViewportChange);
  window.addEventListener('orientationchange',onViewportChange);
}
if(window.visualViewport&&typeof window.visualViewport.addEventListener==='function')
  window.visualViewport.addEventListener('resize',onViewportChange);

// ===== 全屏 =====
// 手机上「地址栏吃掉 60~100px」是竖屏最大的空间浪费，也是横屏最容易崩布局的地方。
// 三条路兜底：
//   ① 页面 meta（x5-fullscreen / mobile-web-app-capable / manifest）——国产浏览器与"加到桌面"生效
//   ② 右上角按钮 → Fullscreen API（小米浏览器/Chrome/微博等都支持）
//   ③ 不支持的内核（iPhone Safari）直接把按钮藏掉，不给一个点了没反应的假按钮
(function initFullscreen(){
  const btn=document.getElementById('fsBtn');
  if(!btn)return;
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen;
  const exit=document.exitFullscreen||document.webkitExitFullscreen||document.webkitCancelFullScreen;
  if(typeof req!=='function'){ btn.style.display='none'; return; }
  const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  function enterFS(){ try{ const r=req.call(el); if(r&&typeof r.catch==='function')r.catch(()=>{}); }catch(e){} }
  function exitFS(){ try{ if(typeof exit==='function')exit.call(document); }catch(e){} }
  btn.onclick=()=>{ SFX.play('tap'); isFS()?exitFS():enterFS(); };
  const onChange=()=>{
    const on=isFS();
    if(document.body&&document.body.classList)document.body.classList.toggle('isFS',on);
    btn.title=on?'退出全屏':'全屏';
    btn.setAttribute('aria-label',btn.title);
    onViewportChange();        // 进出全屏会改变可视高度，重排一次
  };
  if(typeof document.addEventListener==='function'){
    document.addEventListener('fullscreenchange',onChange);
    document.addEventListener('webkitfullscreenchange',onChange);
  }
})();

// ===== 启动：先读本地记录 —— 有名字就直接开局（庄家摇色子），没名字先取名 =====
/* ===== 音效开关按钮 =====
   与全屏按钮同一角落（排在它左边）。浏览器不支持 WebAudio 时把按钮藏掉 ——
   不给一个点了没反应的假开关（和全屏按钮的处理一致）。 */
(function initSoundToggle(){
  const btn=document.getElementById('sndBtn');
  if(!btn)return;
  if(!SFX.available){ btn.style.display='none'; return; }
  const sync=()=>{
    const on=SFX.on();
    if(document.body&&document.body.classList)document.body.classList.toggle('sndOff',!on);
    btn.title=on?'音效：开（点击关闭）':'音效：关（点击打开）';
    btn.setAttribute('aria-label',on?'音效开':'音效关');
  };
  sync();
  btn.onclick=()=>{ SFX.toggle(); sync(); SFX.play('tap'); };   // 打开的那一下用一声"嗒"作确认
})();
/* ===== 语音播报 VOICE（方案 A：浏览器自带语音合成）=====
   用途：把"打出的牌"念出来（例如"一万""三筒"），方便不看屏幕也能跟上牌局。
   取舍（方案 A 的代价，用户已知悉）：音色随设备/系统语音包而变、不占体积、不联网；
   若要统一音色就得内嵌预录音频片段（方案 B，约 +400KB），当前不做。
   三条纪律：
     ① 与音效开关**各自独立**（各存各的键），互不影响；
     ② 连续出牌时**先 cancel 再念** —— 否则队列堆积，念出来的牌和桌上对不上；
     ③ 不支持语音合成的浏览器：supported=false，按钮直接藏掉，不留假开关。 */
const VOICE=(function(){
  const KEY='gymj.voice.v1';
  // 🔴 默认**关闭**（用户 2026-09-16）：不点开关就不出声。用户手动开过一次之后，
  //    存档里的 '1' 会覆盖这个默认值（状态照旧记住）。
  let on=false;
  try{ const v=localStorage.getItem(KEY); if(v!==null) on=(v==='1'); }catch(e){}
  const NUM=['一','二','三','四','五','六','七','八','九'];
  const sup=(typeof speechSynthesis!=='undefined')&&(typeof SpeechSynthesisUtterance!=='undefined');
  // 牌名：与界面一致的"花色 + 点数"读法（一万/三筒/六条）
  const name=c=>NUM[c%9]+SUIT[(c/9)|0];
  // 中文语音：安卓/iOS 上 getVoices() 头一次往往是空的，得等 voiceschanged 再取一遍；
  // 优先用装在本机的中文语音（localService）—— 网络语音没网时不出声。
  let zhVoice=null;
  function pickVoice(){
    try{
      const vs=speechSynthesis.getVoices()||[];
      const zh=vs.filter(v=>/^zh([-_](CN|Hans|SG))?$/i.test(v.lang||'')||/中文|普通话|Chinese/i.test(v.name||''));
      zhVoice=zh.find(v=>v.localService)||zh[0]||null;
    }catch(e){ zhVoice=null; }
  }
  if(sup){
    pickVoice();
    try{ speechSynthesis.addEventListener('voiceschanged',pickVoice); }
    catch(e){ try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e2){} }
  }
  // 安卓/iOS：用户碰页面之前，朗读会被浏览器静默拦掉。第一次触摸时无声"热身"一句，
  // 顺便再取一次语音列表（这时安卓才会把中文语音列出来）。
  let warmed=false;
  function warmUp(){
    if(warmed||!sup)return;
    warmed=true;
    pickVoice();
    try{
      const u=new SpeechSynthesisUtterance(' ');
      u.volume=0; u.rate=1; u.lang='zh-CN';
      speechSynthesis.speak(u);
      setTimeout(()=>{try{speechSynthesis.cancel();}catch(e){}},60);
    }catch(e){}
  }
  if(sup&&typeof window!=='undefined'){
    ['pointerdown','touchstart','keydown'].forEach(ev=>{
      try{ window.addEventListener(ev,warmUp,{once:true,passive:true}); }catch(e){}
    });
  }
  let seq=0;
  function say(txt){
    if(!on||!sup||!txt)return;
    let busy=false;
    try{ busy=!!(speechSynthesis.speaking||speechSynthesis.pending); }catch(e){}
    const my=++seq;
    try{ speechSynthesis.cancel(); }catch(e){}    // 掐掉上一句，避免队列堆积
    const fire=()=>{
      if(my!==seq||!on)return;                   // 这期间又出了张牌 → 这一句作废
      try{
        if(speechSynthesis.paused)speechSynthesis.resume();   // 安卓有时卡在 paused 后就不再出声
        const u=new SpeechSynthesisUtterance(txt);
        u.lang='zh-CN'; u.rate=1.15; u.pitch=1;
        if(zhVoice)u.voice=zhVoice;
        speechSynthesis.speak(u);
      }catch(e){}
    };
    // 安卓：cancel() 之后紧接着 speak() 偶尔会被吞掉 → 正念着的时候让出一个 tick 再念
    if(busy)setTimeout(fire,40); else fire();
  }
  return {
    supported:sup,
    on:()=>on,
    toggle(){ on=!on; try{localStorage.setItem(KEY,on?'1':'0');}catch(e){}
      if(!on&&sup){ try{speechSynthesis.cancel();}catch(e){} } return on; },
    tile:c=>say(name(c)),
  };
})();

/* ===== 语音开关按钮（与音效按钮同款、挨在它左边）=====
   顺序很关键：先 initSoundToggle 再 initVoiceToggle —— 音效按钮占了 right:6/52，
   语音按钮放在它左边（right:52 / 矮横屏 98），两个不会叠。 */
(function initVoiceToggle(){
  const btn=document.getElementById('voiceBtn');
  if(!btn)return;
  if(!VOICE.supported){ btn.style.display='none'; return; }
  const sync=()=>{
    const on=VOICE.on();
    if(document.body&&document.body.classList)document.body.classList.toggle('voiceOff',!on);
    btn.title=on?'语音：开（点击关闭）':'语音：关（点击打开）';
    btn.setAttribute('aria-label',on?'语音开':'语音关');
  };
  sync();
  btn.onclick=()=>{ VOICE.toggle(); sync(); };
})();

(function initGame(){
  Store.load();
  updateMyName();
  // 点积分板上自己那一行 → 改名 / 换记录
  const sb=document.getElementById('scoreBoard');
  if(sb&&typeof sb.addEventListener==='function'){
    sb.addEventListener('click',e=>{
      const t=e.target;
      const row=(t&&typeof t.closest==='function')?t.closest('.srow.mine'):null;
      if(row)openNameDlg(false);
    });
  }
  const ok=document.getElementById('nameOk');
  if(ok)ok.onclick=confirmName;
  const rr=document.getElementById('nameReroll');
  if(rr)rr.onclick=()=>{const i=document.getElementById('nameInput');if(i){i.value=randomName();try{i.select();}catch(e){}}};
  const cl=document.getElementById('nameClear');
  if(cl)cl.onclick=clearRecAndKeep;
  const inp=document.getElementById('nameInput');
  if(inp&&typeof inp.addEventListener==='function')
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')confirmName();});
  if(Store.data.name&&Store.data.name.trim()){
    const r=Store.rec(Store.data.name);
    G.scores=r.scores.slice();G.dealer=r.dealer;G.nextDealer=null;G.handNo=r.hands||0;
    Store.save();                       // 把补全过的字段顺手写回去
    startHand();
  }else{
    openNameDlg(true);                  // 首次进入：先取名，确认后自动开第一局
  }
})();
