<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b3d2e">
<!-- 国产浏览器（小米/UC/QQ/微信 X5 内核）的全屏+应用模式声明：
     小米浏览器、UC、微信内置浏览器认这些 meta，能在不加壳的情况下吃掉状态栏/地址栏。
     再配合右上角的「全屏」按钮（Fullscreen API）与 manifest，多一条兜底路径。 -->
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<meta name="x5-page-mode" content="app">
<meta name="browsermode" content="application">
<meta name="screen-orientation" content="any">
<link rel="manifest" href="manifest.webmanifest">
<title>贵阳捉鸡麻将</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 安全区变量：iPhone 刘海/Home 条、iPad 圆角都会缩进内容，避免按钮被遮住 */
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  /* 触控区最小边长：手机端按钮一律不小于这个值 */
  --tap:46px;
  /* ===== 他家手牌背面的「设计尺寸」=====
     JS 的 fitBacks() 会按实测可用空间在这个基准上缩放（放大到 1.25 倍为止，
     放不下则等比缩、极端时改成叠压），这是"任何屏幕都不溢出、不遮挡"的保险。
     这几条只是各设备档的设计值 + JS 不可用时的兜底，设备档在下面的媒体查询里覆盖。
       --back-w/h : 对家（横向一整排 13 张）
       --side-w/h : 左右两家（纵向一整列 13 张）
       --side-gap : 左右两家背面之间的间距，压不下时被 JS 改成负值（叠压） */
  --back-w:22px;--back-h:30px;
  --side-w:22px;--side-h:30px;
  --side-gap:1px;
  /* ===== 底部整摞（手牌/操作条/副露）距屏幕底边的距离 =====
     8px 是"高度紧张"时的兜底值；竖屏屏幕高、中下部本来就有富余，
     把手牌抬起来一截才按得准、也不至于贴着屏幕边缘（见下面的竖屏规则）。
     ⚠️ 这个变量里会写 clamp()/vh，JS 侧必须用"塞进元素量高度"的
        办法读它的真实像素值（syncLayout 里的 botPad()），不能 parseFloat。 */
  --bot-pad:8px;
}
html{height:100%}
/* 关键：用 100dvh 而不是 100vh。
   手机上浏览器地址栏会动态伸缩，100vh 会算成"没有地址栏时的高度"，
   导致底部内容被地址栏盖住、或者出现整页滚动。dvh 会跟着视口实时变。 */
body{
  font-family:-apple-system,"PingFang SC",sans-serif;background:#0b3d2e;color:#fff;
  height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;              /* 禁掉下拉刷新/橡皮筋 */
  touch-action:manipulation;             /* 去掉 300ms 点击延迟、禁双击缩放 */
  padding:var(--sat) var(--sar) var(--sab) var(--sal);
}
/* 底部预留 = 手牌高度 + 操作条高度（由 JS 写入 --reserve）。
   #myMelds / #actions / #myHand 都绝对定位到底部，不参与 flex 分配；
   牌桌剩下的高度全给中央弃牌区，不再出现"中间一大片空白"。 */
#table{flex:1;position:relative;display:flex;flex-direction:column;min-height:0;
  padding-bottom:var(--reserve,0px)}
.row{display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:wrap}
.back{width:22px;height:30px;background:linear-gradient(135deg,#1e6f4a,#0d4a30);border:1px solid #2a8f60;border-radius:3px}
.tile{width:38px;height:52px;background:linear-gradient(175deg,#fffef8,#f4f2e6);border-radius:5px;display:block;border:1px solid #cfcbb8;box-shadow:0 2px 4px rgba(0,0,0,.35),inset 0 1px 0 #fff;position:relative;overflow:hidden;flex:0 0 auto}
.tile svg{display:block;width:100%;height:100%}
/* 牌面左上角小数字：仅手牌显示（方便辨认同花色，真牌也有类似角标） */
.tile .k{position:absolute;top:1px;left:2px;font-size:7px;color:#b9b4a0;font-weight:700;z-index:2;line-height:1}
/* 弃牌尺寸与手牌一致：数值由 JS 写进 --dtw/--dth（见 fitDiscards），各档只限最大值。
   🔴 不要再逐档写死弃牌尺寸 —— 那是"弃出去的牌比手上的小一圈"的根源（用户实测反馈）：
      写死的数字和手牌尺寸是两套，手牌一变就对不上。 */
.discardZone .tile,.discardZone .tile.small{width:var(--dtw,26px);height:var(--dth,35px);border-radius:3px}
/* 🔴 必须把 .tile.small 一起写上：档位里有 `.tile.small{width:20px;height:27px}`，
   它和 `.discardZone .tile` 同为两段类选择器、又写在后面 → 会盖掉这里的尺寸，
   结果「弃出去的牌比手上小一圈」（用户实测反馈），而且 JS 缩小时占位盒缩了、牌不缩，
   牌顶出占位盒被 overflow 裁掉。这里用三段选择器（.discardZone .tile.small）稳赢。 */
/* 左右两家牌横躺 → 占位盒宽高互换（尺寸同源，永远成对） */
.tile.small{width:28px;height:38px}
.tile.small .k{display:none}
.hand .tile.drawn{outline:2px solid #ffd700;outline-offset:1px}
.melds .tile.small{width:24px;height:33px}
/* 手牌强制一行（真麻将手牌就是一排）：牌宽由 JS 按可用宽度算，刚好铺满一行。
   原来 flex-wrap:wrap 在窄屏上会把末尾几张挤到第二行，整排变高、观感也乱。 */
.hand{display:flex;gap:3px;justify-content:center;padding:6px;flex-wrap:nowrap;min-height:60px}
.hand .tile{cursor:pointer;transition:transform .1s}
.hand .tile:active{transform:translateY(-8px)}
.hand .tile.drawn{margin-top:-10px;box-shadow:0 4px 8px #ffd700}
/* 「建议打出的牌」：碰/杠之后手牌里没有"刚摸到的那张"可参考，玩家常常不知道该打哪张。
   JS 会算一张最优解给它绿色虚线框 + 弹跳三下（"弹出这张牌"的感觉）。
   用 outline（不参与布局）而不是 border —— 手牌是"按可用宽度刚好铺满一行"算出来的，
   任何占位的描边都会把牌宽算偏。
   注意：不额外加浮层提示——手牌上方那条道是"自己弃牌区"、中央是积分板，
   浮层放到哪都会压牌（实测被测量脚本抓到过），所以让牌自己动最有辨识度。 */
.hand .tile.sug{outline:2px dashed #43e0a0;outline-offset:2px;
  background:linear-gradient(175deg,#f2fff9,#dcf6ea);
  animation:sugPop 1.5s ease-in-out 3}
@keyframes sugPop{
  0%,100%{transform:translateY(0);box-shadow:0 0 0 0 rgba(67,224,160,0)}
  40%{transform:translateY(-9px);box-shadow:0 0 14px 3px rgba(67,224,160,.85)}}
/* 预选（点了一下、还没打出）：抬起 + 金色实线框，一眼看清"再点一次就打出去"。
   ⚠️ 抬起必须用 transform（纯视觉、不改占位）：用 margin/height 抬会重排整行、旁边的牌跟着动。
   ⚠️ 抬起 10px 不能压到上面的副露/操作条 → 底部整摞预留了同样高度的"抬起区"
      （syncLayout 里的 LIFT，已经算进 --reserve）。 */
.hand .tile.picked{transform:translateY(-10px);z-index:5;
  outline:3px solid #ffd700;outline-offset:-3px;
  box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 0 10px rgba(255,215,0,.45)}
/* 「能碰 / 能杠」的牌：**不做常驻标记**。
   曾给成对的牌在底部画一条橙色/紫色色条，实测用户根本看不出那是"可碰"的意思，
   只觉得牌下面多了一条横线、干扰视线 —— 所以去掉。
   现在只在"别人刚打出这张牌、你现在真的能碰/杠"时提示（下面的 .wantpeng/.wantgang：
   虚线框 + 弹跳），配合操作条的「碰 / 可碰 X / 过」按钮，含义明确、平时不占视线。 */
/* 临场提醒：别人正打出这张牌、你现在就能碰/杠 → 这一组牌加虚线框 + 弹跳（与"建议打出的牌"
   同款动效）。虚线框用负 offset 画在牌内部：手牌间隙只有 2~4px，向外画会盖住邻牌。
   ⚠️ 与 .sug 不会打架：.sug 只在"该你出牌、无待决动作"时出现，
   .wantpeng/.wantgang 只在"有待决动作（碰/杠按钮弹着）"时出现，两者天然互斥。 */
@keyframes claimPop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.hand .tile.wantpeng{outline:2px dashed #ff9a2e;outline-offset:-3px;
  animation:claimPop 1.4s ease-in-out 2}
.hand .tile.wantgang{outline:2px dashed #a06bff;outline-offset:-3px;
  animation:claimPop 1.4s ease-in-out 2}
/* 日志栏在被"提示"时短暂高亮（不动布局，只改背景/颜色） */
#log.hl{background:rgba(4,60,44,.92);color:#c8ffe8;box-shadow:0 0 0 1px rgba(67,224,160,.55)}
/* 自己的副露 / 手牌：钉在底部固定层，高度由 JS 量进 --hand-h / --reserve。
   副露必须压在牌桌之上（z-index 高于 .center），否则会被侧边走牌区盖住。 */
/* 底部三层自下而上：手牌 → 操作条 → 副露，各自 bottom 累加，
   互不遮挡。副露的 bottom 用「手牌高 + 操作条高」，操作条用「手牌高」。 */
#myMelds{position:absolute;left:0;right:0;
  bottom:calc(var(--hand-raw-h,0px) + var(--act-h,0px) + 2px);
  margin:0;padding:2px 6px 3px;justify-content:center;flex-wrap:nowrap;
  align-items:center;gap:8px;z-index:16}
/* ⚠️ .meldWrap 默认是「纵向」容器（给他家竖排副露设计）。
   我方副露必须横向：否则「副露 + 标签」挤成一条细长条，
   能窄到 30px、两侧留出大片空白，标签还会压到牌面上。 */
/* 我方副露：横向一组一组排（碰=3张/杠=4张），每组下方挂一个类型标签。
   统一用固定小尺寸：副露是"已完成的牌组"，比手牌小一号才不抢视线，
   也让「牌 + 标签」两行整体压在 40px 以内，不会顶到操作条。 */
#myMelds{row-gap:2px;column-gap:8px;align-content:center}
#myMelds .meldWrap{flex-direction:column;align-items:center;justify-content:flex-end;gap:1px}
#myMelds .meld{flex-direction:row;gap:1px}
#myMelds .meld .tile{width:22px !important;height:30px !important;border-radius:3px}
#myMelds .meldTag{position:static;bottom:auto;left:auto;transform:none;
  font-size:9px;padding:0 5px;line-height:1.3;background:rgba(0,0,0,.6)}
/* 手牌不贴屏幕最底沿：底部留 --bot-pad（竖屏由下面的媒体查询抬高一截）。 */
#myHand{position:absolute;left:0;right:0;bottom:var(--bot-pad,8px);z-index:16}
/* ===== 手牌托板 =====
   竖屏屏幕高、中下部有富余高度，把底部整摞抬起来之后，
   手牌下面会留出一块空白 —— 加一层很淡的托板（渐变 + 顶部细线），
   这块留白就变成"有意的托盘"而不是"没排满的空地"。
   高度 = 手牌高 + 底部留白，正好从手牌顶边盖到屏幕底边；不吃点击。 */
#shelf{position:absolute;left:0;right:0;bottom:0;height:calc(var(--hand-raw-h,84px) + var(--bot-pad,8px));
  pointer-events:none;z-index:3;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.16) 26%,rgba(0,0,0,.28) 100%);
  border-top:1px solid rgba(255,255,255,.07)}
/* 竖屏：底部整摞抬起 7vh（约屏幕高的 7%，上下限 18~88px）。
   横屏高度本来就紧张，保持 8px 不动。 */
/* ===== 🔴 四家的牌一律"站着"：字朝上，永远可读 =========================
   做过一版"还原真实牌桌"的全局旋转（下家 90°、对家 180°、上家 270°），想做出
   "每家的牌都朝向自己"的方框感 —— **已全部撤掉**，原因很直接：
      屏幕上的牌是用来**读**的。转 90° 文字躺倒、转 180° 文字倒过来，用户得歪头才认得出
      （实测反馈："躺着看牌？"）。真实牌桌上敢这么摆，是因为人围着桌子坐、随时能挪脑袋；
      固定视角的游戏里没有这个自由度，**可读性优先于拟真**。
   现在的规则：
     ① 任何**正面朝上的牌**（弃牌、副露、自己的手牌）一律 0°，字朝上；
     ② 四家的差别只体现在**排列方向**上：
        上下两家 = "横着长"的牌河（先铺满一行，再起下一行）
        左右两家 = "竖着长"的牌河（先铺满一列，再起下一列）
     ③ 牌背（他家手牌）本来就没有朝向可言，同样 0°，与正面牌共用一套尺寸。
   ⚠️ 别再给它加 `transform:rotate(...)`：旋转是纯视觉的，元素占位仍是原尺寸，
      flex 会照旧按旧尺寸排版 → 相邻牌重叠、间距全乱（当年为此套了一层 .tbox 占位盒，
      现在那层盒子也一并删掉了）。 */

/* 弃牌区的排列：**先把一排排满，排不下才另起一排**。
   用 flex 的换行行为天然实现，**不要用固定列数的 grid** —— 那会把牌平均分成一小格一小格，
   看起来像方块堆而不是"牌河"（实测用户反馈就是这个）。
   左右两家是"竖着长"的牌河 → column + wrap：先竖着排满一列，排不下才起第二列；
   上下两家是"横着长"的牌河 → 默认 row + wrap：先横着排满一行，再排第二行。
   容器高度由 .midRow 的 align-items:stretch 撑定，flex 才知道一列排到哪里算满。
   ⚠️ `width:auto !important`：各档残留着 `#discardLeft{width:XXpx}` 的老规则，
      不强制覆盖的话宽度仍按老值走（实测就是它让 compact 档只剩 29px、牌河退化成 1 列）。
   ⚠️ 列靠中央对齐（左家的列靠右、右家的列靠左），牌河的"内侧边"才贴着中央、四边好围成方框。 */
/* 左右两家的弃牌：**两列竖排、在这一侧垂直居中**（照着参考图做）。
   牌竖着、字朝上 —— 和另外两家一样，字必须能直接读。 */
#discardLeft,#discardRight{
  /* 竖排、排满一列自动起下一列（图里就是 2 列），整块在这一侧**垂直居中**。
     ⚠️ 不能用固定 2 列的 grid：矮横屏放不下时 grid 不会自动加列，会被 overflow 切掉（实测 sh=172>ch=149）。 */
  display:flex;flex-direction:column;flex-wrap:wrap;
  justify-content:center;align-content:center;gap:2px;
  /* 不许被 flex 压缩：否则 offsetWidth 会比真实内容小，缩小判定永远不触发（实测被压住中央）。 */
  min-width:max-content;
  width:auto !important;flex:0 0 auto}
/* ===== 四家牌的方向：以"每家自己看是正的"为准（真实牌桌就是这样）======
   自己 0°、对家 180°、上家(左) +90°、下家(右) -90°。
   ⚠️ 180° 是纯视觉镜像，元素占位不变 → 直接转容器最省事、零布局风险。
   ⚠️ ±90° 会把占位宽高对调 → 必须"外层 .tbox 占位盒 + 内层 rotate"：
      只给元素加 rotate 是纯视觉旋转，flex 仍按旧尺寸排版 → 相邻牌重叠（当年踩过）。
   🔴 牌面上的字**跟着牌一起转**，不做任何 counter-rotate：真实牌的字印在牌上，牌转字就转。
      （做过"牌转 90°、字转回 0°"的版本，被否掉：那是假牌。）
   🔴 别再自己拍板"对家也摆正"：对家对自己是正的 = 对我们就是倒的（用户明确要求）。 */
#topInfo{transform:rotate(180deg)}
/* 对家：**逐张转 180°**，不转容器。
   踩过：转容器会把容器内的 left/right 内边距一起镜像 —— #topHand 的 padding-right:48px
   本来是给右上角悬浮按钮留的，镜像后跑到左边，牌直接顶到按钮下面（实测重叠 23x26）。
   逐张转是纯视觉、占位完全不变，最稳。 */
#topHand>*,#topMelds>*,#discardTop>*{transform:rotate(180deg)}
/* 左右两家的名字标签也跟着这一家转（占位不变，转完会超出原盒 ~7px，给点上下余量） */
#leftName{transform:rotate(90deg);margin:15px 0}
#rightName{transform:rotate(-90deg);margin:15px 0}
/* 占位盒：宽高互换，内层元素转向这一家。.r = 右侧（下家，-90°） */
.tbox{position:relative;flex:0 0 auto}
.tbox>*{position:absolute;left:50%;top:50%;transform-origin:center;
  transform:translate(-50%,-50%) rotate(90deg)}
.tbox.r>*{transform:translate(-50%,-50%) rotate(-90deg)}
.tbox.bk{width:var(--side-bh,21px);height:var(--side-bw,15px)}   /* 侧栏手牌背面 */
.tbox.dt{width:var(--dth,35px);height:var(--dtw,26px)}           /* 侧边牌河 */
.tbox.ml{width:var(--smh,15px);height:44px}                      /* 侧栏副露（高由 fitSideMelds 写） */
/* 左右两家的副露：**一副一副竖着堆**（每副在他自家眼里就是"一排牌"，转过来成竖条）。
   ⚠️ 不能再横向并排：那会让每副占宽 40+ 把中排挤爆 —— 实测 98~282px，
      直接把中央积分板和牌河压没（用户看到的就是"牌河挤成一坨"）。 */
#leftMelds,#rightMelds{align-self:center;flex:0 0 auto;width:auto;
  flex-direction:column;flex-wrap:wrap;max-height:100%;
  align-items:center;align-content:center;justify-content:center;gap:2px}
/* ⚠️ flex-wrap:wrap + max-height:100% 不能省：矮横屏（800x340）中排只有 ~63px 高，
   4 副竖着堆要 80px → 会从上下两头溢出、压住对家/自己的牌河（实测 14x3、11x4 的遮挡）。
   换行后放不下的副露自己另起一列，横向空间在横屏本来就富余。 */

@media (orientation:portrait){
  :root{--dt-max-w:32px;--dt-max-h:43px;--dt-budget:0.24;--mel-max-w:25px;--mel-max-h:34px;--wall-tw:15px;--wall-th:21px}
  :root{--bot-pad:7vh;--bot-pad:clamp(18px,7dvh,88px)}
}
/* 没有副露时整条按住（否则会留一条 5px 的透明空条压在弃牌区下沿） */
#myMelds:empty{display:none}
.melds{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;padding:2px}
.meld{display:flex;gap:1px;background:rgba(0,0,0,.2);padding:2px;border-radius:4px}
.meld .tile.small{position:relative}
/* 副露牌型标识色条：碰=橙、明杠=紫、暗杠=深灰 */
.meld.peng{box-shadow:0 0 0 1px #d98a00,inset 0 0 0 1px rgba(255,255,255,.15)}
.meld.gang{box-shadow:0 0 0 1px #8e44ad,inset 0 0 0 1px rgba(255,255,255,.15)}
.meld.angang{box-shadow:0 0 0 1px #455a64,inset 0 0 0 1px rgba(255,255,255,.15)}
/* 副露区（含他家）：紧凑小牌 + 类型标签 */
.meldWrap{display:flex;flex-direction:column;align-items:center;gap:1px}
.meldTag{font-size:8px;line-height:1;color:#ffd88a;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:5px;white-space:nowrap}
.meldTag.gang{color:#e1bee7}
.meldTag.angang{color:#cfd8dc}
/* 他家副露区：宽度受限，横向不换行 */
.otherMelds{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.otherMelds .meld{padding:1px;gap:0}
/* ⚠️ 侧栏副露牌宽不能写死：杠是 4 张，窄屏侧栏（40px）放不下会顶破右边界。
   改为弹性收缩——4 张牌的杠以最窄的侧栏为基准，碰（3张）自然更宽松。 */
.otherMelds .tile.small{width:var(--smw,11px);height:var(--smh,15px);
  flex:0 0 auto;max-width:none;border-radius:2px}
.otherMelds .meld{max-width:100%;overflow:hidden}
.otherMelds .meldTag{display:none}
/* 对家副露：牌 + 类型标签一行排。max-height 要留够「牌 20 + 内边距 4 + 行高余量」，
   26px 会把标签底部裁掉 3px（实测 sh=29 > ch=26）。 */
.topMelds{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:4px;max-height:32px}
.topMelds .meldWrap{flex-direction:row;align-items:center;gap:1px}
.topMelds .meld{flex-direction:row}
.topMelds .tile.small{width:14px;height:20px;border-radius:2px}
.topMelds .meldTag{display:block;font-size:7px;padding:0 3px;line-height:1.3}
.info{text-align:center;font-size:12px;color:#9fd;padding:2px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;min-height:0;width:100%}
.midRow{flex:1;display:flex;align-items:stretch;justify-content:space-between;gap:4px;width:100%;min-height:0}
/* 🔴 justify-content 必须是 space-between（不能 center）：中排里是
     [左副露][左牌河][中央信息块][右牌河][右副露] ——
   用 center 时整组居中，左右两家那两组会**离开自己那一侧的手牌**、漂到中间去
   （用户反馈"弃牌靠着中间、没靠自己边的手牌"）。配合 .centerInfo{flex:1}
   让中央块吃掉所有余量，两边就各自紧贴自家的侧栏了。 */
/* 中央列：牌墙 + 积分板 —— 在整块牌桌的垂直中线上，别被弃牌区挤偏 */
.centerInfo{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1 0 auto;min-width:74px;gap:3px}
/* 中央显示牌墙 + 本局各家得分 */
.scoreBoard{background:rgba(0,0,0,.32);border-radius:8px;padding:5px 7px;font-size:11px;line-height:1.55;color:#dfe;min-width:74px}
.scoreBoard .srow{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;border-radius:4px;padding:0 2px}
.scoreBoard .srow.cur{background:rgba(255,215,0,.22)}
.scoreBoard .sname{color:#9fd}
/* 「庄」标记：本局庄家（下局由他摇色子先拿先出牌）；「✎」提示自己的名字可以点开改 */
.scoreBoard .zh{color:#ffd700;font-size:.85em;margin-left:3px}
.scoreBoard .pen{opacity:.5;font-size:.85em;margin-left:3px}
.scoreBoard .srow.mine{cursor:pointer}
.scoreBoard .pos{color:#7fe08a}
.scoreBoard .neg{color:#ff8b8b}
/* 四家弃牌区：统一流式多列；最新牌用固定尺寸放大（布局层生效），故无需 overflow 溢出 */
.discardZone{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;overflow:hidden;scrollbar-width:none}
/* 上下两家：横向铺开 */
#discardTop,#discardBottom{max-width:100%;max-height:16vh;justify-content:center}
/* 左右两家：限制在牌桌高度内（下方会落到手牌层上被压住）。
   列数由各设备档的媒体查询决定 —— 手机/平板改成横向 2 列，矮一半、牌能做大一号。 */
  /* 左右两家的弃牌区：宽度和对齐都由全局规则决定（见文件前部的旋转/排列规则），
     这里只限制它别超出格子高度。 */
  #discardLeft,#discardRight{max-height:calc(100% - 8px)}
#discardTop.ultra,#discardBottom.ultra{max-height:12vh}
#discardTop.compact,#discardBottom.compact{max-height:14vh}
/* 弃牌用小号牌，节省空间；牌数多时由 JS 追加 compact 类进一步缩小 */
.discardZone .tile .k{font-size:5px}
.discardZone.compact .tile .k{font-size:4px}
.discardZone.ultra .tile .k{display:none}
/* 左右两家的弃牌：牌横躺（长边朝向这一家自己），排列是"先铺满一列、再起下一列"。
   牌的朝向与字的朝向怎么分工，见文件开头「四家牌的方向」那一节。 */
/* 最新打出的牌：金色描边 + 内部光晕 + 提亮 + 呼吸动画。
   🔴 这里**绝不能放大尺寸**。之前用 width/height 把最新牌放大，导致两个问题：
      ① "以前打出的牌在缩小/放大/乱动"：尺寸一变就把整行撑高，行高一变，弃牌区
         在格子里的对齐跟着变 → 整条牌河上下跳两次（出牌时上跳、约 1 秒后 latest
         被下一家覆盖而取消、又落回来；实测老牌 top 在 723↔736 之间来回 13px）。
         再叠上 .discardZone .tile 的 width/height 过渡，就成了肉眼可见的缩放动画。
      ② "刚打出的牌被裁了一角"：牌河里最后一张正好贴着弃牌区的下/右边缘，
         放大的那部分被 overflow:hidden 裁平（牌本身尺寸是完整的，被切掉的只有描边）。
      改成"零布局影响"的强调手段后，牌河尺寸恒定 → 老牌纹丝不动，也永远不会被裁。
   ⚠️ 描边必须画在牌**内部**（inset）：向外画的描边/外发光会被 overflow:hidden 切平。 */
/* 🔴 描边宽度必须**跟着牌大小走**（calc(--dth)）：固定 2px 在 26px 的小弃牌上占 1/13，
   在桌面 86px 的大牌上只占 1/43 —— 两头都"比例不协调"（用户反馈"黄边向内太宽"）。 */
.tile.latest,.tile.latestRing{
  box-shadow:inset 0 0 0 calc(var(--dth,35px)*0.035) #ffd700,
             inset 0 0 calc(var(--dth,35px)*0.12) rgba(255,200,0,.45);
  filter:brightness(1.06);
  z-index:3;position:relative}
/* 跳动只给"刚打出的那一瞬"（JS 按 G.lastDiscardAt 加 .spot 类，900ms 内）。
   ⚠️ 原来把 animation 直接挂在 .latest 上 —— 而 render() 每回合重建整桌 DOM，
      于是**每次重绘都会把动画从头重播一遍**（0% 那帧描边 5px），
      看上去就是"黄边一粗一细、有时候明显有时候没有"（用户反馈"显示的不显示"）。 */
.tile.latest.spot,.tile.latestRing.spot{animation:spot .55s ease-out 2}
@keyframes spot{
  0%{box-shadow:inset 0 0 0 calc(var(--dth,35px)*0.062) #fff0a8,
               inset 0 0 calc(var(--dth,35px)*0.22) rgba(255,215,0,.95)}
  100%{box-shadow:inset 0 0 0 calc(var(--dth,35px)*0.035) #ffd700,
                 inset 0 0 calc(var(--dth,35px)*0.12) rgba(255,200,0,.45)}}
/* 只给描边做过渡，**不要给 width/height 做过渡**：牌数跨 9/15 档时整个弃牌区会换尺寸，
   带尺寸过渡就会看到"所有牌一起缩放一下"的动画，很容易被误读成"牌在自己缩小又放大"。 */
/* 每侧牌河的宽度预算：牌多时靠"多一列"消化（flex 自动换行），
   真的超出预算才由 fitDiscards 逐级缩小 —— 不再按牌数硬切尺寸档。 */
:root{--dt-budget:0.21}
/* 操作区：浮在手牌正上方（原来贴屏幕最底部，拇指/手掌正好压在上面，极易误触）。
   定位基准是"手牌顶边"而不是屏幕底边，所以手牌换行变高时它也跟着上移。
   同时 JS 会把它的高度算进 --reserve，弃牌区不会伸到它底下。 */
#actions{
  position:absolute;left:0;right:0;
  bottom:var(--hand-raw-h,96px);           /* 锚定"手牌顶边"（不含副露） */
  display:flex;gap:8px;justify-content:center;align-items:flex-end;flex-wrap:wrap;
  padding:0 8px 8px;pointer-events:none;z-index:20;
}
#actions:empty{display:none}
/* 牌局结束（或亮牌查看）时不该再有操作按钮，直接隐藏，避免浮在结算面板上 */
body.isOver #actions{display:none}
#actions>*{pointer-events:auto}
#actions button{
  min-height:var(--tap);min-width:var(--tap);
  padding:12px 22px;font-size:17px;      /* 手机端放大：好按、不误触 */
  border-radius:26px;
}
#actions .hint{
  font-size:13px;color:#ffd700;font-weight:700;
  background:rgba(0,0,0,.62);padding:6px 12px;border-radius:16px;
  animation:blink 1s ease-in-out infinite;
}
button{padding:10px 20px;border:none;border-radius:22px;font-size:15px;font-weight:700;background:#ffb300;color:#3a2000;box-shadow:0 3px 0 #b37d00;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b37d00}
button.gray{background:#666;color:#fff;box-shadow:0 3px 0 #333}
button.red{background:#e53935;color:#fff;box-shadow:0 3px 0 #8e0000}
#log{position:absolute;top:4px;left:4px;font-size:11px;color:#cfe;background:rgba(0,0,0,.4);padding:4px 8px;border-radius:6px;max-width:66%;line-height:1.5;pointer-events:none;z-index:5;  max-height:3em;overflow:hidden}   /* 状态行最多两行，长文本不再往下压住对家的牌 */
/* ===== 悬浮控件层：右上角「全屏」/ 结算窗收起后重新打开的「本局详情」=====
   两者都钉在右上角（z-index 高于牌桌与弹窗），只占屏幕一角、
   不与任何牌面/按钮抢位置，横竖屏都在同一处，肌肉记忆好找。 */
#fsBtn{position:fixed;top:calc(var(--sat) + 6px);right:calc(var(--sar) + 6px);
  width:40px;height:40px;min-height:0;padding:0;border-radius:50%;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);box-shadow:none;
  display:flex;align-items:center;justify-content:center;z-index:60}
#fsBtn:active{transform:none;background:rgba(0,0,0,.72);box-shadow:none}
#fsBtn svg{width:21px;height:21px;display:block}
#fsBtn svg .in{display:none}
body.isFS #fsBtn svg .out{display:none}
body.isFS #fsBtn svg .in{display:block}
/* 结算后的两个入口（本局详情 / 再来一局）：位置放在**操作条那一层**（手牌正上方）。
   结算时操作条是隐藏的，这条空档正好放按钮；JS 会把按钮高度算进 --reserve，
   所以既不会压牌桌上的弃牌，也不会压手牌/副露。
   ⚠️ 原来这块钉在**右上角**（top:sat+52 / +90）：实测它压住右家（上家）的名字和手牌
      （32×16、19×26），而那个位置的回归场景以前没覆盖"结算窗已关闭且已完局"的状态，
      一直没被发现。挪到底部后与右上角的全屏按钮也不再互相挤。 */
#endBtns{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;
  display:none;align-items:center;gap:10px;z-index:45}
#endBtns.on{display:flex}
#reopen{padding:9px 15px;font-size:12.5px;border:1px solid rgba(255,215,0,.4);border-radius:16px;
  background:rgba(0,0,0,.66);color:#ffd700}
#reopen:active{background:rgba(0,0,0,.85)}
/* 「再来一局」做成醒目的金色主按钮：原来只剩「本局详情」一个入口，
   用户以为必须刷新页面才能开下一局（实测反馈）。 */
#againBtn{padding:9px 16px;font-size:13px;font-weight:800;border:0;border-radius:16px;
  cursor:pointer;color:#3a2400;background:linear-gradient(180deg,#ffd76a,#f0b429);
  box-shadow:0 3px 10px rgba(0,0,0,.45)}
#againBtn:active{transform:translateY(1px);filter:brightness(.94)}
/* 结算窗开着时把全屏按钮藏掉：它 z-index 60 比弹窗层（40）高，
   会浮在结算卡右上角上、和窗内的「×」挨在一起（实测横屏收起态两者相交）。
   看结算的时候本来也没心思切全屏，关掉窗它自己就回来了。 */
body.isResult #fsBtn{display:none}
/* 摇色子阶段同样藏掉：这时牌桌上什么都还没有，全屏按钮浮在色子遮罩之上没有意义；
   而且空桌时右侧那一列会往上收，名字标签正好顶进按钮的位置（实测 28×13 相交）。 */
body.isDice #fsBtn{display:none}
body.isName #fsBtn{display:none}   /* 取名层（首次进入/改名）也藏掉：见 openNameDlg 注释 */
/* ===== 音效开关（右下角）=====
   ⚠️ 这个位置是**实测选出来的**，别凭直觉挪（下面每条都是布局回归的真实结论）：
      · 右上、贴着全屏按钮左边（top:6/right:52）→ 手机竖屏压住**对家手牌背面** 16~23px；
      · 右上、全屏按钮正下方（top:50/right:6）→ 竖屏干净，但**横屏**压住上家名字标签；
      · 左上角 / 左下角 → 竖屏分别压到对家手牌、下家手牌；
      · 右下角贴边往上挪（bottom:56 / 104）→ 竖屏压到**自己的手牌**。
      把 12 个候选位置 × 2 个关键尺寸逐个跑回归后，最终是**两条规则配合**：
        · 常规（竖屏/平板/桌面/普通横屏）→ 右下角贴边 bottom:8 + right:6；
        · 极矮横屏（≤380px 高）→ 右下角往里让开 52px（right:52）；
      这是因为矮横屏时右下角贴边那一格正好被上家的手牌占着，往里让 52px 才是空档。
      固定定位，不进牌桌布局；结算/摇色子/取名层里与全屏按钮一起隐藏。 */
#sndBtn{position:fixed;bottom:calc(var(--sab) + 8px);right:calc(var(--sar) + 6px);
  width:40px;height:40px;min-height:0;padding:0;border-radius:50%;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);box-shadow:none;
  display:flex;align-items:center;justify-content:center;z-index:60}
#sndBtn:active{transform:none;background:rgba(0,0,0,.72);box-shadow:none}
#sndBtn svg{width:21px;height:21px;display:block}
#sndBtn svg .off{display:none}
body.sndOff #sndBtn svg .on{display:none}
body.sndOff #sndBtn svg .off{display:block}
body.sndOff #sndBtn{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.13);opacity:.72}
/* 与全屏按钮同进退：结算层/色子层/取名层里一并藏掉，免得和弹窗右上角的「×」挤在一起 */
body.isResult #sndBtn{display:none}
body.isDice #sndBtn{display:none}
body.isName #sndBtn{display:none}
/* 极矮横屏（≤380px 高，例如 800×340 —— 手机地址栏吃掉高度的那种）：
   右下角**贴边**那一格被上家的手牌占着（实测压 20×9），往里让开 52px 才是空的。
   ⚠️ 这条必须写在基础规则**之后**：媒体查询不增加优先级，靠顺序覆盖。 */
/* ===== 语音开关（方案 A：用系统语音念出"打出的牌"，例如"一万""三筒"）=====
   与音效开关**各自独立**：音效管音效，语音管播报，状态分开存（gymj.sfx.v1 / gymj.voice.v1）。
   位置：**左下角**，与右下角的音效按钮对角对称（位置是实测选的，见下面的说明），
   否则会压到上家的手牌（这条规则与音效按钮同源，见上面的说明）。
   不支持语音合成的浏览器会把按钮藏掉（JS 里做），不留假开关。 */
#voiceBtn{position:fixed;bottom:calc(var(--sab) + 8px);left:calc(var(--sal) + 6px);
  width:40px;height:40px;min-height:0;padding:0;border-radius:50%;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);box-shadow:none;
  display:flex;align-items:center;justify-content:center;z-index:60}
#voiceBtn:active{transform:none;background:rgba(0,0,0,.72);box-shadow:none}
#voiceBtn svg{width:21px;height:21px;display:block}
#voiceBtn svg .off{display:none}
body.voiceOff #voiceBtn svg .on{display:none}
body.voiceOff #voiceBtn svg .off{display:block}
body.voiceOff #voiceBtn{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.13);opacity:.72}
/* 与音效/全屏按钮同进退：结算层、色子层、取名层里一并藏掉 */
body.isResult #voiceBtn,body.isDice #voiceBtn,body.isName #voiceBtn{display:none}
@media (max-height:380px){
  /* 矮横屏时左下角被下家手牌占着（实测压 20×15），让到右下角、音效按钮左边。
     ⚠️ left:auto 不能省：left+right 同时有值时 LTR 会忽略 right，按钮会卡在左边。 */
  #voiceBtn{left:auto;right:98px}
}

@media (max-height:380px){
  #sndBtn{right:52px}
}

#result{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:40;
  overscroll-behavior:contain}
/* ===== 结算窗三态 =====
   ① 展开：居中/底部抽屉，带一层半透明遮罩（牌桌仍能看见，只是压暗）
   ② 收起(peek)：缩到角落浮窗，牌桌完全露出，四家亮牌一览无遗
   ③ 关闭：桌面干净了，右上角留一个「本局详情」小药丸随时叫回来
   旧版遮罩层 z-index 比手牌层低，收起后的浮窗会被自己的手牌盖住 —— 现在弹窗层
   永远压在最上层（z-index:40 > 手牌 16 / 操作条 20），弹窗不会被任何牌面遮挡。
   ⚠️ 底部让位一律用 --reserve（手牌 + 操作条 + 副露的总高，即"底部整摞"的顶边），
      不能用 --hand-h（只到副露，操作条那一段会漏出来 → 浮窗压在自己的操作条/副露上）。 */
  /* ⚠️ 必须 **居中**（原来 flex-end = 右下角）：收起态的窗体停在右下角时正好压在右侧
     那家的手牌列上（实测 560 / 834 / 871 / 1920 宽都压 20~38px）—— 而收起态的用意恰恰是
     「让四家亮着的牌全露出来」，压住一家就白收了。居中后四家手牌都不被挡。 */
#result.peekMode{background:transparent;pointer-events:auto;align-items:flex-end;justify-content:center;
  padding:12px 14px calc(var(--reserve,0px) + 14px)}
/* ⚠️ 收起态就是"结算时默认的样子"，必须**只占两侧副露之间的空档**：实测 400px 竖屏里
   左副露占 36~69px、右副露 321~354px —— 窗宽超过约 240px 就会压住两家的副露（实测各压 36x77），
   那等于"四家亮牌"没露出来。各档的宽度都是按这个空档定的，别随手放大。 */
/* 收起态用的墙牌尺寸：**只改变量**，各档可以覆盖（直接给 .tile 定宽会因特异性更高而压掉各档）。 */
#result.peekMode{--wall-tw:10px;--wall-th:14px}
#result.peekMode .box{pointer-events:auto;max-width:min(240px,60vw);max-height:min(82dvh,calc(100dvh - var(--reserve,0px) - var(--top-h,60px) - 10px));box-shadow:0 8px 32px rgba(0,0,0,.55);background:#fff}
/* 收起态的操作提示改到窗内（原来的浮层文字会压在手牌上） */
#result .peekHint{display:none;font-size:11px;color:#8a9;line-height:1.45;text-align:center;margin-top:8px}
#result.peekMode .peekHint{display:block}
#result .box{background:#fff;color:#222;border-radius:14px;padding:18px;max-width:340px;width:100%;
  max-height:82vh;max-height:min(82dvh,760px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative;
  display:flex;flex-direction:column}
/* 结算窗内的关闭「×」：右上角，触控区不缩水 */
#result .xBtn{position:absolute;top:8px;right:10px;width:34px;height:34px;padding:0;min-height:0;border-radius:50%;
  background:#eef1ef;color:#5a6b62;font-size:17px;font-weight:700;line-height:1;box-shadow:none}
#result .xBtn:active{transform:none;box-shadow:none;background:#dfe5e1}
#result h2{font-size:18px;margin-bottom:10px;text-align:center;color:#0b3d2e}
/* 结算内容分两段：rMain=胡牌明细，rSide=得分/累计积分/按钮。
   竖屏上下排（与旧版视觉一致），横屏由 ③ 档改成左右两栏，
   矮屏才塞得下、底部按钮不用滚动就够得到。 */
#result .rMain,#result .rSide{min-width:0}
#result .rScores{margin-top:10px}
/* 侧栏每家一行：净额后面那句「（收 X − 付 Y）」在窄屏放不下时折到下一行（不挤掉净额） */
#result .rScores .line{flex-wrap:wrap}
#result .rScores .line .bk{color:#999;font-size:11px;white-space:nowrap;margin-left:5px}
#result .rBtns{flex:1 1 100%;margin-top:14px;text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* 结算窗里的「未摸到的牌」：把牌墙剩下的牌全部翻开，用最小的牌面紧凑排开。
   ⚠️ 必须塞进 rSide 那一栏（竖屏在按钮下方、横屏在右栏）：横屏结算窗只排两栏，
      新开一栏会撑宽。
   ⚠️ 收起态（peekMode）里藏掉：收起态窗体本来就紧，墙牌太占地方。 */
#result .rWall{flex:1 1 100%;margin-top:8px;border-top:1px dashed #e3ddd0;padding-top:6px}
#result .rWallT{font-size:11px;color:#7a8577;margin-bottom:4px}
#result .rWallG{display:flex;flex-wrap:wrap;gap:1px}
#result .rWallG .tile{width:var(--wall-tw,11px);height:var(--wall-th,15px);
  border-radius:1px;box-shadow:none;border:1px solid #e2ddcd;overflow:hidden;flex:0 0 auto}
#result .rWallG .tile .k{display:none}
/* 收起态也要显示"未摸到的牌"（用户要求）：靠下面的行距压缩把位置腾出来。 */
#result .line{font-size:13px;padding:5px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px}
/* 四家行右端的「（共 N 分）」：.line 本身就是 flex + space-between，切成两个 span 就靠右了；
   nowrap 保证它不被左段挤成两行（用户要求"括号里的右边对齐"） */
#result .line>span.rp{white-space:nowrap;text-align:right;flex:0 0 auto}
#result .scoreSummary{margin-top:10px;background:#f4f7f5;border-radius:8px;padding:6px 10px}
#result .scoreSummary .line{border-bottom:1px solid #e2e8e4;font-size:13px}
#result .scoreSummary .line:last-child{border-bottom:none}
.nameTag{font-size:11px;color:#9fd;background:rgba(0,0,0,.3);padding:1px 8px;border-radius:8px;white-space:nowrap}
.side{width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:0;
  /* 整块（名字 + 手牌列）在自己那一侧的**中间**：左右两家的牌要"在他自己前面"，
     而不是缩在上方挨着对家那一角（用户实测反馈：看着像对家面前的牌）。 */
  align-self:center}
/* min-height:0 + flex:0 1 auto —— 允许「他家手牌列」在矮屏上被压缩，
   否则它会把 .side 撑高、整列溢出牌桌底部（横屏手机的典型事故）。 */
.sideHand{display:flex;flex-direction:column;gap:0;align-items:center;flex:0 1 auto;min-height:0}
/* 他家手牌背面：尺寸统一由 JS（fitBacks）算，CSS 只给设计基准。
   竖排背面的间距也交给 --side-gap（可负），保证"再挤也排得下"。 */
.topHand .back{width:var(--top-bw,var(--back-w,22px));height:var(--top-bh,var(--back-h,30px));flex:0 0 auto}
.sideHand .back{width:var(--side-bw,var(--side-w,15px));height:var(--side-bh,var(--side-h,21px));flex:0 0 auto}
.sideHand .back+.back{margin-top:var(--side-gap,1px)}
.sideHand .tbox+.tbox{margin-top:var(--side-gap,1px)}
/* 侧栏亮牌：牌转了 90°，网格列宽要用"牌的宽高互换"后的值（= 牌高） */
/* ===== 完局亮牌：四家手牌**在原位置翻面**（不重排） =====
   用户明确要求："结算翻牌的时候，应该是每家手牌原位置翻牌，不要重新排成两排/三排再翻牌"。
   所以侧栏保持原来的一列（flex-direction:column），只是把 .back 换成正面 .tile；
   尺寸沿用**同一套变量**（--side-bw/--side-bh，由 fitBacks 按可用高度算），
   翻牌前后每一张都在原来的位置上，一眼就能看出他家叫了什么。
   ⚠️ 别再加 display:grid + grid-template-columns 那种"平铺重排"——那就是被否掉的做法。 */
.sideHand.reveal{padding:3px;border-radius:6px;background:rgba(0,0,0,.18)}
.sideHand .tile{width:var(--side-bw,var(--side-w,22px));height:var(--side-bh,var(--side-h,30px));border-radius:2px}
/* 对家亮牌：也是**原位置翻面** —— 保持一行（flex 行），牌背换正面，
   尺寸沿用 --top-bw/--top-bh（fitBacks 按可用宽度算），翻牌前后完全对得上。 */
.topHand .tile{width:var(--top-bw,var(--back-w,22px));height:var(--top-bh,var(--back-h,30px));border-radius:3px}
.topHand{flex-wrap:nowrap;gap:2px}
.topHand .tile{flex:0 1 auto;min-width:0}
/* 亮牌后：胡牌家那一排泛金光，方便一眼看出他胡的是什么 */
.hand.revealWin,.sideHand.revealWin,.topHand.revealWin{
  background:radial-gradient(ellipse at center,rgba(255,215,0,.20),transparent 72%);
  border-radius:8px;padding:2px 5px}
/* 亮牌时副露区也放宽一点，别挤成一条线 */
.revealMelds .tile.small{width:15px;height:21px;border-radius:2px}
.revealMelds.topMelds .tile.small{width:18px;height:25px;border-radius:2px}
/* 当前行动方高亮 */
.nameTag.cur{background:#ffd700;color:#3a2000;font-weight:700;box-shadow:0 0 8px rgba(255,215,0,.7)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
/* 手牌可胡时整排泛光 */
.hand.huReady{background:radial-gradient(ellipse at center,rgba(255,215,0,.22),transparent 70%);border-radius:10px}

/* ==================== 手机 / 平板 适配 ====================
   目标设备：小米 17（约 400×880 CSS px）、iPad Pro 11（约 834×1194）。
   手机竖屏：牌面整体缩小、弃牌区压缩，保证手牌 + 操作条永远可见；
   手机横屏 / iPad：空间宽裕，牌面适度放大，操作条同样浮在手牌上方。
   所有尺寸用 vmin/clamp 做流体缩放，避免某一档设备上元素溢出。 */

/* --- ① 触摸设备通用：加大所有可点元素的命中区 --- */
@media (pointer:coarse){
  .tile{cursor:default}
  .hand .tile{transition:none}            /* 手机上 transform 动画会掉帧 */
  .hand .tile:active{transform:translateY(-6px)}
  button{touch-action:manipulation}
}

/* --- ② 手机竖屏（窄、长）：核心场景 --- */
@media (max-width:520px){
  :root{--dt-max-w:32px;--dt-max-h:43px;--dt-budget:0.24;--mel-max-w:25px;--mel-max-h:34px;--wall-tw:15px;--wall-th:21px}
  /* 他家手牌背面的设计基准（JS 只缩不放，见 fitBacks） */
  :root{--back-w:24px;--back-h:33px;--side-w:15px;--side-h:21px}
  /* 牌面按屏宽流体缩放，13 张手牌一行排得下的同时尽量大 */
  .tile{width:clamp(24px,7.6vw,34px);height:clamp(33px,10.4vw,47px);border-radius:4px}
  .tile .k{font-size:6px}
  .back{width:clamp(14px,4.4vw,20px);height:clamp(19px,6vw,27px)}
  .tile.small{width:20px;height:27px}
  .melds .tile.small{width:18px;height:25px}
  #myMelds .meld .tile{width:20px !important;height:27px !important}
  #myMelds .meldTag{font-size:8px;padding:0 4px}

  /* 手牌区：收紧内边距，给弃牌区腾高度。
     13 张牌强制一行（换行会让整排变高、把操作条顶飞），
     牌宽已按 vw 缩过，一行放得下。 */
  .hand{gap:2px;padding:4px;min-height:0;flex-wrap:nowrap;justify-content:center}
  .hand .tile{flex:0 1 auto;min-width:0}
  .hand .tile.drawn{margin-top:-7px}

  /* 三家手牌背面缩小，侧栏收窄。
     对家 13 张必须一行放下：牌宽按可用宽度算（400px 减去两侧栏），
     否则会折成两行、上沿顶到标题行。 */
  .side{width:clamp(40px,11vw,54px)}
  .sideHand .tile{width:var(--side-bw,var(--side-w,15px));height:var(--side-bh,var(--side-h,21px))}
  .sideHand{gap:0}
  .sideHand{max-height:none}
  .topHand{flex-wrap:nowrap;gap:1px}
  /* 对家那一排两侧留出「全屏 / 本局详情」两个悬浮按钮的位置：
     400px 宽的竖屏上，13 张背面对中摆放正好会伸到右上角，
     被那枚圆形全屏按钮压住一角。留出内边距后由居中逻辑自然让开。 */
  /* 右上角有悬浮的全屏按钮：只在**右侧**给它让位，左侧不留 —— 两侧都留 44px 会把
     对家手牌挤到 23×31（比左右两家牌背 37×26 还小，用户实测反馈"对家的牌偏小"）。 */
  #topHand{padding:0 48px 0 2px}
  .topHand .tile{width:var(--top-bw,var(--back-w,24px));height:var(--top-bh,var(--back-h,33px));flex:0 1 auto;min-width:0}

  /* 弃牌区：进一步压缩，手机屏幕矮，弃牌是最该让位的 */

/* 左右两家横躺后的**占位尺寸**，与该档 .tile 的尺寸成对（宽高互换）—— 改牌尺寸时必须同步改这里。 */
  #discardTop,#discardBottom{max-height:13vh}
  /* 左右弃牌：横向 2 列铺开（一列太窄太长，牌被迫做小；两列矮一半、牌能大一号） */
  /* 左右两家的容器宽度/对齐见全局规则（横躺牌自动排布）。 */
  /* 左右两家弃牌与上下两家**同尺寸**（真麻将四家的牌一样大）。
     注意五万用「伍」、去掉「萬」后牌面只剩一个大号数字，尺寸放大也不会糊。 */
  /* 最新牌不单独放大（理由见 .tile.latest 的注释）：尺寸恒定 = 牌河不跳动、永不被裁 */

  /* 中央信息块收窄，别把左右弃牌挤没；撑满牌桌高度 → 牌墙+积分板自然落在中线 */
  .centerInfo{flex:1;min-width:56px;gap:2px}
  .scoreBoard{font-size:10px;padding:4px 5px;min-width:56px}
  .info{font-size:11px}
  .nameTag{font-size:10px;padding:1px 6px}

  /* 操作条贴手牌上方，按钮更大更好按 */
  #actions{bottom:var(--hand-h,84px);gap:6px;padding:0 4px 6px}
  #actions button{padding:13px 20px;font-size:16px;min-height:48px}
  #actions .hint{font-size:12px;padding:5px 10px}

  /* 结算弹窗改成底部抽屉式，手机上更好读。
     ⚠️ 抽屉底边必须停在「手牌 + 副露」之上：早期贴到 padding:0，
        面板直接把碰/杠按钮和副露盖住了，结算时看不到自己胡的是哪手牌。 */
  #result{align-items:flex-end;padding:0 0 var(--reserve,0px)}
  #result .box{max-width:100%;width:100%;border-radius:16px 16px 0 0;padding:14px;
    max-height:calc(100dvh - var(--reserve,0px) - var(--sat,0px) - 12px)}
  /* 收起态：右下角浮窗，底边同样停在底部整摞之上。 */
  #result.peekMode{align-items:flex-end;justify-content:center;padding:0 8px calc(var(--reserve,0px) + 12px)}
  #result.peekMode .box{max-width:min(232px,58vw);width:auto;border-radius:14px;max-height:calc(100dvh - var(--reserve,0px) - var(--top-h,60px) - 16px)}
}

/* --- ③ 手机横屏（高度紧张）：横向压扁一切，优先保证能看见手牌 ---
   缩放基准用「宽度」而不是高度：880×400 这种比例下，按 vw 等比缩能让
   手牌 / 操作条 / 副露一起变小，牌桌中央才有足够高度摆得下四家弃牌。
   ⚠️ 条件必须与 ④ 平板档互斥：小米 17 横屏是 871×400，
      宽度也 ≥760px、指针也是 coarse，若 ④ 不加高度门槛，
      iPad 的大牌尺寸会盖到横屏手机上（整桌溢出、层层遮挡）。
      故 ③ 管「矮屏」，④ 管「宽且高的平板」，用高度把两者切开。 */
@media (orientation:landscape) and (max-height:520px) and (max-width:1100px){
  :root{--dt-max-w:26px;--dt-max-h:35px;--dt-budget:0.20;--mel-max-w:22px;--mel-max-h:29px;--wall-tw:13px;--wall-th:18px}
  /* 横屏又矮又宽：右上角悬着全屏按钮，侧栏整块居中会把名字顶到按钮下面（实测 28×7 相交）→
     给侧栏一条上边留白，居中位置整体下移半个留白量，名字就落在按钮下方了。 */
  .side{margin-top:56px}
  /* 他家手牌背面的设计基准（JS 只缩不放，见 fitBacks） */
  :root{--back-w:13px;--back-h:18px;--side-w:12px;--side-h:16px}
  /* 牌面按"宽度"缩放：横屏横向很富裕、纵向极紧张，用 vw 让小屏牌不挤、
     大屏牌能跟上（871 宽 → 22.6px，比原来 20px 大一档；真正的上限由
     fitRow/fitBacks 按可用空间和视口高 12% 再收一次，不会把牌桌挤没）。 */
  .tile{width:clamp(20px,2.6vw,30px);height:clamp(27px,3.6vw,40px);border-radius:3px}
  .back{width:14px;height:19px}
  .tile.small{width:15px;height:20px}
  .melds .tile.small{width:13px;height:18px}
  .hand{gap:2px;padding:2px;min-height:0}
  .hand .tile{padding:0}
  .hand .tile.drawn{margin-top:-5px}
  /* 右上角悬浮的「全屏」按钮是 40×40、top/right 各 6px，下沿在 y≈46。
     横屏时左右两家的内容都从牌桌内容区顶部开始（开局 y=22），
     名字标签正好落在按钮底下 —— 实测右家「上家」被盖掉 28×13（几乎全隐）。
     给整列留 26px 上内边距，内容一律从按钮下沿下方开始排。
     左右对称加同样的量，两家的牌尺寸才一致（fitBacks 按名字标签下沿算可用高度，
     会自动跟着缩，不用手写数值）。
     侧栏同时加宽到 46px：中央弃牌区的右边界 = 屏宽 − 侧栏宽，正好与按钮
     左边界（屏宽 − 46）对齐，弃牌区不再被按钮压到（原来压 4×20）。 */
  .side{width:46px;padding-top:26px}
  .sideHand .tile{width:var(--side-bw,var(--side-w,12px));height:var(--side-bh,var(--side-h,16px))}
  /* 对家手牌行同理让出按钮宽度（牌列居中，永远贴不到右上角） */
  /* 右上角有悬浮的全屏按钮：只在**右侧**给它让位，左侧不留 —— 两侧都留 44px 会把
     对家手牌挤到 23×31（比左右两家牌背 37×26 还小，用户实测反馈"对家的牌偏小"）。 */
  #topHand{padding:0 48px 0 2px}
  .topHand .tile{width:var(--top-bw,var(--back-w,13px));height:var(--top-bh,var(--back-h,18px))}

/* 左右两家横躺后的**占位尺寸**，与该档 .tile 的尺寸成对（宽高互换）—— 改牌尺寸时必须同步改这里。 */
  #discardTop,#discardBottom{max-height:9vh}
  /* 矮横屏：ultra/compact 那两条是按 vh 给的、优先级更高，必须一起压下来 ——
     省出的高度让给中央积分板，否则 5 行分数放不进中排，会往上溢出压对家牌河（实测 26x4）。 */
  #discardTop,#discardBottom,#discardTop.ultra,#discardBottom.ultra,
  #discardTop.compact,#discardBottom.compact{max-height:clamp(28px,9.5vh,44px)}
  /* 说明：这里只给"上下两家牌河"一个软上限（让高度给中央积分板）；真正的收紧在
     最矮的那一档（<=380px 高）用独立媒体查询做，别一刀切 26px ——
     400px 高的机器中排有 200px，压到 26px 会把牌河缩成 20×27，
     和左右两家（26×35）不一致（用户就是按"四家一样大"来验收的）。 */
  /* 横屏纵向极度紧张：左右弃牌只用 1 列（2 列一换行就顶出格子），
     牌做小一点，一列换行也矮。格子高度由 JS 钉底，永不越界。 */
  /* 左右弃牌区的宽度统一在下面给（"2 列横躺牌"的宽）。这里**不要**再按档位单独给宽度：
     `#discardLeft.compact` 比单类 `#discardLeft` 更具体，会以更高优先级盖掉那个值 ——
     实测就是这里残留的 29px 让 compact 档退化成 1 列、牌河顶出格子。 */
  /* 左右/上下四家弃牌统一用上面的 .discardZone .tile 尺寸（真麻将四家牌一样大） */
  /* 最新牌与普通牌同尺寸（理由见 .tile.latest 的注释） */
  /* 牌桌再让出一点底部空间：横屏没有操作条时 --reserve 为 0，
     弃牌区会一直贴到屏幕底边，多出一行就被裁。 */
  #table{padding-bottom:calc(var(--reserve,0px) + 6px)}
  /* 中央列回到正常文档流：绝对定位钉在 34% 处时，
     它会压在左右弃牌的牌河中间（遮挡牌面）。回到流里由 flex 分配宽度，
     牌河自动让开，不再有任何覆盖。 */
  /* ⚠️ flex 必须是 1 0 auto（原来写 flex:none）：中排的 justify-content 是 space-between，
     中央块若不吃余量，多出来的空间就会被平摊到 5 个格子之间 ——
     左右两家的牌河于是被推到中间去，又变成"没靠自己边的手牌"（实测横屏截图）。
     shrink 保持 0：积分板 5 行不能被压（压了会溢出压牌河，之前踩过 26x4）。 */
  .centerInfo{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;
    position:static;transform:none;
    min-width:0;z-index:auto;flex:1 0 auto;width:auto}
  .centerInfo .info{white-space:nowrap}
  .centerInfo .scoreBoard{min-width:0}
  /* 横屏纵向极紧张、横向很富裕：弃牌区都改成「横铺多行」的牌河，
     且贴着牌桌中段摆，把上下的空白收掉。 */
  /* 左右两家：牌横躺，列数由"格子高度 + flex 换行"自动决定（见全局规则），
     这里不再固定列数/宽度。 */
  #discardTop,#discardBottom{flex-wrap:wrap;justify-content:center;gap:2px}
  /* 左右/上下四家弃牌统一用上面的 .discardZone .tile 尺寸（不再单独给左右两家设尺寸，
     避免"自己面前的牌小、两侧的牌大"这种不协调）。 */

  .scoreBoard{font-size:9px;padding:2px 4px;line-height:1.28;min-width:50px}
  .info{font-size:10px;padding:0;line-height:1.1}
  .nameTag{font-size:9px;padding:0 5px}
  #topInfo{display:none}          /* 横屏顶部信息行省的十几 px 全给牌桌 */
  .hand{padding:1px 2px}
  .melds{padding:0}
  /* 横屏高度只有 400 上下，操作条压得更扁，避免盖住牌桌。
     按钮仍保持在 46px 以上（--tap），保证手指点得准。 */
  #actions{bottom:var(--hand-h,58px);gap:5px;padding:0 4px 3px}
  #actions button{padding:8px 16px;font-size:15px;min-height:var(--tap);border-radius:22px}
  #actions .hint{font-size:11px;padding:4px 8px}
  #log{font-size:10px;padding:2px 6px;max-width:50%}
  /* 横屏空间是"横多竖少"：结算窗不用底部抽屉（高度不够、必须滚动），
     改成居中的卡片，宽度能摊开、纵向一行顶一行排得下；点遮罩即收起到角落。 */
  #result{padding:8px}
  #result .box{max-width:min(560px,94vw);width:auto;min-width:min(320px,92vw);padding:14px 16px;
    max-height:calc(100dvh - 16px);border-radius:14px}
  #result.peekMode{padding:0 8px calc(var(--reserve,0px) + 10px)}
  #result.peekMode .box{max-width:min(360px,88vw);min-width:0;
    max-height:calc(100dvh - var(--reserve,0px) - var(--top-h,60px) - 16px)}

  /* 横屏只有 ~400px 高，结算内容**竖排塞不下**：实测内容高 546px，
     而窗体上限只有 384px —— 「看四家亮牌 / 再来一局」两个按钮要滚动才够得到
     （等于结算完看不到操作入口）。这里把内容改成**左右两栏**：
     左栏=胡牌明细，右栏=本局得分+累计积分+按钮；配合收紧字号和内边距，
     内容高度降到约 250px，一屏看全、不用滚动。 */
  #result .box{flex-direction:row;flex-wrap:wrap;gap:10px 16px;padding:12px 16px;
    min-width:min(460px,94vw);max-width:min(620px,94vw)}
  /* 标题独占一行当"表头"：右上角的「×」（34×34）就有自己的一整条高度，
     不会压住下面两栏的文字（实测原来压住「你 本局 +24 番」20×21）。
     padding 左右都给 44px 是为了文字仍然居中，同时右侧正好让开按钮。 */
  #result h2{flex:1 1 100%;min-height:40px;margin:0;padding:0 44px;font-size:15px;
    display:flex;align-items:center;justify-content:center}
  #result .rMain{flex:1 1 0}
  #result .rSide{flex:1 1 0}
  #result .peekHint{flex:1 1 100%}
  #result .line{font-size:11.5px;padding:2px 0}
  #result .rScores{margin-top:4px}
  #result .scoreSummary{margin-top:6px;padding:3px 8px}
  #result .scoreSummary .line{font-size:11.5px}
  #result .rBtns{margin-top:8px}
  #result .box button{padding:8px 14px;font-size:12.5px;min-height:36px;border-radius:18px}
  #result .peekHint{font-size:10px;margin-top:5px}
  /* 收起态也走双栏：横屏是"宽而矮"，浮窗放宽一点比拉长更合适。
     收起态的窗体上限是「屏高 − 底部整摞(reserve) − 26」，比展开态还矮，
     所以行距/按钮再收一档，双栏内容才不会差那十几 px 滚起来。 */
  /* 横屏两侧副露在 x≈48~81 与 790~823 之间，中间有 ~700px 空档 → 收起态可以放宽，
     这样两栏内容 + 墙牌都能一行放下，不会顶破高度上限。 */
  #result.peekMode .box{max-width:min(688px,79vw)}
  #result.peekMode .box{gap:8px 16px}          /* 收起态窗体上限更紧，行距再省 2px */
  #result.peekMode h2{min-height:32px}         /* 表头再压 8px：「×」仍完整落在这一行内 */
  #result.peekMode .line{font-size:11px;padding:1px 0}
  #result.peekMode .box button{padding:7px 13px;min-height:34px}
  #result.peekMode .peekHint{margin-top:4px}
  /* 收起态在 400px 高的横屏里高度只剩 ~210px：提示行藏掉、墙牌缩到 8px 一行排完，
     否则"未摸到的牌"会把窗体顶出上限（一超就滚动）。 */
  #result.peekMode .peekHint{display:none}
  #result.peekMode{--wall-tw:8px;--wall-th:11px}   /* 一行排完 */
  /* 400px 高的横屏里收起态只剩 ~212px 可用：把"未摸到的牌"的标题省掉、上下留白压到 2px，
     这几张牌的图案本身就能说明问题（要完整信息点窗体展开即可）。 */
  #result.peekMode .rWallT{display:none}
  #result.peekMode .rWall{margin-top:0;padding-top:2px}
  /* 窗体上下内边距再省 4px（「×」是绝对定位、高度固定，不受影响） */
  #result.peekMode .box{padding:6px 14px}
  /* 「再来一局」搬到底部后，横屏收起态（只剩 ~212px）会差 ~11px → 上边距与按钮内边距各压一档。 */
  #result.peekMode .rBtns{margin-top:2px}
  #result.peekMode .rBtns button{padding:5px 12px;min-height:30px}
  #result.peekMode .line{font-size:10.5px;padding:0}
  #result.peekMode .rWallG .tile{width:10px;height:14px}
  /* 收起态在矮横屏要**再省掉「累计积分」那一块**（约 100px）：窗体上限是
     「屏高 − 底部整摞 − 顶部对家那一摞」，400px 高的屏只剩 ~290px，
     而两张表加起来要 319px → 会滚起来（实测裁切 23px）。
     累计积分在牌桌中央的积分板上本来就看得到，收起态省掉它不丢信息。 */
  #result.peekMode .scoreSummary{display:none}
  /* 墙牌块再省一档：400 高的横屏窗体上限只有 ~384px，原来超 12px（一超就滚动、等于白做）。 */
  #result .rWall{margin-top:4px;padding-top:4px}
  #result .rWallT{font-size:11px;margin-bottom:2px}
  #result .rWallG .tile{width:11px;height:15px}
}

/* --- ④ iPad / 平板（宽且高）：空间充足，牌面放大，触控更从容 ---
   ⚠️ 必须带高度门槛（min-height:560px）：否则手机横屏（871×400）
      也会命中这一档，被套上 iPad 的大尺寸牌 → 整桌溢出、层层遮挡。
      高度门槛让 ④ 只管真正的平板（iPad 竖 834×1194 / 横 1194×834 都满足）。 */
@media (min-width:760px) and (min-height:560px) and (pointer:coarse){
  :root{--dt-max-w:46px;--dt-max-h:62px;--dt-budget:0.22;--mel-max-w:39px;--mel-max-h:51px;--wall-tw:22px;--wall-th:31px}
  /* 他家手牌背面的设计基准（JS 按实测空间缩放，见 fitBacks） */
  :root{--back-w:25px;--back-h:34px;--side-w:22px;--side-h:30px}
  /* 手牌上限 54→58：11 寸以上的平板多利用一点横向空间（JS 还会按
     "行宽 + 视口高 12%" 再收一次，不会撑爆）。
     ⚠️ 弃牌区那几十条尺寸刻意不动：它们是按「格子宽 ÷ 牌宽 = 每行几张」
     调出来的，随手放大 12% 就会从「每行 2 张」掉成「每行 1 张」，
     18 张弃牌排成 18 行、被 overflow:hidden 裁掉一半（实测踩过一次）。
     大屏上弃牌的放大交给"牌数分档"(compact/ultra) 与牌河自动换行去消化。 */
  .tile{width:clamp(40px,5.4vw,58px);height:clamp(55px,7.4vw,79px);border-radius:6px}
  .back{width:clamp(22px,3vw,30px);height:clamp(30px,4.1vw,41px)}
  .tile.small{width:32px;height:43px}
  .melds .tile.small{width:28px;height:38px}
  .hand{gap:4px;padding:8px;min-height:0}
  .hand .tile.drawn{margin-top:-11px}
  .side{width:78px}
  .sideHand .tile{width:var(--side-bw,var(--side-w,22px));height:var(--side-bh,var(--side-h,30px))}
  .topHand .tile{width:var(--top-bw,var(--back-w,25px));height:var(--top-bh,var(--back-h,34px))}

/* 左右两家横躺后的**占位尺寸**，与该档 .tile 的尺寸成对（宽高互换）—— 改牌尺寸时必须同步改这里。 */
  /* 左右两家：容器宽度/对齐见全局规则；牌尺寸与上下两家统一（用上面的 .discardZone .tile）。 */
  .centerInfo{flex:1;min-width:88px}
  /* 文字也跟着屏幕走（固定 13px 在大平板上偏小） */
  .scoreBoard{font-size:clamp(12px,1.45vw,17px);padding:7px 9px;min-width:88px}
  .nameTag{font-size:clamp(12px,1.4vw,16px);padding:2px 10px}
  /* iPad 按钮加大到 Apple 建议的 44pt 以上，操作条仍在手牌正上方 */
  #actions{bottom:var(--hand-h,120px);gap:12px;padding:0 8px 12px}
  #actions button{padding:15px 30px;font-size:19px;min-height:54px;border-radius:30px}
  #actions .hint{font-size:15px;padding:8px 16px}
  #result .box{max-width:420px;padding:22px}
}

/* --- ⑤ 大屏（桌面浏览器 / 超宽窗口，鼠标或触控板）：按分辨率流体放大 ---
   桌面原来用写死的 38×52px，窗口再大牌也不会变，白白空着大片桌面。
   这一档把整套牌面绑到一个流体单位 --tw5 上（vw 与 vh 取小，
   所以超宽屏和超高屏都不会失控），分辨率越高牌越大，上限 64px。
   只加不改：前四档一条没动，手机/平板的表现与优化前完全一致。
   用 pointer:fine 把触屏设备排除在外，避免和 ④ 平板档抢规则。 */
@media (min-width:1101px) and (pointer:fine){
  :root{--dt-max-w:64px;--dt-max-h:86px;--dt-budget:0.22;--mel-max-w:48px;--mel-max-h:64px;--wall-tw:26px;--wall-th:36px}
  :root{
    --tw5:clamp(22px,min(2.7vw,3.4vh),64px);
    --back-w:calc(var(--tw5)*0.58);
    --back-h:calc(var(--tw5)*0.79);
    --side-w:calc(var(--tw5)*0.58);
    --side-h:calc(var(--tw5)*0.79);
  }
  .tile{width:var(--tw5);height:calc(var(--tw5)*1.36)}
  .tile.small{width:calc(var(--tw5)*0.74);height:calc(var(--tw5)*1)}
  .back{width:calc(var(--tw5)*0.58);height:calc(var(--tw5)*0.79)}
  .melds .tile.small{width:calc(var(--tw5)*0.63);height:calc(var(--tw5)*0.87)}
  #myMelds .meld .tile{width:calc(var(--tw5)*0.58) !important;height:calc(var(--tw5)*0.79) !important}
  .side{width:calc(var(--tw5)*1.85)}
  .sideHand .tile{width:var(--side-bw,var(--side-w,15px));height:var(--side-bh,var(--side-h,21px))}
.topHand .tile{width:var(--top-bw,var(--back-w,22px));height:var(--top-bh,var(--back-h,30px))}

/* 左右两家横躺后的**占位尺寸**，与该档 .tile 的尺寸成对（宽高互换）—— 改牌尺寸时必须同步改这里。 */
  /* 左右两家：容器宽度/对齐见全局规则；牌尺寸与上下两家统一（用上面的 .discardZone .tile）。 */
  .scoreBoard{font-size:clamp(12px,calc(var(--tw5)*0.34),18px)}
  .nameTag{font-size:clamp(11px,calc(var(--tw5)*0.3),16px)}
  #actions button{font-size:clamp(15px,calc(var(--tw5)*0.44),21px);min-height:clamp(44px,calc(var(--tw5)*1.2),60px)}
}
/* ===================== 掷色子 / 起名字 两个浮层 =====================
   层级从高到低：#nameDlg(70) > #dice(50) > 结算窗(40) > 手牌(16)。
   两者都是"居中卡片 + 半透明遮罩"，卡片高度一律卡在可视高度内并允许滚动，
   所以在 340px 高的横屏上也不会撑出屏幕（这是本页反复踩过的坑）。 */
#dice,#nameDlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:12px;overscroll-behavior:contain}
#dice{z-index:50;background:rgba(0,0,0,.42)}
/* 取名层要输入：安卓弹出键盘时布局视口不缩、卡片居中的话会被键盘压住，
   所以靠上排（留 8vh），键盘顶上来也仍能看见输入框和按钮。 */
#nameDlg{z-index:70;background:rgba(0,0,0,.68);align-items:flex-start;padding-top:8vh}
#dice.on,#nameDlg.on{display:flex}
#dice .diceBox,#nameDlg .nameBox{background:#fff;color:#22312a;border-radius:16px;
  padding:16px 18px;max-width:342px;width:100%;box-shadow:0 10px 34px rgba(0,0,0,.5);
  max-height:calc(100dvh - 24px);overflow:auto}
/* --- 色子 --- */
#dice .diceBox{text-align:center}
#dice .dTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:12.5px;font-weight:700;color:#0b3d2e}
#dice .dTop .dj{color:#a35b00}
#dice .dRow{display:flex;justify-content:center;gap:14px;margin:12px 0 8px}
#dice .die{width:clamp(46px,13vw,64px);height:clamp(46px,13vw,64px)}
#dice .die svg{width:100%;height:100%;display:block}
#dice .dSum{font-size:16px;font-weight:800;color:#0b3d2e;letter-spacing:.5px}
#dice .dInfo{font-size:12.5px;line-height:1.65;color:#3a5a4c;margin-top:8px;text-align:left}
#dice .dInfo b{color:#a35b00}
#dice .dTip{font-size:11.5px;color:#88a094;margin-top:10px}
/* 摇色子时的抖动：只动 transform，不参与布局，不会影响任何尺寸测量 */
@keyframes dieShake{0%{transform:rotate(-9deg) translateY(-2px)}50%{transform:rotate(8deg) translateY(2px)}100%{transform:rotate(-9deg) translateY(-2px)}}
#dice .die.rolling{animation:dieShake .12s linear infinite}
/* --- 起名 --- */
#nameDlg .nameBox{max-width:364px}
#nameDlg h3{font-size:16px;margin:0 0 6px;color:#0b3d2e}
#nameDlg .nTip{font-size:12px;line-height:1.6;color:#5d6f66;margin:0 0 12px}
#nameDlg .nTip b{color:#a35b00}
#nameDlg .nRow{display:flex;gap:8px;align-items:stretch}
#nameDlg input{flex:1 1 auto;min-width:0;font-family:inherit;font-size:16px;padding:11px 12px;
  border-radius:10px;border:1.5px solid #cfd8d3;background:#f8faf9;color:#123}
#nameDlg input:focus{outline:none;border-color:#0b3d2e;background:#fff}
#nameDlg .nRow button{flex:0 0 auto;white-space:nowrap}
#nameDlg .nBtns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
#nameDlg .nBtns button{flex:1 1 auto;min-width:120px}
#nameDlg .nWarn{font-size:11.5px;color:#c0392b;line-height:1.6;margin:10px 0 0;display:none}
#nameDlg .nWarn.on{display:block}
/* 矮横屏（400px 上下）再压一档，保证卡片连按钮一起进屏幕 */
@media (orientation:landscape) and (max-height:520px){
  #dice .diceBox,#nameDlg .nameBox{padding:12px 14px;border-radius:14px}
  #dice .dRow{margin:8px 0 6px;gap:10px}
  #dice .die{width:clamp(38px,9vw,52px);height:clamp(38px,9vw,52px)}
  #dice .dInfo{font-size:11.5px;line-height:1.5}
  #nameDlg h3{font-size:14.5px;margin-bottom:4px}
  #nameDlg .nTip{font-size:11.5px;margin-bottom:8px}
  #nameDlg .nBtns{margin-top:8px}
}

/* 极矮横屏（机身窄高比 >2，例如 800x340）：中排只剩 ~63px，上下两家的牌河必须让位，
   否则中央积分板（5 行）会往上溢出压住对家的牌河（实测 26x4）。
   放在所有档位**之后**：同优先级下后者胜，才能盖掉上面那条 clamp 上限。 */
@media (orientation:landscape) and (max-height:380px) and (max-width:1100px){
  /* 极矮横屏（≤380 高）：窗体内容本来就超过 max-height（一直是滚动看），
     再塞墙牌只会把「再来一局」推得更远 → 这里不显示。 */
  #result .rWall{display:none}
  #discardTop,#discardBottom,#discardTop.ultra,#discardBottom.ultra,
  #discardTop.compact,#discardBottom.compact{max-height:26px}
}

/* ===== 结算窗：内容装不下时**在窗内滚动**（不是裁切）=====
   用户要求「结算弹出直接出大图」，而矮横屏（871×400）可用高只有 384px，展开后内容约 400px。
   与其把它裁掉 16px，不如让窗体自己滚 —— 内容一张不少，往下滑就能看全。
   ⚠️ 写在所有媒体查询之后：同优先级下后者胜，才能覆盖各档的 max-height 规则。 */
#result .box{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ===== 四家副露：**统一尺寸**（写在所有媒体查询之后，保证压过各档写死的值）=====
   ⚠️ 以前四家各写各的：自己 20×27（#myMelds 的 !important）、对家 14×20（.topMelds）、
      左右两家 10.9×14.7（--smw/--smh = 手牌×0.42）—— 手牌一变就对不上，
      而且彼此差了一倍，看上去"每家的副牌区比例都不一样"（用户实测反馈）。
   现在只有一个来源：JS 按手牌尺寸算出 --mel-w/--mel-h，四家共用。 */
.melds .tile.small,.otherMelds .tile.small,.topMelds .tile.small,
.revealMelds .tile.small,.revealMelds.topMelds .tile.small,
#myMelds .meld .tile,#topMelds .meld .tile{
  width:var(--mel-w,20px) !important;height:var(--mel-h,27px) !important;border-radius:3px}
/* 对家副露：牌变大后原来 32px 的 max-height 会把第二行裁掉（四副会换行）。
   高度交给内容自己定，溢出让布局引擎去处理。 */
.topMelds{max-height:none}
/* ⚠️ `.otherMelds .meld{max-width:100%}` 会把侧栏那副横躺的牌按**占位盒宽**裁掉：
   占位盒宽只有"牌高+4"，而一副牌横着要 3~4 张牌宽 → 后两张被 overflow:hidden 吃掉。 */
#leftMelds .meld,#rightMelds .meld{max-width:none;overflow:visible}

/* ===== 有预选牌时，其它牌一律"收回手牌"（写在最后，压过各档的 .drawn margin-top）=====
   同一时间**只能有一张牌立起来**：立起来的那张 = 预选牌（或建议牌）。
   "刚摸到"的那张收平、只留一圈细金环（信息不丢，但不再和预选牌抢视觉）。 */
#myHand.picking .tile.drawn{margin-top:0 !important;box-shadow:none;
  outline:2px solid rgba(255,215,0,.7);outline-offset:1px}
#myHand.picking .tile.sug{outline:none;background:none;animation:none}
/* ⚠️ 收起态是"结算时默认的样子"，窗宽只有 ~232px（要给两侧副露让位），
   内容会比高度上限还高 → 一超就滚动、等于白做。累计积分在牌桌中央的积分板上本来就看得到，
   这里省掉它（本局得分仍逐家列出）；点窗体/「本局详情」展开后会重新出现。 */
#result.peekMode .scoreSummary{display:none}
/* 收起态的行距/标题压一档：窗宽只有 ~232px（给两侧副露让位），要同时装下
   标题 + 胡牌过程 + 本局得分 + **未摸到的牌** + 提示，必须把每行压缩。 */
#result.peekMode .line{font-size:11px;padding:1px 0}
#result.peekMode h2{font-size:15px;margin:2px 0;min-height:34px}   /* "×" 就长在这一行，别压没高度 */
#result.peekMode .rWall{margin-top:5px;padding-top:4px}
#result.peekMode .rWallT{font-size:10px;margin-bottom:1px;line-height:1.1}

<div id="table">
  <div class="info" id="topInfo">对家</div>
  <div class="row topHand" id="topHand"></div>
  <div class="row topMelds" id="topMelds"></div>
  <div style="display:flex;flex:1;align-items:stretch;min-height:0">
    <div class="side"><div class="nameTag" id="leftName">上家</div><div class="sideHand" id="leftHand"></div></div>
    <div class="center">
      <!-- 对家弃牌（上） -->
      <div class="discardZone" id="discardTop"></div>
      <div class="midRow">
        <!-- 下家：副露摆在他自己前面（在牌河外侧、紧挨着）+ 弃牌（左） -->
        <div class="otherMelds" id="leftMelds"></div>
        <div class="discardZone" id="discardLeft"></div>
        <!-- 中央：牌墙剩余 + 积分板 -->
        <div class="centerInfo">
          <div class="info" id="wallInfo"></div>
          <div class="scoreBoard" id="scoreBoard"></div>
        </div>
        <!-- 上家：弃牌（右）+ 副露摆在他自己前面（在牌河外侧、紧挨着） -->
        <div class="discardZone" id="discardRight"></div>
        <div class="otherMelds" id="rightMelds"></div>
      </div>
      <!-- 自己弃牌（下） -->
      <div class="discardZone" id="discardBottom"></div>
    </div>
    <div class="side"><div class="nameTag" id="rightName">下家</div><div class="sideHand" id="rightHand"></div></div>
  </div>
  <div class="row" id="myMelds"></div>
  <!-- 操作区：不再放在最底部（拇指/手掌会压住、手机下端也最容易误触），
       改为浮在手牌上方、贴近手牌的悬浮条，视线和手指都在同一区域。 -->
  <div id="actions"></div>
  <div class="hand" id="myHand"></div>
  <!-- 手牌托板：纯装饰层，盖在手牌与底部留白之下，不参与布局、不吃点击 -->
  <div id="shelf"></div>
</div>
<div id="log"></div>
<!-- 右上角悬浮控件：全屏开关 + 结算窗收起后重新打开的入口。

      <path d="M9 4v5H4M15 20v-5h5M15 4v5h5M9 20v-5H4"/>
    </g>
  </svg>
</button>

<script>
const SUIT=['万','条','筒'];
const cname=c=>(c%9+1)+SUIT[(c/9)|0];
const emptyC=()=>new Array(27).fill(0);
const toList=c=>{const a=[];for(let i=0;i<27;i++)for(let k=0;k<c[i];k++)a.push(i);return a;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function checkMelds(c){
  let i=0;while(i<27&&c[i]===0)i++;
  if(i===27)return true;
  if(c[i]>=3){c[i]-=3;const ok=checkMelds(c);c[i]+=3;if(ok)return true;}
  if(i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;const ok=checkMelds(c);c[i]++;c[i+1]++;c[i+2]++;if(ok)return true;}
  return false;
}
function isSevenPairs(c){let p=0;for(let i=0;i<27;i++){if(c[i]===0)continue;if(c[i]===2)p++;else if(c[i]===4)p+=2;else return false;}return p===7;}
// 注意：贵阳捉鸡麻将【没有缺一门/定缺】要求（DoubleWin 规则对比表：定缺 ❌）。
// 这里不再提供 isQue，历史上误加的缺门判定已全部移除。
function canHuShape(c){if(isSevenPairs(c))return true;for(let i=0;i<27;i++){if(c[i]>=2){c[i]-=2;const ok=checkMelds(c);c[i]+=2;if(ok)return true;}}return false;}
// ===== 副露（碰/杠）是**锁定的刻子**，判胡时不能拆开 =====
// 本作没有"吃"，每一副副露都是固定刻子，理应只算「一个已完成的面子」。
// 🔴 老做法：fullCount() 把每副副露按 3 张加回手牌，再交给 canHuShape() 整体拆解
//    → 副露里的牌能被拆出来当顺子或将用。用户 2026-09-16 实测的误判：
//      碰 9万 / 碰 2条 / 碰 3条 ＋ 手上 6筒7筒8筒 ＋ 4条5条（摸到 4条）
//      被拆成「9万刻 + 2条刻 + 条345（从碰出的 3条里抽 1 张）+ 筒678 + 将（又抽 2 张条3）」
//      → 弹出"自摸平胡"，但 4条5条 根本不是将，正确结论是**不能胡**。
//    同一根因还污染了 isTing()（叫牌判定 → 决定鸡分赔给谁）与 shanten()（AI 向听数）。
// 现在：暗牌必须自己凑出「(4 - 副露数) 个面子 + 恰好 1 将」；副露只当作已完成的面子。
function checkSetsExact(c,need){                 // 剩下的牌刚好拆成 need 个面子？
  if(need<0)return false;
  let i=0;while(i<27&&c[i]===0)i++;
  if(i===27)return need===0;
  if(need===0)return false;
  if(c[i]>=3){c[i]-=3;const ok=checkSetsExact(c,need-1);c[i]+=3;if(ok)return true;}
  if(i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;const ok=checkSetsExact(c,need-1);c[i]++;c[i+1]++;c[i+2]++;if(ok)return true;}
  return false;
}
function canSetsAndPair(c,need){                 // 凑出 need 个面子 + 恰好 1 将
  if(c.reduce((a,b)=>a+b,0)!==need*3+2)return false;
  for(let i=0;i<27;i++){
    if(c[i]>=2){c[i]-=2;const ok=checkSetsExact(c,need);c[i]+=2;if(ok)return true;}
  }
  return false;
}
// 能不能胡：hand = **暗牌**计数，melds = 副露数组（每副固定算 1 个面子）
function canWinWithMelds(hand,melds){
  const c=(hand||[]).slice();
  const n=(melds||[]).length;
  if(n===0)return canHuShape(c);                                            // 门清：七对 或 4 面子 + 1 将
  if(isSevenPairs(c))return false;                                           // 有副露做不成七对
  if(n>=4)return c.reduce((a,b)=>a+b,0)===2&&c.some(x=>x===2);               // 大吊车：手里只剩一对
  return canSetsAndPair(c,4-n);
}
// 把已副露的牌按真实规则补进计数：碰/明杠/暗杠均视为「一副面子」
// 注意：杠虽然占 4 张实物牌，但在牌型判定中只等于一副面子（3 张的位置），
// 若按 4 张计入会让总张数变成非法值（如 15 张），导致 checkMelds 永远拆不开。
// ⚠️ 但**判胡形状不能只看这个**：副露是锁定的刻子，必须用 canWinWithMelds(hand,melds)
//    （fullCount 只给「清一色 / 大对子」这类花色与刻子统计用，见该函数注释）。
function fullCount(hand,melds){
  const c=hand.slice();
  (melds||[]).forEach(m=>{c[m.card]+=3;});
  return c;
}
// 已副露的面子数（每副 3 张）
function meldTiles(melds){return (melds||[]).reduce((a,m)=>a+(m.type==='gang'?4:3),0);}
// ===== 牌型识别（依 DoubleWin《贵阳捉鸡完全规则》权威版）=====
// 番型总表（互斥，取最高）：
//   天胡 33 / 地胡 23 / 清龙七对 20 / 清七对 17 / 清大对 15 /
//   龙七对 10 / 清一色 10 / 七对 7 / 大对子 5 / 平胡 1
// 额外加成：杠上花 +1 番（「带杠」不再折番 —— 豆按 2/3/1 单独结算，见 douSettle）
// 无缺门、无字牌、不能吃，四副面子 + 一对将（副露面子一并计入）
function isAllPairs(c){                     // 大对子：4 刻子 + 1 对（无顺子）
  let pairs=0;
  for(let i=0;i<27;i++){
    if(c[i]===0)continue;
    if(c[i]===3)continue;
    if(c[i]===2)pairs++; else return false;
  }
  return pairs===1;
}
function isOneSuit(c){                       // 清一色：只有一门花色有牌
  let used=0;
  for(let s=0;s<3;s++){
    let hit=false;
    for(let i=s*9;i<s*9+9;i++)if(c[i]>0)hit=true;
    if(hit)used++;
  }
  return used===1;
}
// 龙七对：七对 + 【至少】1 组四归一（4 张相同）。
// DoubleWin 原文：「龙七对 10 —— 七对 + 至少 1 个四归一」。
// 注意「至少」二字：如果写成「恰好 1 组四归一」，那两个四归一（8 张）的
// 形态就会被漏判、掉到低一档的七对，这是错的。
//   · 0 组四归一 → 七对
//   · ≥1 组四归一 → 龙七对（番表无「双龙七对」，多个四归一同档）
function sevenPairsInfo(c){
  let pairs=0,quads=0;
  for(let i=0;i<27;i++){
    if(c[i]===0)continue;
    if(c[i]===2)pairs++;
    else if(c[i]===4)quads++;
    else return null;                      // 出现 1 张或 3 张 → 不是七对结构
  }
  if(pairs+quads*2!==7)return null;        // 总对数必须恰好 7 对
  return {pairs,quads};
}
function isSevenPairs(c){return !!sevenPairsInfo(c);}
function isLongQiDui(c){                   // 龙七对：七对且至少 1 组四归一
  const info=sevenPairsInfo(c);
  return !!info&&info.quads>=1;
}
// 基础牌型（不含杠/杠上花/天胡地胡加成）
// c 为「含副露」的完整计数（副露按 3 张/面子计入）
//
// 关于「清一色」的判定口径（易错点）：
//   清X 只表示「只有一门花色」，并不要求该牌型把副露也算成全同花色。
//   例：碰了一副筒子的人，手上万子凑成七对 —— 这仍然是「清七对」。
//   因此这里统一用「手牌（不含副露）是否单一花色」来定清一色，
//   而不是对 fullCount（含副露）判 —— 后者会被副露的花色污染，
//   导致清七对退化成七对、清一色退化成平胡。
// c 传入的是 fullCount(hand, melds)；用 meldCards 传回副露牌，
// 便于把「暗牌部分」还原出来做花色判定。
function huPattern(hand,melds){
  const mc=melds||[];
  // fullCount 只用于「清一色 / 大对子」这类**花色与刻子统计**：清 = 暗牌+副露整副同一门。
  const c=fullCount(hand,mc);
  const one=isOneSuit(c);
  // 🔴 形状判定必须用 canWinWithMelds（副露锁定为刻子）；
  //    曾经用 canHuShape(fullCount(...)) → 副露能被拆开用，误判成能胡（见 canWinWithMelds 注释）。
  if(!canWinWithMelds(hand,mc))return null;
  // 七对类：必须门清 14 张（有副露就不可能七对）
  if(mc.length===0){
    const info=sevenPairsInfo(c);
    if(info){
      if(info.quads>=1)return {fan:one?20:10,name:one?'清龙七对':'龙七对'};
      return {fan:one?17:7,name:one?'清七对':'七对'};
    }
  }
  const allPairs=isAllPairs(c);
  // 大吊车 = 4 副露 + 单钓（手里只剩一对将等一张）17 点
  if(allPairs&&mc.length===4)return {fan:17,name:'大吊车'};
  if(allPairs)return {fan:one?15:5,name:one?'清大对':'大对子'};
  return {fan:one?10:1,name:one?'清一色':'平胡'};
}
// 判断是否满足「平胡以上的牌型」——这类牌型无豆（无杠）也可点炮胡
// 「大胡」= **大对子（12 点）及以上**（无豆时大胡可直接吃胡；平胡/鸡胡只能自摸）。
// ⚠️ 现番表里 大对子=5、平胡=1 → 阈值取 5 就等于「大对子及以上」；改番表时同步这个数。
const BIG_FAN=5;
/* ===== 番值表（**权威**，2026-09-15 与用户逐条确认）=====
     天胡 33 ｜ 地胡 23 ｜ 清龙七对 20 ｜ 清七对 17 ｜ 清大对 15
     天听 34 ｜ 报听 17 ｜ 大吊车 17 ｜ 开局跟 4          （表外补充，见 番型核查.md）
     龙七对 10 ｜ 清一色 10 ｜ 七对 7 ｜ 大对子 5 ｜ 平胡 1
   ⚠️ BIG_FAN（无豆点炮胡的门槛）= 5 必须等于"大对子"；改这张表要同步改它。
   ⚠️ 本表是**取最高**口径（不是叠加）—— 改口径只需动 settle 里的 baseFan 计算一处。 */
function isBigPattern(p){return !!p&&p.fan>=BIG_FAN;}
// 基础番 = 牌型番 + 每个杠 +1 番 + 杠上花 +1 番
// melds 为刚胡时的副露列表；opts.gangFlower 表示本张牌是杠后摸到的（杠上花）
function gangBonus(melds){return (melds||[]).filter(m=>m.type==='gang').length;}
function canHu(hand,melds,opts){
  const pat=huPattern(hand,melds);
  if(!pat)return false;                                     // 牌型不成
  const hasDou=(melds||[]).some(m=>m.type==='gang');        // "豆"= 任意杠
  const zimo=!!(opts&&opts.zimo);
  // 豆豆通行证：有豆可胡任意番型（含平胡）；
  // 无豆点炮必须 ≥5 番的大牌；自摸不受限制。
  // 带杠本身加番，故用总番数（含每杠 +1）与 5 比较。
  // 无豆时：只有「大对子（12 点）及以上」能点炮胡（平胡/鸡胡只能自摸）；自摸不受限。
  // force：报听者打出的牌，别人**无豆也能平胡**（规则原文）→ 由调用方传 force:true
  if(!hasDou&&!zimo&&pat.fan<BIG_FAN&&!(opts&&opts.force))return false;
  return true;
}
// 供 UI / 结算使用：取当前手牌的牌型（含杠加成与自摸加成）
// opts.zimo      —— 自摸（番数 +1，与牌型无关）
// opts.gangFlower —— 杠上花（番数 +1）
function currentPattern(hand,melds,opts){
  const p=huPattern(hand,melds);
  if(!p)return null;
  const o=opts||{};
  const gb=(o.gangFlower?1:0)+(o.zimo?1:0);   // 豆不折进番数（单独结算），这里只算杠上花/自摸
  const parts=[p.name];
  if(gb)parts.push('+'+gb+'分');
  return {fan:p.fan+gb,name:parts.join(''),base:p.fan,gang:gb,zimo:!!o.zimo};
}
// 幺鸡=1条(9) / 乌骨鸡=8筒(25)：真牌策略是「不要第一个打出去」
function isChickenTile(c){return c===9||c===25;}
function aiDiscard(hand){
  let best=-1,bs=1e9;
  for(let i=0;i<27;i++){
    if(hand[i]===0)continue;
    let sc=hand[i]*10;
    if(i%9>0)sc+=hand[i-1]*3;
    if(i%9<8)sc+=hand[i+1]*3;
    if(i%9>1)sc+=hand[i-2];
    if(i%9<7)sc+=hand[i+2];
    if(isChickenTile(i))sc+=40;   // 打出去等于送鸡给叫牌家：AI 尽量留着幺鸡/乌骨鸡不当出头鸟
    if(sc<bs){bs=sc;best=i;}
  }
  return best;
}

// ===== 电脑玩家 AI 增强（中等偏强档）=====
// 设计说明：原 aiDiscard(hand) 只做「孤张优先丢」的静态启发，无叫牌计算、无防守。
// 这里新增一套以「向听数」为核心的评估体系，供 aiDiscardSmart(p) 使用。
// 原 aiDiscard 保留不动，兼容既有测试。

// 向听数：距离胡牌还差几张（-1 = 已胡，0 = 叫牌，n = 还差 n 张）
// 算法：递归枚举「拆刻子 / 拆顺子 / 拆对子」，统计每种拆法的
//       (面子数 m, 搭子数 t, 是否有将 eye)，用标准公式取最优。
// 公式：shanten = 8 - 2*m - t - (eye?1:0)
//   m 上限 4（4 副面子），t 上限 4-m（剩下的搭子）
// meldCount：已有副露面子数（每副算 1 个完整面子，直接计入 m）
// shanten 记忆化缓存：key = 27 位手牌指纹 + 副露数。
// usefulTiles 会对同一手牌反复试算 27 张补牌，命中率极高，缓存能大幅提速。
// 容量上限 20000 条，超限时整体清空（手牌指纹高度重复，重建成本很低），
// 避免长时间连续对局导致内存无界增长。
const SH_CACHE=new Map();
const SH_CACHE_MAX=20000;
function handKey(c,mc){
  let k=String.fromCharCode(48+mc);
  for(let i=0;i<27;i++)k+=String.fromCharCode(48+(c[i]>9?9:c[i]));
  return k;
}
// 向听数：距离胡牌还差几张（-1 = 已胡，0 = 叫牌，n = 还差 n 张）
// 入参：hand = **暗牌**计数（不含副露），meldCount = 副露副数（每副 = 1 个锁定面子）。
// 🔴 这里必须只拆暗牌：老版本传的是 fullCount()（含副露的完整计数），于是副露里的牌
//    能被拆出来凑对子/顺子 → 向听数偏乐观（和判胡误判是同一个根因）。
//    正确做法：副露直接作为已完成的面子计入 m（递归从 m=mc 起），只对暗牌做拆解。
// 注意：mc 只影响「已有的面子数」与缓存键，绝不能再把副露的牌放进 hand 里。
function shanten(hand, meldCount){
  const mc=meldCount||0;
  const key=handKey(hand,mc);
  const hit=SH_CACHE.get(key);
  if(hit!==undefined)return hit;
  let best=99;
  const a=hand.slice();
  function rec(i, m, t, eye){
    if(i>=27){
      // m 已含副露（递归从 m=mc 起），受 4 副面子上限约束
      const mm=Math.min(m,4);
      const tt=Math.min(t,4-mm);
      const sh=8-2*mm-tt-(eye?1:0);
      if(sh<best)best=sh;
      return;
    }
    if(best<=-1)return;                  // 已算出「已胡」，不可能更优
    if(a[i]===0){rec(i+1,m,t,eye);return;}
    if(a[i]>=3&&m<4){a[i]-=3; rec(i,m+1,t,eye); a[i]+=3;}
    if(m<4&&i%9<=6&&a[i]>0&&a[i+1]>0&&a[i+2]>0){
      a[i]--;a[i+1]--;a[i+2]--;
      rec(i,m+1,t,eye);
      a[i]++;a[i+1]++;a[i+2]++;
    }
    if(a[i]>=2){
      a[i]-=2;
      if(!eye) rec(i,m,t,true);        // 当将
      rec(i,m,t+1,eye);                // 当搭子
      a[i]+=2;
    }
    if(i%9<=7&&a[i]>0&&a[i+1]>0){a[i]--;a[i+1]--; rec(i,m,t+1,eye); a[i]++;a[i+1]++;}
    if(i%9<=6&&a[i]>0&&a[i+2]>0){a[i]--;a[i+2]--; rec(i,m,t+1,eye); a[i]++;a[i+2]++;}
    a[i]--; rec(i,m,t,eye); a[i]++;
  }
  rec(0,mc,0,false);
  if(SH_CACHE.size>=SH_CACHE_MAX)SH_CACHE.clear();
  SH_CACHE.set(key,best);
  return best;
}

// 有效进张：当前手牌再摸一张后，能「降低向听数」的牌共有多少张（考虑已消耗的牌）
// 返回 {types: 种类数, tiles: 张数}，张数含牌河/副露里已见的扣减
function usefulTiles(hand, melds){
  const base=shanten(hand, (melds||[]).length);
  const total=hand.slice();
  (melds||[]).forEach(m=>{total[m.card]+=(m.type==='gang'?4:3);});   // 杠是 4 张，别一律按 3 张算
  // 统计所有已可见的牌（自己手牌 + 自己副露 + 全场牌河）
  const seen=total.slice();
  G.discards.forEach(d=>d.forEach(x=>{seen[x]++;}));
  // 其他三家的副露也算可见
  [1,2,3].forEach(q=>{(G.melds[q]||[]).forEach(m=>{seen[m.card]+=(m.type==='gang'?4:3);});});
  const my=G.turn;
  let types=0, tiles=0;
  for(let c=0;c<27;c++){
    if(seen[c]>=4)continue;                 // 这张已经绝了
    hand[c]++;
    const sh=shanten(hand,(melds||[]).length);
    hand[c]--;
    if(sh<base){types++;tiles+=(4-seen[c]);}
  }
  return {types:types, tiles:tiles};
}

// ===== 危险度：这张牌打出去的点炮风险（0=安全，8=最危险）=====
// 🔴 旧版只数「全场见过几张」，完全没有筋 / 副露 / 中张的概念 —— 于是电脑到了尾声
//    照样打中张生张、放炮明显偏多（用户反馈「电脑的水平还是有点低」，而它的**选牌效率**
//    实测已接近最优，差的就在防守面）。这里按**逐家评估再取平均**重写：
//    · 这一家打过这张 → 他的现物，不会要 → 0 风险；
//    · 筋：这一家打过同花色 rank±3 的牌 → 本张打出去被他要的概率下降；
//    · 中张（3~7）比幺九危险（越靠中间越容易被要）；
//    · 这一家副露越多 → 越接近叫牌 → 风险加码；
//    · 别处已现的张（残张少）→ 略微安全。
function dangerScore(card, self){
  if(G.discards[self].indexOf(card)>=0)return 0;      // 自己打过：不会点自己的炮
  const rank=card%9, base=card-rank;
  let sum=0, cnt=0;
  for(let p=0;p<4;p++){
    if(p===self)continue;
    cnt++;
    const d=G.discards[p]||[];
    if(d.indexOf(card)>=0)continue;                   // 这家的现物 → 他不会要 → 0 风险
    let v=6;
    if(rank>=2&&rank<=6)v+=2.5;                       // 中张：最容易被人要
    else if(rank===0||rank===8)v-=2;                  // 幺九：相对安全
    // 筋：这家打过同花色 rank±3 的牌
    let suji=0;
    if(rank-3>=0&&d.indexOf(base+rank-3)>=0)suji++;
    if(rank+3<=8&&d.indexOf(base+rank+3)>=0)suji++;
    v-=suji*2.5;
    // 副露多 = 离叫牌近 = 更危险
    const mn=(G.melds[p]||[]).length;
    if(mn>=3)v+=3.5; else if(mn>=2)v+=2;
    // 别处已现的张（残张少）→ 略微安全
    let seen=0;
    for(let q=0;q<4;q++){
      if(q===p)continue;
      const dd=G.discards[q]||[];
      for(let i=0;i<dd.length;i++)if(dd[i]===card)seen++;
    }
    v-=Math.min(3,seen)*0.8;
    if(v>0)sum+=v;
  }
  return cnt?Math.max(0,Math.min(8,sum/cnt)):0;
}

// 危险度的**权重**：开局几乎不管危险、尾声重罚；有人副露多则整体加码。
// （麻将 AI 的常识：危险值本身是"静态"的，真正决定要不要弃和的是**牌局进度**。）
function dangerWeight(p){
  const wallLeft=(G.wall&&G.wall.length)||40;
  const prog=1-Math.min(1,Math.max(0,(wallLeft-10)/44));   // 0=开局 → 1=尾声
  let threat=0;
  for(let q=0;q<4;q++){
    if(q===p)continue;
    const n=(G.melds[q]||[]).length;
    if(n>=3)threat+=0.35; else if(n>=2)threat+=0.18;
  }
  return 1+3.4*prog+threat;
}

// 番型倾向：手牌越接近高番牌型，加分越多（引导 AI 不轻易放弃大牌）
function patternBonus(hand, melds, p){
  // 「做大牌的」才给番型倾向加分；优先叫牌的那 70% 直接返回 0 ——
  // 出牌评分里向听数/进张本来就在前两位，去掉番型加分后它们就是纯效率优先（最快叫牌）。
  if(typeof G!=='undefined'&&G&&G.aiBig&&!G.aiBig[p])return 0;
  const c=fullCount(hand,melds);
  const total=c.reduce((a,b)=>a+b,0);
  let bonus=0;
  // 七对倾向：统计对子数（无副露时才可能）
  if(!(melds&&melds.length)){
    let pairs=0, singles=0;
    for(let i=0;i<27;i++){
      if(c[i]===2||c[i]===4)pairs++;
      else if(c[i]===1||c[i]===3)singles++;
    }
    if(pairs>=5)bonus+=(pairs-4)*8;         // 已成型 5 对以上，值得继续做七对
    if(pairs>=6)bonus+=18;
  }
  // 清一色倾向：统计主花色占比
  const suit=[0,0,0];
  for(let i=0;i<27;i++)suit[(i/9)|0]+=c[i];
  const main=Math.max(suit[0],suit[1],suit[2]);
  if(total>0){
    const ratio=main/total;
    if(ratio>=0.75)bonus+=12;
    else if(ratio>=0.6)bonus+=5;
  }
  // 大对子倾向：刻子多
  let triples=0;
  for(let i=0;i<27;i++)if(c[i]>=3)triples++;
  if(triples>=3)bonus+=triples*3;
  // ⚠️ 权重试过 ×8：**更差** —— 追大牌把进张牺牲光（实测 34 人次只胡 3 把、平均番 1.7、大牌型 0%，
  //    效率流 86 人次胡 23 把、平均番 2.4、大牌型 9%）。×2 是"温和偏好"：番型看得出来，又不至于拖垮牌型。
  return bonus*2;
}

// 增强版出牌决策：接收「家号 p」，综合向听 / 进张 / 危险 / 番型 / 留鸡 打分
// 性能关键：进张数（usefulTiles，约 1.5ms/次）只对「向听数已达最优」的候选计算，
// 先用便宜的向听数筛一轮，避免对 14 个候选全部精算（否则 20ms+/手）。
function aiDiscardSmart(p){
  const hand=G.hands[p], melds=G.melds[p];
  const meldN=(melds||[]).length;
  // —— 第一轮：只看向听数（**只干"筛掉会亏向听的牌"这一件事**），记录最优值 ——
  //   ⚠️ 旧版在这里给幺鸡/乌骨鸡加 1.5 个向听数（理由："打鸡要担冲锋鸡的责任"）——
  //      后果是它**永远进不了最优档候选**：实测 36 副有机会的手牌，电脑打出鸡 **0 次**
  //      （用户 2026-09-16 反馈"电脑很少打冲锋鸡，和实际玩牌不一样"）。
  //      该不该打鸡是**估价**问题 → 挪到第二轮用软惩罚处理。
  const cands=[];
  let bestSh=99;
  for(let c=0;c<27;c++){
    if(hand[c]===0)continue;
    hand[c]--;
    const sh=shanten(hand,meldN);
    hand[c]++;
    cands.push({c:c,sh:sh});
    if(sh<bestSh)bestSh=sh;
  }
  if(!cands.length)return aiDiscard(hand);   // 兜底
  // —— 第二轮：只对最优向听档位的候选，精算进张/危险/番型 ——
  const top=cands.filter(x=>x.sh<=bestSh+1e-9);
  let best=-1,bestScore=-1e9;
  for(const o of top){
    const c=o.c;
    hand[c]--;
    const ut=usefulTiles(hand,melds);           // 精算有效进张
    const pb=patternBonus(hand,melds,p);
    hand[c]++;
    const danger=dangerScore(c,p);
    // 自己离叫牌越近越该冲（0.55），越远越该收（1.15）；再乘"牌局进度 + 对手副露"权重。
    // 旧版是固定 *14 不随进度变化 → 开局太怂、尾声太莽，正好反了。
    // 冲/收的强度分三档（麻将常识：**已经叫牌就别为了安全拆叫**）：
    //   sh<=0（打完就叫牌）→ 0.18；sh==1 → 0.5；≥2 → 1.15（该收就收）。
    const push=(o.sh<=0)?0.18:((o.sh===1)?0.5:1.15);
    let sc = -o.sh*1000 + ut.tiles*12 + ut.types*6 - danger*12*dangerWeight(p)*push + pb;
    // 幺鸡/乌骨鸡：打出去可能是**本局第一张**（= 冲锋鸡）。但那笔钱**不是纯亏** ——
    //   自己叫了牌是**收**（其他三家各付 2 分），只有没叫牌才要赔给每个叫牌家 2 分。
    //   所以：① 这个牌种**已经有人冲过** → 无风险，不罚；
    //        ② 打完这张就能叫牌（o.sh<=0）→ 几乎不罚；离叫牌越远越收着点（4 / 12 / 22）。
    //   量级压得很轻（一张有效进张 = 12 分），只在"两张牌差不多"时才影响选择。
    //   ⚠️ 这里原来是 `sc += 70`（**加分** = 更该打），跟它自己的注释"不做第一个打出去的"方向相反。
    if(isChickenTile(c)&&!(G.chargeChickens||[]).some(ch=>ch.card===c))
      sc -= (o.sh<=0)?4:((o.sh===1)?12:22);
    if(sc>bestScore){bestScore=sc;best=c;}
  }
  if(best<0)best=aiDiscard(hand);              // 兜底
  return best;
}

// 是否应该碰：碰之后向听数不变差，且不会破坏七对，才碰
function shouldPeng(p, card){
  const melds=G.melds[p]||[];
  const hand=G.hands[p];
  // ① 已经没有副露空间
  if(melds.length>=4)return false;
  // ② 手牌碰掉 2 张后必须还能留 ≥1 张可打
  const handN=hand.reduce((a,b)=>a+b,0);
  if(handN-2<1)return false;
  // ③ 七对倾向：暗牌还没副露、且对子≥4 时，不碰（碰了就做不成七对）
  if(melds.length===0){
    let pairs=0;
    for(let i=0;i<27;i++)if(hand[i]>=2)pairs++;
    if(pairs>=4&&(G.aiBig?G.aiBig[p]:false))return false;   // 只有"做大牌风"才保七对
  }
  // ④ 向听数比较：碰之前 vs 碰之后（碰 = 手牌 -2 + 多一副面子 +3）
  // 🔴 原来只写了 `h2[card]-=2`，**忘掉碰出来的那 3 张** → 等于"碰一下凭空少 3 张牌"，
  //    算出来向听数永远变差 → 电脑几乎从不碰牌。实测 280 副手牌：旧口径只有 1% 通过、
  //    正确口径 95%（样例：before=2 → 旧算出 3 → 正确算出 1）。
  const before=shanten(hand,melds.length);
  const h2=hand.slice(); h2[card]-=2;          // 暗牌 -2（碰出去的正是那两张）；多出的面子由 melds.length+1 表示
  const after=shanten(h2,melds.length+1);
  // 碰之后向听数不能变大（变差就不碰）
  return after<=before;
}

const G={hands:[emptyC(),emptyC(),emptyC(),emptyC()],melds:[[],[],[],[]],discards:[[],[],[],[]],wall:[],turn:0,dealer:0,phase:'idle',drawn:null,lastDiscard:null,lastDiscardBy:-1,pendingAction:null,chickenCard:null,

                            //   via/from 有值 = 被碰/杠走过 → 结算时若碰走者叫牌则持有者已换成他（见 chickenSettle ④）
  respChickens:[],          // 责任鸡④：**所有**被打出后被碰/杠走的鸡 [{from,by,card,how}]，打出者多付 1 分

  hotCannonGang:null,        // 热炮撤销用：记录那名玩家本局刚成的杠副露
