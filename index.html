const PLAYER=0,NAMES=['你','下家','对家','上家'];
const log=m=>document.getElementById('log').innerHTML=m;
/* ===================== 音效引擎 SFX =====================
   为什么用「实时合成」而不是一堆 mp3 文件：
     ① 本作是**单文件**游戏（一个 index.html 双击就能玩）。Chrome/Edge 在 file:// 下
        禁止 fetch/XHR 读本地文件（跨源），"预加载一批音频再播放"这条路在本地直接走不通；
        而 WebAudio 的合成音**零资源**：不附带任何文件、离线可用、体积极小、永不 404。
     ② 每条音效都是一个"配方"（见 R 表），要改音色只改参数，不用重新找素材。
     ③ 想换成真实录音也不用改逻辑：把文件放进 sfx/ 目录并填进 SFX.SAMPLES，
        加载成功就自动改用样本、失败就静默回落到合成音（见 loadSamples）。

   三条工程要点（不这么做在手机上会出问题）：
     · **自动播放策略**：浏览器要求"先有用户手势"才允许出声。首次 pointerdown/
       touchstart/keydown 自动解锁（unlock），牌桌上的任何点击也都是手势。
     · **节流**：连点牌、连响的 key 用 THROTTLE 限流，避免同一声叠加成噪音。
     · **切后台挂起**：visibilitychange 里 suspend/resume，省电（移动端很重要）。
   所有对外调用都包了 try/catch：没有 WebAudio、被系统静音、上下文创建失败时
   一律"静默空转"，**绝不影响牌局逻辑**。 */
const SFX=(function(){
  const KEY='gymj.sfx.v1';
  const cfg={on:true,vol:0.75};
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&typeof s==='object'){
      if(typeof s.on==='boolean')cfg.on=s.on;
      if(typeof s.vol==='number'&&isFinite(s.vol))cfg.vol=Math.max(0,Math.min(1,s.vol));
    }
  }catch(e){}
  const saveCfg=()=>{try{localStorage.setItem(KEY,JSON.stringify({on:cfg.on,vol:cfg.vol}));}catch(e){}};

  const AC=(typeof window!=='undefined')?(window.AudioContext||window.webkitAudioContext||null):null;
  let ac=null,master=null,noise=null;

  // 懒创建：AudioContext 要等到真有需要时才建（一进页面就建会被浏览器判成打扰用户）
  function ensure(){
    if(ac||!AC)return ac;
    try{
      ac=new AC();
      master=ac.createGain();
      master.gain.value=cfg.on?cfg.vol:0;
      master.connect(ac.destination);
      // 0.4 秒白噪声缓冲，所有"撞击类"音效共用这一份（只生成一次，不再分配内存）
      const n=Math.max(1,Math.floor(ac.sampleRate*0.4));
      noise=ac.createBuffer(1,n,ac.sampleRate);
      const d=noise.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    }catch(e){ac=null;master=null;noise=null;}
    return ac;
  }
  function unlock(){
    try{
      const c=ensure();if(!c)return false;
      if(c.state==='suspended'&&typeof c.resume==='function'){
        const r=c.resume();if(r&&typeof r.catch==='function')r.catch(()=>{});
      }
      return true;
    }catch(e){return false;}
  }

  /* ---------- 两个发声原语：全部音效都由它们拼出来 ---------- */
  // 撞击：白噪声 → 带通 → 4ms 起振 / 极快衰减。麻将的「嗒、啪」就是这种形状
  //        （噪声脉冲 + 很短的尾巴）；过滤器的中心频率决定"木"还是"瓷"。
  function hit(t,f,o){
    if(!ac||!noise)return;
    o=o||{};
    const src=ac.createBufferSource();src.buffer=noise;src.loop=true;
    const bp=ac.createBiquadFilter();
    bp.type=o.type||'bandpass';
    bp.frequency.value=f;
    bp.Q.value=(o.q===undefined?7:o.q);
    const g=ac.createGain();
    const peak=(o.g===undefined?0.5:o.g), dur=(o.dur===undefined?0.09:o.dur);
    g.gain.setValueAtTime(0.0001,t);                       // ⚠️ 指数包络不能从 0 开始
    g.gain.exponentialRampToValueAtTime(peak,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(bp);bp.connect(g);g.connect(master);
    src.start(t);src.stop(t+dur+0.04);
  }
  // 乐音：三角波（柔和、长时间听不刺耳），o.to 给滑音终点
  function note(t,f,dur,o){
    if(!ac)return;
    o=o||{};
    const osc=ac.createOscillator();
    osc.type=o.type||'triangle';
    osc.frequency.setValueAtTime(f,t);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
    const g=ac.createGain();
    const peak=(o.g===undefined?0.22:o.g);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g);g.connect(master);
    osc.start(t);osc.stop(t+dur+0.04);
  }

  /* ---------- 音效配方表：t = 起始时刻（AudioContext 时钟，秒） ---------- */
  const R={
    // 轻点（选牌 / 按钮）：一颗木珠轻碰，两声错开 6ms 让"颗粒感"更清楚
    tap:t=>{hit(t,1500,{dur:.05,q:9,g:.30});hit(t+.006,2600,{dur:.035,q:12,g:.14});},
    // 非法操作（还没轮到你 / 有动作没选）：低闷一声「唔」，下行
    deny:t=>{note(t,196,.20,{g:.20,type:'sine',to:150});},
    // 出牌：牌拍在桌面上 —— 高频碎裂 + 低频冲击，是全套里最"脆"的一声
    discard:t=>{hit(t,1800,{dur:.10,q:3.5,g:.62});hit(t+.004,420,{dur:.13,q:2,g:.34,type:'lowpass'});},
    // 摸牌：牌从牌墙里滑出来（很轻的高频摩擦，不能盖过出牌）
    draw:t=>{hit(t,3200,{dur:.075,q:1.2,g:.20,type:'highpass'});hit(t+.03,1500,{dur:.06,q:5,g:.14});},
    // 碰：三声「嗒嗒嗒」= 三张牌码齐（音高逐张微升，听起来是"码上去"）
    peng:t=>{[0,.055,.11].forEach((d,i)=>hit(t+d,1250+i*90,{dur:.075,q:7,g:.50}));},
    // 明杠：四声、更矮更重（牌更多、动作更重）
    gang:t=>{[0,.06,.12,.18].forEach((d,i)=>hit(t+d,950+i*70,{dur:.09,q:6,g:.52}));},
    // 暗杠：闷响（牌扣着敲桌：低通 + 低音铺底）
    angang:t=>{hit(t,620,{dur:.14,q:2.2,g:.55,type:'lowpass'});
               hit(t+.09,760,{dur:.12,q:3,g:.40,type:'lowpass'});
               note(t+.02,147,.28,{g:.18,type:'sine',to:110});},
    // 补杠（爬坡豆）：中音双响，听感是"再接一张上去"
    bugang:t=>{hit(t,1050,{dur:.09,q:5,g:.50});hit(t+.11,1400,{dur:.10,q:6,g:.48});},
    // 叫牌 / 叫牌：清脆一声金铃（三度上行，短）
    ting:t=>{note(t,988,.16,{g:.22});note(t+.09,1319,.34,{g:.20,type:'sine'});},
    // 轮到你了：柔和两音（不催人，每回合都会响，必须最轻）
    prompt:t=>{note(t,784,.13,{g:.16});note(t+.11,1047,.22,{g:.15,type:'sine'});},
    // 有可选动作（可以碰 / 可以杠）：三连上行叮
    alert:t=>{[0,.1,.2].forEach((d,i)=>note(t+d,[880,1175,1568][i],.16,{g:.20,type:'sine'}));},
    // 可胡！（含可抢杠胡）：五音上行琶音，比 alert 更亮更长 —— 这个必须能听出来
    huReady:t=>{[0,.08,.16,.24,.34].forEach((d,i)=>note(t+d,[784,988,1175,1568,2093][i],i===4?.5:.2,{g:.22,type:'sine'}));},
    // 点炮胡：温和的四音上行
    hu:t=>{[0,.1,.2,.32].forEach((d,i)=>note(t+d,[523,659,784,1047][i],i===3?.55:.24,{g:.24,type:'triangle'}));},
    // 自摸胡：六音上行 + 长尾（自己的牌，更得意）
    zimo:t=>{[0,.085,.17,.255,.34,.44].forEach((d,i)=>note(t+d,[523,659,784,988,1175,1568][i],i===5?.8:.22,{g:.26,type:'triangle'}));
             note(t+.44,784,.9,{g:.12,type:'sine'});},
    // 大牌型（≥17 番：清一色 / 龙七对 / 大对子…）：自摸的加强版 + 低音铺底，明显更"大"
    huBig:t=>{[0,.08,.16,.24,.32,.40,.52].forEach((d,i)=>note(t+d,[392,523,659,784,988,1175,1568][i],i===6?1.1:.22,{g:.27,type:'triangle'}));
              note(t,196,1.2,{g:.16,type:'sine'});note(t+.52,1047,1.1,{g:.13,type:'sine'});},
    // 抢杠胡：两声急促上冲（方波让"抢"的感觉更冲）
    qianggang:t=>{hit(t,1500,{dur:.08,q:6,g:.40});
                  note(t,880,.12,{g:.24,type:'square'});
                  note(t+.1,1760,.3,{g:.24,type:'triangle'});},
    // 热炮（杠上炮）/ 全烧：上行后急转直下 —— "烧掉了"
    hotcannon:t=>{note(t,1200,.18,{g:.24,type:'triangle'});
                  note(t+.16,900,.22,{g:.22,type:'triangle',to:420});
                  note(t+.36,300,.5,{g:.20,type:'sawtooth',to:120});},
    // 摇色子：骰子在碗里滚（连响）+ 一点滚动感的滑音
    dice:t=>{for(let i=0;i<7;i++)hit(t+i*.075,1600+((i*137)%700),{dur:.06,q:4,g:.30});
             note(t,300,.4,{g:.10,type:'sine',to:500});},
    // 色子落定：清脆一响
    diceStop:t=>{hit(t,1350,{dur:.12,q:5,g:.52});hit(t+.05,2300,{dur:.07,q:8,g:.26});},
    // 发牌：一次发 53 张，用一串快速摩擦声表示"唰"
    deal:t=>{for(let i=0;i<9;i++)hit(t+i*.028,2100+((i*211)%900),{dur:.045,q:5,g:.22});
             hit(t,420,{dur:.18,q:1.6,g:.24,type:'lowpass'});},
    // 结算窗弹出：轻快两音（排在胡牌长音的尾巴上，见 doHu/settle/showResult 的时序）
    settle:t=>{note(t,659,.14,{g:.18});note(t+.1,988,.34,{g:.17,type:'sine'});},
    // 捉鸡 / 翻鸡牌：两下"咯咯"感 + 高音叮
    chicken:t=>{hit(t,1900,{dur:.05,q:8,g:.30});note(t+.06,1319,.1,{g:.20});
                hit(t+.16,1900,{dur:.05,q:8,g:.26});note(t+.22,1760,.36,{g:.20,type:'sine'});},
    // 黄庄：下行两音，泄气但不刺耳
    liuju:t=>{note(t,523,.3,{g:.20,type:'sine'});note(t+.2,392,.5,{g:.18,type:'sine',to:294});}
  };
  // 限流（毫秒）：只在"同一 key 高频重复一定没意义"的地方设
  const THROTTLE={tap:55,draw:20,discard:0,deal:0,dice:0};
  const lastAt={};

  /* 播放一个音效。opt.delay = 延后多少秒起播（用于把多个音排成"先后"而不是齐响） */
  function play(name,opt){
    try{
      if(!cfg.on)return;
      const f=R[name];if(!f)return;
      const c=ensure();if(!c)return;
      const th=THROTTLE[name]||0;
      if(th){
        const now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
        if(lastAt[name]&&now-lastAt[name]<th)return;
        lastAt[name]=now;
      }
      // 还没解锁就顺手解一次；解不开也把音排上——上下文恢复后 currentTime 会跟着走，
      // 排好的音会在恢复那一刻响（第一次点击不会白点）
      if(c.state==='suspended')unlock();
      const t=c.currentTime+((opt&&opt.delay)||0)+0.005;
      f(t,opt||{});
    }catch(e){}
  }
  function applyVol(){
    try{if(master)master.gain.value=cfg.on?cfg.vol:0;}catch(e){}
  }
  function setOn(on){cfg.on=!!on;saveCfg();applyVol();if(cfg.on)unlock();return cfg.on;}
  function toggle(){return setOn(!cfg.on);}

  /* ---------- 可选：换成真实录音（不用改任何调用处）----------
     SFX.SAMPLES={discard:'sfx/discard.mp3', ...}
     探测成功则该 key 改播样本，失败保留合成音（file:// 下必然失败 → 全用合成，符合预期）。
     用 <audio> 而不是 fetch：file:// 下 fetch 被跨源拦截，<audio src> 才读得到同目录文件。 */
  const SAMPLES={};
  const samples={};
  function loadSamples(){
    try{
      Object.keys(SAMPLES).forEach(k=>{
        const a=new Audio();
        a.preload='auto';a.src=SAMPLES[k];
        a.addEventListener('canplaythrough',()=>{samples[k]=a;},{once:true});
        a.addEventListener('error',()=>{delete samples[k];},{once:true});
      });
    }catch(e){}
  }

  /* 首次手势解锁：document 级的 pointerdown/touchstart/keydown 各挂一次，
     所有监听都用 {passive:true}（不阻塞滚动），并整体 try/catch ——
     测试沙箱/老内核的桩 DOM 没有 addEventListener 时不会在加载期抛错。 */
  try{
    if(typeof document!=='undefined'&&typeof document.addEventListener==='function'){
      ['pointerdown','touchstart','keydown'].forEach(ev=>{
        try{document.addEventListener(ev,unlock,{passive:true});}catch(e){document.addEventListener(ev,unlock);}
      });
      document.addEventListener('visibilitychange',()=>{
        try{
          if(!ac)return;
          if(document.hidden){if(typeof ac.suspend==='function')ac.suspend();}
          else if(cfg.on)unlock();
        }catch(e){}
      });
    }
  }catch(e){}
  loadSamples();

  return {
    play:play,
    unlock:unlock,
    on:function(){return cfg.on;},          // 当前是否出声
    isOn:function(){return cfg.on;},
    setOn:setOn,
    toggle:toggle,
    available:!!AC,                          // 浏览器不支持 WebAudio → 调用方把开关藏掉
    names:function(){return Object.keys(R);},
    samples:SAMPLES,
    _ctx:function(){return ac;}
  };
})();

/* ===================== 本地存档：名字 + 积分记录 =====================
   存在浏览器 localStorage（键 gymj.v1）里。**名字就是记录的键**：
   换个名字 = 开一份新记录；旧名字的成绩留着，改回来还能看到。
   ✅ file:// 直接打开也能用 —— 实测 Edge/Chrome 的 file:// 来源允许 localStorage
      （cookie 在 file:// 下写不进去，所以没用 cookie）。
   ⚠️ 万一被浏览器禁掉（隐私模式 / 老内核），退化成"只在本次打开期间有效"，
      并在取名框里明确告知，不静默丢数据。 */
const STORE_KEY='gymj.v1';
const Store={
  ok:(function(){try{localStorage.setItem('__gymj_t','1');localStorage.removeItem('__gymj_t');return true;}catch(e){return false;}})(),
  data:{name:'',records:{}},
  load(){
    if(!this.ok)return;
    try{const raw=localStorage.getItem(STORE_KEY);if(raw){const d=JSON.parse(raw);if(d&&typeof d==='object')this.data=d;}}catch(e){}
    if(!this.data||typeof this.data!=='object')this.data={name:'',records:{}};
    if(typeof this.data.name!=='string')this.data.name='';
    if(!this.data.records||typeof this.data.records!=='object')this.data.records={};
  },
  save(){if(!this.ok)return;try{localStorage.setItem(STORE_KEY,JSON.stringify(this.data));}catch(e){}},
  // 取某个名字的记录；没有就按默认值新建（顺手补全缺字段，兼容旧数据）
  rec(name){
    const k=name||'玩家';
    let r=this.data.records[k];          // 记录对象（没有就新建，见下）
    const isNewRec=!(this.data.records[k]&&typeof this.data.records[k]==='object');
    if(!r||typeof r!=='object')r={};
    if(!Array.isArray(r.scores)||r.scores.length!==4||r.scores.some(v=>typeof v!=='number'))r.scores=[0,0,0,0];
    if(typeof r.hands!=='number'||r.hands<0)r.hands=0;
    // 首局由**系统随机选庄**（贵阳捉鸡规则）；之后由胡牌者接庄（结算时写回这里）。
    // ⚠️ 只有「记录是新建的」那一次才随机，否则每次读档都会把庄位打乱。
    if(isNewRec)r.dealer=Math.floor(Math.random()*4);
    else if(typeof r.dealer!=='number'||r.dealer<0||r.dealer>3)r.dealer=0;
    this.data.records[k]=r;
    return r;
  },
  clearRec(name){delete this.data.records[name||'玩家'];this.save();}
};

/* ===================== 取名 ===================== */
// 自动名字 = 两个字的词 + 两个字的尾巴，一定凑够四个字
const NAME_A=['清风','明月','青竹','山间','雨后','白鹤','松间','云中','江畔','闲云','金雀','玉竹','墨玉','晨光','夜航','小满','长乐','无忧','自在','白云','碧海','春风','秋月','冬雪','夏雨','老酒','半盏','三两','七里','九歌'];
const NAME_B=['雀神','牌仙','麻客','牌手','雀圣','将友','麻友','胡神','雀客','牌痴','摸王','叫牌','自摸','东风','发财','长胜','顺手','拈花'];
function randomName(){return NAME_A[(Math.random()*NAME_A.length)|0]+NAME_B[(Math.random()*NAME_B.length)|0];}
function updateMyName(){NAMES[0]=(Store.data.name||'你');}
let _nameFirst=false;
function openNameDlg(first){
  const d=document.getElementById('nameDlg');
  if(!d){if(first)startHand();return;}
  _nameFirst=!!first;
  const cur=Store.data.name;
  document.getElementById('nTitle').textContent=first?'先给自己取个名字':'换个名字';
  document.getElementById('nTip').innerHTML=first
    ?'积分按这个名字记在<b>本机浏览器</b>里，下次打开接着算。以后想改名，点牌桌中间你的名字。'
    :'换名字会另开一份<b>新的积分记录</b>（从 0 开始）；旧名字的成绩还留着，改回来就能看到。';
  const inp=document.getElementById('nameInput');
  inp.value=(first||!cur)?randomName():cur;
  document.getElementById('nameClear').style.display=(!first&&cur&&Store.data.records[cur])?'':'none';
  const w=document.getElementById('nWarn');
  if(!Store.ok){w.textContent='⚠️ 本机浏览器不让网页保存数据（可能是隐私模式），这个名字只在本次打开期间有效。';w.classList.add('on');}
  else{w.textContent='';w.classList.remove('on');}
  d.classList.add('on');
  // 取名层期间同样藏掉右上角的全屏按钮：它的层级比浮层高，会浮在遮罩上、
  // 并且正好压在右家名字标签的位置（和结算窗/色子层是同一个问题）
  if(document.body&&document.body.classList)document.body.classList.add('isName');
  try{inp.focus();inp.select();}catch(e){}
}
// 改名时点遮罩可以取消（首次取名不给取消 —— 必须先有个名字才能记分）
if(typeof document!=='undefined'&&document.addEventListener)
  document.addEventListener('click',e=>{
    const d=document.getElementById('nameDlg');
    if(!d||!d.classList||!d.classList.contains('on')||_nameFirst)return;
    if(e.target===d)closeNameDlg();
  });
function closeNameDlg(){
  const d=document.getElementById('nameDlg');if(d)d.classList.remove('on');
  if(document.body&&document.body.classList)document.body.classList.remove('isName');
}
function confirmName(){
  SFX.play('tap');
  const inp=document.getElementById('nameInput');
  let v=((inp&&inp.value)||'').replace(/\s+/g,'').slice(0,5);
  if(!v)v=randomName();                      // 没输就用自动生成的四个字
  const wasFirst=_nameFirst;
  applyName(v);
  if(wasFirst)startHand();                   // 首次取名 → 直接进第一局（摇色子）
}
// 应用一个名字：分数/庄位/局数都从这个名字的记录里取
function applyName(name){
  Store.data.name=name;
  const r=Store.rec(name);
  G.scores=r.scores.slice();
  G.dealer=r.dealer;
  G.nextDealer=null;              // 读档/换名字后清掉暂存的胜家：避免沿用上一局的胜家换庄
  G.handNo=r.hands||0;
  updateMyName();
  Store.save();
  closeNameDlg();
  try{render();}catch(e){}
}
function clearRecAndKeep(){
  const n=Store.data.name;
  if(n&&Store.data.records[n]){
    Store.clearRec(n);
    G.scores=[0,0,0,0];G.roundScore=[0,0,0,0];
    const r=Store.rec(n);                  // 立刻重建一份空记录
    G.dealer=r.dealer;G.nextDealer=null;G.handNo=0;
    Store.save();
    try{render();}catch(e){}
  }
  closeNameDlg();
}

/* ===================== 掷色子：定从哪开牌 =====================
   两颗色子（1~6）。点数之和 S：从庄家起按逆时针（你→下家→对家→上家）数 S 家，
   数到的那一家的牌墙开牌；再从该面墙的**右端**留「两颗色子里较小的点数」墩，
   从下一墩开始取牌（1 墩 = 2 张）。牌墙按"四面墙、每面 27 张"摆。 */
function rollDice(){
  const d1=1+((Math.random()*6)|0), d2=1+((Math.random()*6)|0);
  const sum=d1+d2;
  // 数到的那一家：从**庄家自己**开始数、庄家算第 1 家，逆时针数到 sum（0=你 1=下家 2=对家 3=上家）。
  // ⚠️ 是 sum-1，不是 sum：庄家是第 1 家不是第 0 家（原实现写错，整体差 1 家）。
  const taker=(G.dealer+sum-1+4)%4;
  const skip=Math.min(d1,d2);            // 右端留下的墩数
  const start=(taker*27+(26-skip*2))%108;
  return {d1,d2,sum,taker,skip,start};
}
// 按色子定的位置取牌：3 轮 × 每人 4 张，从庄家起逆时针；再每家 1 张。
// 庄家第 14 张由随后的 drawTile(庄家) 摸走 → 共发 53 张，余 55 张。
function dealByDice(info){
  const ordered=[];
  for(let i=0;i<108;i++)ordered.push(G.wall[(info.start+i)%108]);
  G.wall=ordered.reverse();              // 反转后 pop() 就按取牌顺序出牌
  for(let r=0;r<3;r++)for(let k=0;k<4;k++){
    const p=(G.dealer+k)%4;
    for(let j=0;j<4;j++)G.hands[p][G.wall.pop()]++;
  }
  for(let k=0;k<4;k++){const p=(G.dealer+k)%4;G.hands[p][G.wall.pop()]++;}
  SFX.play('deal');   // 发牌：一次 53 张"唰"过去
}
// 色子面：3×3 点位；中式色子 1 点和 4 点是红的
const DIE_PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieFace(n){
  const red=(n===1||n===4);
  const pips=(DIE_PIPS[n]||[4]).map(i=>{
    const cx=12+(i%3)*18, cy=12+((i/3)|0)*18;
    return `<circle cx="${cx}" cy="${cy}" r="5.4" fill="${red?'#c0392b':'#0b3d2e'}"/>`;
  }).join('');
  return `<svg viewBox="0 0 60 60" aria-hidden="true"><rect x="2" y="2" width="56" height="56" rx="13" fill="#fff" stroke="#0b3d2e" stroke-width="3"/>${pips}</svg>`;
}
function setDieFace(id,n){const el=document.getElementById(id);if(el)el.innerHTML=dieFace(n);}
let _diceTimers=[];
function diceClear(){_diceTimers.forEach(t=>{clearTimeout(t);clearInterval(t);});_diceTimers=[];}
const whoName=p=>(p===PLAYER?NAMES[0]:NAMES[p]);
function runDiceUI(info,onDone){
  const d=document.getElementById('dice');
  if(!d){onDone();return;}
  diceClear();
  let settled=false,done=false;
  const a=document.getElementById('dieA'),b=document.getElementById('dieB');
  document.getElementById('dHand').textContent='第 '+(G.handNo+1)+' 局';
  document.getElementById('dDealer').textContent='庄家：'+whoName(G.dealer);
  document.getElementById('dSum').textContent='摇色子…';
  document.getElementById('dInfo').innerHTML='';
  document.getElementById('dTip').textContent='点任意处开始摸牌';
  setDieFace('dieA',1+((Math.random()*6)|0));setDieFace('dieB',1+((Math.random()*6)|0));
  if(a)a.classList.add('rolling');if(b)b.classList.add('rolling');
  d.classList.add('on');
  SFX.play('dice');   // 骰子在碗里滚
  const spin=setInterval(()=>{setDieFace('dieA',1+((Math.random()*6)|0));setDieFace('dieB',1+((Math.random()*6)|0));},75);
  _diceTimers.push(spin);
  const finish=()=>{
    if(done)return;done=true;
    diceClear();d.classList.remove('on');
    if(a)a.classList.remove('rolling');if(b)b.classList.remove('rolling');
    onDone();
  };
  const settle=()=>{
    if(settled)return;settled=true;
    clearInterval(spin);
    setDieFace('dieA',info.d1);setDieFace('dieB',info.d2);
    SFX.play('diceStop');   // 色子落定：清脆一响
    if(a)a.classList.remove('rolling');if(b)b.classList.remove('rolling');
    document.getElementById('dSum').textContent=info.d1+' + '+info.d2+' = '+info.sum+' 点';
    document.getElementById('dInfo').innerHTML=
      `从庄家起数 <b>${info.sum}</b> 家 → <b>${whoName(info.taker)}</b>的牌墙<br>`+
      `右端留 <b>${info.skip}</b> 墩 → 从第 <b>${info.skip+1}</b> 墩开始取牌<br>`+
      `庄家 <b>${whoName(G.dealer)}</b> 先拿先出牌`;
    _diceTimers.push(setTimeout(finish,1000));   // 不点也会自己往下走，不会卡流程
  };
  _diceTimers.push(setTimeout(settle,620));      // 先摇 0.62 秒（太长会拖住每一局）
  d.onclick=()=>{settled?finish():settle();};     // 第一下跳到结果，第二下开始摸牌
}

// 清空"一局"的状态（累计分 G.scores / 庄位保留），并把桌面一起清干净。
// 摇色子阶段看到的就是这张"已洗好、还没摸牌"的空桌。
function resetHand(){
  const wall=[];for(let i=0;i<27;i++)for(let k=0;k<4;k++)wall.push(i);
  G.wall=shuffle(wall);G.hands=[emptyC(),emptyC(),emptyC(),emptyC()];
  G.melds=[[],[],[],[]];G.discards=[[],[],[],[]];
  // 弃牌区尺寸档位的"历史峰值"（只升不降，见 render 里的档位判定）
  G.discardPeak=[0,0,0,0];
  G.drawn=null;G.lastDiscard=null;G.lastDiscardBy=-1;G.lastDiscardAt=0;G.picked=null;G.pendingAction=null;G.actions=[];G.chickenCard=null;G.flipCard=null;G.huList=[];
  G.roundScore=[0,0,0,0]; // 本局清零，累计分 G.scores 保留
  G.chargeChickens=[];G.respChickens=[];G.gangFlower=false;G.fieldChicken=null;G.winTile=null;
  G.bao=[false,false,false,false];G.baoName=['','','',''];G.openFollow=null;
  G.tingFlag=false;                  // 新的一局：叫牌提示重新计数
  G.qiangGang=false;G.qiangGangPending=-1;G.hotCannon=false;G.hotCannonGang=null;
  G.revealAll=false;G.result=null;
  G.turn=G.dealer;
  // 开局标记：用于天胡（庄家首次摸牌自摸）/ 地胡（闲家首次摸牌自摸）判定
  for(let p=0;p<4;p++)G.firstDraw[p]=true;
  hideTip();
  const r=document.getElementById('result');
  if(r){r.style.display='none';if(r.classList)r.classList.remove('peekMode');}
  if(document.body&&document.body.classList)document.body.classList.remove('isResult');
  syncReopenBtn();
}
// 开一局：庄家摇色子定"从哪开牌" → 按这个位置发牌 → 庄家先拿先出牌。
// 庄家由上一局胜家接任（见 endHandBookkeeping）；第一局默认你坐庄，连庄则你继续。
function startHand(){
  // 电脑牌风：每局重新掷一次 —— 约 30% 做"大牌型"（七对/清一色/大对子），其余 70% 优先叫牌。
  // 玩家自己那一位固定 false：出牌建议走"效率优先"，不然建议会变得难以预料。
  G.aiBig=[0,1,2,3].map(p=>p!==PLAYER&&Math.random()<0.3);
  // 上一局结算时暂存的"胜家坐庄"**在开局这一刻才生效**：这样结算界面上的庄标记
  // 始终对应本局（详见 endHandBookkeeping 的注释）。黄庄（nextDealer 没设）则连庄。
  if(typeof G.nextDealer==='number'&&G.nextDealer>=0&&G.nextDealer<4)G.dealer=G.nextDealer;
  G.nextDealer=null;
  diceClear();
  resetHand();
  G.phase='dice';                  // 色子阶段：不吃点击、也不排 AI 定时器
  // 🔴 必须在这里再同步一次按钮：resetHand() 里那次调用时 G.phase 还是上一局的 'over'，
  //    于是「本局详情 / 再来一局」又被显示出来，之后没人收 —— 表现就是
  //    "点了再来一局、新局开了，桌面上还挂着那两个按钮"（用户实测反馈）。
  syncReopenBtn();
  if(document.body&&document.body.classList)document.body.classList.add('isDice');
  render();
  log(whoName(G.dealer)+'坐庄，摇色子…');
  const info=rollDice();
  runDiceUI(info,()=>{
    if(document.body&&document.body.classList)document.body.classList.remove('isDice');
    dealByDice(info);
    G.turn=G.dealer;
    G.phase='discard';
    render();
    drawTile(G.dealer);            // 庄家先拿先出牌
  });
}
// 一局结束后的记账：胜家坐庄 + 写本地记录（黄庄则连庄）
function endHandBookkeeping(winner){
  // ⚠️ **不要在这里就把 G.dealer 改成胜家**：结算窗和积分板上还显示着**本局**的结果，
  //    庄标记一改就变成"下一局的庄"，看起来就是"庄和本局数据对不上"（用户反馈）。
  //    改成先暂存到 G.nextDealer，等下一局开局（startHand）再真正换庄 ——
  //    这样结算界面的「庄」永远对应本局，色子层的「第 N 局 / 庄家」也始终自洽。
  // ⚠️ 定庄规则有多种（一炮双响/多响的庄位不同），settle 里已先算好写进 G.nextDealer；
  //    这里只在"还没定"时兜底，否则会把双响算出来的庄覆盖成单个胡牌者。
  if(!(typeof G.nextDealer==='number'&&G.nextDealer>=0&&G.nextDealer<4)){
    if(winner>=0&&winner<4)G.nextDealer=winner;
  }
  const r=Store.rec(Store.data.name);
  r.hands=(r.hands||0)+1;
  r.dealer=(typeof G.nextDealer==='number')?G.nextDealer:G.dealer;   // 存档里记的是"下一局的庄"
  r.scores=G.scores.slice();
  r.updated=Date.now();
  Store.save();
  G.handNo=r.hands;
}
function newGame(){startHand();}   // 结算窗「再来一局」等旧调用点
function drawTile(p){
  if(G.wall.length===0){endGame();return;}
  const t=G.wall.pop();G.hands[p][t]++;
  SFX.play('draw');   // 摸牌：四家都响（很轻，只提示"牌墙又少一张"）
  // 杠上花：杠完之后补摸的这一张牌若成胡，额外 +1 番
  // 同一个标记也用于「热炮」判定：这一张若打出去点炮，即为杠上炮
  if(p===PLAYER){
    G.drawn=t;G.phase='discard';render();
    // 报听：不能换牌 —— 摸到什么都必须打掉（只有能自摸时才停下来让玩家点「胡」）。
    // 因为碰/杠已被禁（见 canMelded），手牌形状始终不变 → 叫牌型不会被换掉。
    if(G.bao[PLAYER]){
      if(canHu(G.hands[PLAYER],G.melds[PLAYER],{zimo:true})){
        log(`${G.baoName[PLAYER]}中：摸到 ${cname(t)}，可以自摸胡！`);
        SFX.play('huReady');render();return;
      }
      log(`${G.baoName[PLAYER]}中：摸到 ${cname(t)}，按规则必须打出`);
      render();setTimeout(()=>discard(PLAYER,t),260);
      return;
    }
    // 摸到第4张（暗杠）或补杠牌时，自动弹出杠按钮，无需玩家自己发现
    if(autoGangHint()){SFX.play('alert');return;}   // 可自摸/可暗杠/可补杠 → 三连叮（比"轮到你"更该被听见）
    const sg=suggestCard(PLAYER);
    log('轮到你了'+(sg!==null?' · 建议打 '+cname(sg):'，请出牌'));
    SFX.play('prompt');   // 轮到你了：最轻的两音（每回合都响，不能吵）
  }
  else{render();setTimeout(()=>aiTurn(p),650);}
}
// 出牌后检查各家是否有「碰 / 明杠」的机会。
// 关键修复：杠的判定必须在碰之前，且碰、杠都要检查（原来杠被碰挡掉、碰后不再提示自身回合的杠）
function bestClaim(p,card){
  if(G.hands[p][card]>=3)return 'gang';
  if(G.hands[p][card]>=2)return 'peng';
  return null;
}
function aiTurn(p){
  if(G.phase==='over')return;
  // 自摸不加限制（豆豆通行证只管点炮），但天胡/地胡需在首次摸牌时判定
  if(canHu(G.hands[p],G.melds[p],{zimo:true})){doHu(p,-1,true);return;}
  // ---- 该杠就杠 ----
  // 🔴 电脑原来**完全不会暗杠/补杠**（doAnGang/doBuGang 只有玩家按钮会调），
  //    只能等别人打出第 4 张时明杠 —— 所以几乎看不到电脑杠牌（用户反馈）。
  if(aiWantGang(p))return;              // 杠完会由 doXxxGang 自己安排补摸
  discard(p,aiDiscardSmart(p));
}
/* 电脑自己回合的杠：先看补杠（爬坡豆），再看暗杠（闷豆）。每个豆都是 3 个，
   两个原则：
   ① **不能把牌型搞坏**：暗杠会让手牌少 1 张，用"碰之后"的向听数不比原来差来把关
      （⚠️ 算"杠之后"要记得把杠出来那副面子算进去，别只减手牌 —— 见 shouldPeng 的教训）；
   ② **七对路线不杠**（四张算两对，杠了就散了）；牌墙只剩最后几张也不补杠 ——
      黄庄本来就不计豆（规则如此），还白送对手一个抢杠的机会。 */
function aiWantGang(p){
  const hand=G.hands[p], melds=G.melds[p]||[];
  if(melds.length>=4)return false;                       // 没副露位置了
  if(melds.length===0){
    let pairs=0;for(let i=0;i<27;i++)if(hand[i]>=2)pairs++;
    if(pairs>=5&&(G.aiBig?G.aiBig[p]:false))return false;    // 只有"做大牌风"才保七对
  }
  // ① 补杠：已碰过某张、又摸到第 4 张（只消耗 1 张手牌，最划算）
  if(G.wall.length>4){
    for(const m of melds){
      if(m.type==='peng'&&hand[m.card]>=1&&canMelded(p,'bugang')){doBuGang(p,m.card);return true;}
    }
  }
  // ② 暗杠：手里正好 4 张
  const before=shanten(hand,melds.length);
  for(let c=0;c<27;c++){
    if(hand[c]>=4&&canMelded(p,'angang')){
      const h2=hand.slice();h2[c]-=4;                     // 暗牌 -4（杠出去那 4 张）；多出的面子由 melds.length+1 表示
      const after=shanten(h2,melds.length+1);
      if(after<=before){doAnGang(p,c);return true;}
    }
  }
  return false;
}
function discard(p,card){
  G.hands[p][card]--;G.discards[p].push(card);
  SFX.play('discard');   // 出牌：牌拍在桌面上的那一声（四家出牌都响 —— 真人坐一桌也听得见）
  VOICE.tile(card);       // 语音播报这张牌（方案 A：系统语音；与音效开关各自独立）
  // 冲锋鸡③：**每个牌种各一只** —— 本局第一张被打出的 幺鸡(1条)、第一张被打出的 乌骨鸡(8筒)
  //   （用户 2026-09-16："冲1条和冲8筒应该都算两个；如果两个在一家，就有4个"）。
  //   持有者默认 = 打出者；若这张牌被**叫牌家**碰/杠走 → 责任转移（在碰/杠处改 p，结算时再验他是否叫牌）。
  if(isChargeTile(card)&&!G.chargeChickens.some(c=>c.card===card))G.chargeChickens.push({p:p,card:card});
  // 热炮（杠上炮）标记：本张牌若是「杠后补摸的第一张」打出的，点炮即算热炮。
  // gangFlower 在 drawTile 前后由杠流程置位，这里消费掉它并转成热炮标记。
  G.hotCannon=!!G.gangFlower;
  G.gangFlower=false;
  G.lastDiscard=card;G.lastDiscardBy=p;
  G.picked=null;                     // 打出去了，预选态清掉
  G.lastDiscardAt=Date.now();        // 供 render 判定"是否刚打出"（黄框跳动窗口）
  // 开局跟（表外补充 4 点）：庄家本局**第一张**打出的牌，其余三家各自的**第一张**弃牌都跟打同一张。
  // 用 G.firstDraw[p] 判定"这是他的第一张弃牌"——该标记只在出牌时置 false，位置就在下面几行。
  if(!G.openFollow)G.openFollow={card:null,hits:0,seen:0,done:false,ok:false};
  {
    const of=G.openFollow;
    if(!of.done&&G.firstDraw[p]){
      of.seen++;
      if(p===G.dealer)of.card=card;
      else if(of.card!==null&&card===of.card)of.hits++;
      if(of.seen>=4){of.done=true;of.ok=(of.hits===3);}
    }
  }
  G.firstDraw[p]=false;
  if(p===PLAYER)G.drawn=null;
  hideTip();          // 打出去了，手牌上方的"建议打 X"提示跟着收掉
  render();checkClaims(p,card);
  // 叫牌提示：玩家自己打出这张之后成叫牌（上一张还没叫牌）→ 一声金铃 + 日志高亮。
  // G.tingFlag 只在"刚刚叫牌"那一次翻转，所以不会每次出牌都响；被碰掉牌型后再叫牌会再响一次。
  if(p===PLAYER){
    const _ting=isTing(PLAYER);
    if(_ting&&!G.tingFlag){
      SFX.play('ting');
      showTip('你已经叫牌了（叫牌）· 黄庄时未叫牌的人要赔你分值',2600);
    }
    G.tingFlag=_ting;
  }
}
// 出牌后检查各家能否「胡 / 碰 / 明杠」。
// 关键修复：先判杠再判碰（原来先判碰，导致手里已有3张也弹「碰」）；
// 每种动作都优先看玩家，玩家有选择时立即中止 AI 流程等玩家决定。
// 副露上限与「手牌不打空」的联合约束。
// 关键：不同的副露方式对手牌/实物的消耗并不一样——
//   碰：  手牌 -2，副露实物 +3（多出的 1 张来自别人打出的牌）
//   明杠：手牌 -3，副露实物 +4（同样多 1 张来自别人）
//   暗杠：手牌 -4，副露实物 +4
//   补杠：手牌 -1，副露实物 +1（把身上的 1 张补到已碰的那副上）
// 因此必须直接模拟「动作之后」的牌数，而不是拿一个 consume 去减，
// 否则会出现 手1+副14=15 这种非法牌型。
// 约束有两条：
//   ① 副露最多 4 副，且总实物张数 ≤ 14（4 副面子 + 1 对将 = 14 张）
//   ② 副露后手牌必须仍能留下 ≥1 张可打的牌
function canMelded(p,type){
  // 报听：手牌已经固定（"不能换牌"），所以碰、杠一律不给做（规则明说"也不能杠牌"）。
  // 放在最前面：这样 UI 按钮、AI 判定、结算前的合法性检查全都会跟着关掉。
  if(G.bao&&G.bao[p])return false;
  if(G.melds[p].length>=4)return false;                 // 已有 4 副，不能再副露
  const hand=G.hands[p].reduce((a,b)=>a+b,0);           // 当前手牌张数
  const phys=G.melds[p].reduce((a,m)=>a+(m.type==='gang'?4:3),0); // 当前副露实物张数
  let dh=0,dp=0;                                        // 手牌变化、副露实物变化
  if(type==='peng'){dh=-2;dp=3;}                        // 碰
  else if(type==='gang'){dh=-3;dp=4;}                   // 明杠
  else if(type==='angang'){dh=-4;dp=4;}                 // 暗杠
  else if(type==='bugang'){dh=-1;dp=1;}                 // 补杠
  const nh=hand+dh, np=phys+dp;
  if(nh<1)return false;                                 // 手牌会被打空
  // ⚠️ 上限要按「刚摸完牌、还没出牌」的时刻判：那一刻手牌是 14 张（面+副露总量 15 实属正常）。
  //    早期版本硬卡 14，导致「碰完再摸到第 4 张」时补杠被误拒 —— 明明是该杠的牌却杠不了。
  //    杠完副露变 4 张、手牌少 1，总量正好回落到 14，牌型合法。
  const cap=(G.phase==='discard'&&G.turn===p&&G.drawn!==null)?15:14;
  if(nh+np>cap)return false;                            // 总实物超过上限（非法牌型）
  return true;
}
/* 别人打出一张牌后按座次决定谁能要 —— 轮到你时把**所有**能做的动作一起弹出来。
   原来是「胡 → 杠 → 碰」三个分支各 return，同时可选时只弹一个
   （用户反馈："有胡牌、补杠等同时可选时应该弹出所有选项"）。
   ⚠️ AI 行为**不变**：仍按座次取第一个能胡的、再第一个能杠的、再第一个能碰的。 */
function checkClaims(from,card){
  const order=[];for(let k=1;k<4;k++)order.push((from+k)%4);
  // 1) 胡（点炮）：平胡必须有豆；大对子等平胡以上牌型无豆也可胡。
  //    ⚠️ 一炮双响/多响：**一张牌可能被多家同时胡** —— 这里收集**全部**能胡的家，
  //       不能像以前那样"取到第一个就 break"。
  const huList=[];
  for(const p of order){
    G.hands[p][card]++;
    const ok=canHu(G.hands[p],G.melds[p],{zimo:false,force:!!(G.bao&&G.bao[from])});   // 打分者的牌若是"报听者"打出的 → 无豆也能平胡
    G.hands[p][card]--;
    if(ok)huList.push(p);
  }
  G.huList=huList.slice();
  if(huList.length){
    G.winTile=card;
    if(huList.includes(PLAYER)){
      // 我能胡 → 把"杠/碰"也一起收集（能杠能碰时全列出来，由玩家自己挑）
      const list=[{type:'hu',card:card,from:from}];
      if(canMelded(PLAYER,'gang')&&G.hands[PLAYER][card]>=3)list.push({type:'gang',card:card,from:from});
      if(canMelded(PLAYER,'peng')&&G.hands[PLAYER][card]>=2)list.push({type:'peng',card:card,from:from});
      setActions(list);render();return;
    }
    doHuMulti(huList,from,false);return;
  }
  // 2) 明杠 / 3) 碰：AI 先处理；轮到玩家则统一在下面收集
  for(const p of order){
    if(canMelded(p,'gang')&&G.hands[p][card]>=3){
      if(p===PLAYER)break;
      doGang(p,card,from);return;
    }
  }
  for(const p of order){
    if(canMelded(p,'peng')&&G.hands[p][card]>=2){
      if(p===PLAYER)break;
      if(shouldPeng(p,card)){doPeng(p,card,from);return;}
    }
  }
  {
    const list=[];
    if(canMelded(PLAYER,'gang')&&G.hands[PLAYER][card]>=3)list.push({type:'gang',card:card,from:from});
    if(canMelded(PLAYER,'peng')&&G.hands[PLAYER][card]>=2)list.push({type:'peng',card:card,from:from});
    if(list.length){setActions(list);render();return;}
  }
  nextTurn(from);
}
/* 玩家点「过」：自己不做动作。
   ⚠️ 一炮多响的关键 —— 我过牌不代表别家也过：**别家能胡这张牌的照样胡**，
   所以这里先看 G.huList 里除我之外还有谁会胡，有就让那几家胡掉。
   本函数必须挂在**顶层**（曾经被误插进 render() 里 → 成了嵌套函数，页面按钮能用、
   但测试和别处都调不到，排查起来很绕）。 */
function passClaim(){
  const acts=(G.actions&&G.actions.length)?G.actions.slice():(G.pendingAction?[G.pendingAction]:[]);
  const isClaim=acts.some(a=>a.type==='peng'||a.type==='gang'||a.type==='hu');
  const f=G.lastDiscardBy;
  const others=(G.huList||[]).filter(q=>q!==PLAYER);   // 我过牌，但别家还能胡这张（一炮多响）
  G.huList=[];clearActions();
  if(isClaim&&f>=0){
    if(others.length){doHuMulti(others,f,false);return;}
    nextTurn(f);return;
  }
  render();
}

/* 设置/清空待决动作：pendingAction 始终 = 列表第一项（兼容"有没有待决动作"的判断） */
function setActions(list){
  G.actions=(list||[]).filter(Boolean);
  G.pendingAction=G.actions[0]||null;
  // 有可做动作时给一声提示：能胡用最亮的五音琶音，可碰/可杠用三连叮。
  // 放在这里而不是两个调用点，是为了以后再加"可选动作"入口时不会漏掉音效。
  if(G.actions.length)SFX.play(G.actions.some(a=>a.type==='hu')?'huReady':'alert');
}
function clearActions(){G.pendingAction=null;G.actions=[];}
function nextTurn(from){
  // 保留 lastDiscard：最新的弃牌高亮持续到下一张牌被打出为止（贴近真牌桌观感）
  const p=(from+1)%4;G.turn=p;G.pendingAction=null;G.actions=[];G.drawn=null;
  render();setTimeout(()=>drawTile(p),300);
}
// 轮到自己时，手里有 4 张可暗杠、或摸到第 4 张可补杠，自动转成待办动作提示
/* 轮到自己、刚摸完牌时的提示。
   ⚠️ 这里**只写日志、不设 pendingAction**：操作条的"非待决"分支本来就会把
      「自摸 / 暗杠 / 补杠」**一起**列出来；原来把它设成单一 pendingAction，
      反而把「自摸胡」按钮挤掉了（本该"能胡又能补杠"却只弹补杠）—— 用户实测反馈。
   返回 true = 有可做的动作（调用方就不再写"轮到你了，请出牌"）。 */
/* ===== 报听 / 天听 =====
   窗口：本局该玩家**第一次摸完牌、还没出过牌**的那一刻（14 张）。
   条件：存在一张牌，打掉它之后手牌成"叫牌"（即"打一张就叫牌"）。
   之后（doBaoTing 置位 G.bao[p]）由三处保证规则：
     ① canMelded 直接返回 false → 不能碰、不能杠；
     ② drawTile 里"摸什么打什么"→ 手牌形状固定不变，叫牌型不会被换掉；
     ③ 结算时按 报听 17 / 天听 34 计（取最高）。
   本局第一次摸牌 → 闲家记「天听」34，庄家记「报听」17（用户表注明"庄家不可天听"）。 */
function canBaoTing(p){
  if(G.bao[p])return false;
  if(!G.firstDraw[p])return false;                 // 已打过牌 → 过了窗口（firstDraw 只在出牌时置 false）
  if(G.phase!=='discard'||G.turn!==p||G.drawn===null)return false;
  if(G.pendingAction)return false;
  const n=G.hands[p].reduce((a,b)=>a+b,0);
  if(n%3!==2)return false;                         // 必须是"刚摸完（3n+2）"的形态
  for(let c=0;c<27;c++){
    if(!G.hands[p][c])continue;
    G.hands[p][c]--;
    const ok=isTing(p);
    G.hands[p][c]++;
    if(ok)return true;                             // 打掉这张就叫牌
  }
  return false;
}
function baoFanOf(p){return (p===G.dealer)?BAOTING_FAN:TIANTING_FAN;}
function doBaoTing(p){
  if(!canBaoTing(p))return;
  G.bao[p]=true;
  G.baoName[p]=(p===G.dealer)?'报听':'天听';
  log(`${NAMES[p]}${G.baoName[p]}！之后摸什么打什么、不能换牌（${baoFanOf(p)} 分）`);
  SFX.play('huReady');
  render();
}
function autoGangHint(){
  if(G.phase!=='discard'||G.turn!==PLAYER||G.pendingAction||G.drawn===null)return false;
  const c=G.drawn;
  const tips=[];
  if(canHu(G.hands[PLAYER],G.melds[PLAYER],{zimo:true}))tips.push('可自摸胡');
  if(G.hands[PLAYER][c]>=4&&canMelded(PLAYER,'angang'))tips.push('可暗杠 '+cname(c));
  const penged=G.melds[PLAYER].find(m=>m.type==='peng'&&m.card===c);
  if(penged&&canMelded(PLAYER,'bugang'))tips.push('可补杠 '+cname(c)+'（三家各 3 分）');
  if(!tips.length)return false;
  log('轮到你了：'+tips.join(' / ')+' · 也可以直接出牌');
  return true;
}
// 补杠（爬坡豆）：碰过又摸到第 4 张。结算与闷豆同为 3 个（方向看叫牌，见 douSettle）
// ⚠️ 抢杠胡：补杠的那张牌是「实际打出去的一张牌」，
//    若正好是别人叫的那张，他可以抢胡 —— 由补杠者一家包赔（4 倍）。
//    这是搜狗百科「贵州麻将」词条列明的条款，也让补杠不再是稳赚不赔。
function doBuGang(p,card){
  G.hands[p][card]-=1;
  const i=G.melds[p].findIndex(m=>m.type==='peng'&&m.card===card);
  if(i>=0)G.melds[p][i]={type:'gang',card,from:G.melds[p][i].from,paPo:true};
  SFX.play('bugang');   // 补杠（爬坡豆）：中音双响，"再接一张上来"
  // 记录本次刚成的豆，供热炮时「杠前成的豆不算」撤销使用
  G.hotCannonGang={p:p,card:card,paPo:true,from:i>=0?G.melds[p][i].from:-1};
  log(`${NAMES[p]}补杠了 ${cname(card)}（爬坡豆）`);render();
  // 抢杠检查：在真正摸牌之前，看其他三家谁能胡这张牌
  if(checkQiangGang(p,card))return;
  G.turn=p;G.pendingAction=null;G.actions=[];G.drawn=null;G.gangFlower=true;setTimeout(()=>drawTile(p),550);
}
// 抢杠胡检查：返回 true 表示有人抢胡（牌局就此结束，不再补摸）
// ⚠️ 抢杠不受豆豆通行证限制：
//   补杠的那张牌等于「别人送上门的一张牌」，与自摸性质相同（都不是你主动点炮），
//   搜狗百科词条也只对「点炮」设 ≥5 番门槛（热炮条款原文：
//   「如果叫牌者是无豆的平胡依然可以胡」）。故这里传 {zimo:true} 绕过番数门槛。
function checkQiangGang(gangP,card){
  const order=[];for(let k=1;k<4;k++)order.push((gangP+k)%4);
  for(const p of order){
    G.hands[p][card]++;
    const ok=canHu(G.hands[p],G.melds[p],{zimo:true});   // 绕过豆豆通行证
    G.hands[p][card]--;
    if(ok){
      G.winTile=card;
      // 玩家抢杠：不替他做主，挂起等他点「胡」或「过」——
      // 抢杠胡是收益最高的胡法，错过就没了，必须让玩家自己决定
      if(p===PLAYER){
        G.pendingAction={type:'hu',card,from:gangP,byQiangGang:true};
        G.qiangGangPending=gangP;
        log(`可以抢杠胡 ${cname(card)}！`);
        SFX.play('huReady');   // 你能抢杠胡：全套里最亮的五音琶音
        render();return true;
      }
      G.qiangGang=true;          // 标记本局为抢杠胡：结算时包赔
      log(`${NAMES[p]}抢杠胡了 ${cname(card)}！`);
      SFX.play('qianggang');
      doHu(p,gangP,false);       // 由补杠者一家包赔（from=补杠者）
      return true;
    }
  }
  return false;
}
// 玩家选择「过」不抢杠：恢复补杠流程，让补杠者继续摸牌
function passQiangGang(){
  const gangP=G.qiangGangPending;
  G.qiangGangPending=null;G.pendingAction=null;G.actions=[];G.winTile=null;
  if(gangP===null||gangP===undefined||G.phase==='over'){render();return;}
  G.turn=gangP;G.drawn=null;G.gangFlower=true;
  log('不抢杠胡');
  render();setTimeout(()=>drawTile(gangP),550);
}
// 兼容旧调用名：默认按「3 张面子」的口径判定
function canAffordMeld(p,consume){return canMelded(p,consume===2?'peng':consume===4?'angang':'gang');}
function doPeng(p,card,from){
  G.hands[p][card]-=2;G.melds[p].push({type:'peng',card,from});G.discards[from].pop();
  SFX.play('peng');   // 碰：三声"嗒嗒嗒" = 三张牌码齐
  // 责任鸡④：**只认幺鸡(1条)**（用户 2026-09-15：乌骨鸡参与冲锋鸡、不参与责任鸡；见 isRespTile）
  //   被打出后被**碰走** → 那副露按 3 张算，打出这张牌的人从此多付 1 分。
  // ⚠️ 这里只**记录**、不当场判分：① "碰走者要叫牌" 是结算时才定的（他可能此刻还没叫牌、后来才叫牌）；
  //    ② "打出者是否未叫" 同理。两个前提都在 chickenSettle ⑤ 里判。
  if(isRespTile(card))G.respChickens.push({from:from,by:p,card:card,how:'碰'});
  // 冲锋鸡③：被碰走 → **责任转移**（持有者候选换成碰走者；结算时若他没叫牌则退回原打出者）
  //   按**牌种**找那一只（一局最多两只：幺鸡一只、乌骨鸡一只，见 G.chargeChickens）
  const ccPeng=G.chargeChickens.find(c=>c.card===card&&c.p===from);
  if(ccPeng){
    ccPeng.p=p;ccPeng.via='碰';ccPeng.from=from;
    log('冲锋鸡（'+cname(card)+'）被 '+NAMES[p]+' 碰走 → 责任转移到 '+NAMES[p]);
  }
  // 该牌已被碰走，取消最新弃牌高亮
  G.lastDiscard=null;G.lastDiscardBy=-1;
  G.turn=p;G.pendingAction=null;G.actions=[];G.drawn=null;
  if(p===PLAYER){
    G.phase='discard';
    // 碰完只剩 11 张、又**没有"刚摸到的那张"**可参考，玩家最容易在这里卡住不知道该打哪张。
    // 直接算一张建议出来（render 里会给它画绿色虚线框 + 手牌上方浮一条提示）。
    const sg=suggestCard(PLAYER);
    log('碰了 '+cname(card)+'，该你出牌'+(sg!==null?' · 建议打 '+cname(sg):''));
  }else{
    log(`${NAMES[p]}碰了 ${cname(card)}`);
  }
  render();
  if(p!==PLAYER)setTimeout(()=>discard(p,aiDiscardSmart(p)),650);
}
// 明杠统一走这里：被杠走的牌从该家弃牌区移除
// 杠后要补摸一张，若补摸牌成胡即为「杠上花」（+1 番）
function doGang(p,card,from){
  G.hands[p][card]-=3;G.melds[p].push({type:'gang',card,from});
  SFX.play('gang');   // 明杠：四声、更矮更重
  G.hotCannonGang={p:p,card:card,paPo:false,from:from};
  // 责任鸡④ / 冲锋鸡③：明杠把牌拿走，与碰同理（口径见 doPeng）
  if(isRespTile(card))G.respChickens.push({from:from,by:p,card:card,how:'杠'});
  const ccGang=G.chargeChickens.find(c=>c.card===card&&c.p===from);
  if(ccGang){
    ccGang.p=p;ccGang.via='杠';ccGang.from=from;
    log('冲锋鸡（'+cname(card)+'）被 '+NAMES[p]+' 杠走 → 责任转移到 '+NAMES[p]);
  }
  if(from>=0){G.discards[from].pop();G.lastDiscard=null;G.lastDiscardBy=-1;}
  log(`${NAMES[p]}杠了 ${cname(card)}`);render();
  G.turn=p;G.pendingAction=null;G.actions=[];G.drawn=null;G.gangFlower=true;setTimeout(()=>drawTile(p),550);
}
// 暗杠（手里4张）：不扣牌墙外的手牌张数逻辑与其他杠一致
function doAnGang(p,card){
  G.hands[p][card]-=4;G.melds[p].push({type:'gang',card,from:-1});
  SFX.play('angang');   // 暗杠：闷响（牌扣着敲桌）
  G.hotCannonGang={p:p,card:card,paPo:false,from:-1};
  log(`${NAMES[p]}暗杠了 ${cname(card)}`);render();
  G.turn=p;G.pendingAction=null;G.actions=[];G.drawn=null;G.gangFlower=true;setTimeout(()=>drawTile(p),550);
}
function doHu(p,from,zimo){return doHuMulti([p],from,zimo);}   // 单家胡（旧调用点全部兼容）
/* 多家同时胡（一炮双响 / 一炮多响）：list = 同时胡的座位号数组。
   点炮那张牌要**补进每一家**的手牌去算各自的牌型（算完还原）；豆 / 鸡 / 开局跟只结算一次
   —— 否则一炮双响会把豆和鸡算两遍。 */
function doHuMulti(list,from,zimo){
  const winners=(list||[]).filter(q=>typeof q==='number'&&q>=0&&q<4);
  if(!winners.length)return;
  // 点炮时那张牌是「别人打出的」，从未进入手牌。
  // 结算必须把它算作成牌，否则手牌永远只有 13 张，
  // huPattern 判定失败 → 静默退化成「平胡 1 番」（七对/大对子/清一色全被算错）。
  // 这里临时把牌补进**每一家**手牌，结算完再还原，保证 G 状态不被污染。
  let added=false;
  if(!zimo&&from>=0&&typeof G.winTile==='number'){
    winners.forEach(w=>{G.hands[w][G.winTile]++;});added=true;
  }
  // 玩家「抢杠胡」是挂起后由点击触发的，checkQiangGang 当时只挂起、没置标记，
  // 这里按待决动作补上，否则会按普通点炮结算（少 ×4）。
  if(!zimo&&G.pendingAction&&G.pendingAction.byQiangGang)G.qiangGang=true;
  G.qiangGangPending=-1;
  G.phase='over';
  // 热炮（杠上炮）：刚杠完补摸的第一张牌打出去就点炮 → 番数翻倍，
  // 且点炮者「杠前成的那个豆不算」（不给他记这杠的收益）。
  // ⚠️ 必须先取：settle() 的入参读的就是 G.hotCannon，紧随其后它就被清成 false 了。
  const _hot=G.hotCannon===true;
  const res=settle(winners,from,zimo,_hot);
  G.hotCannon=false;
  if(added)winners.forEach(w=>{G.hands[w][G.winTile]--;});   // 还原，避免影响下一局的牌数统计
  G.huList=[];
  render();showResult(res);
  // 胡牌音：自摸 > 点炮；牌型 ≥17 番（清一色/龙七对/大对子…）换成更长的"大牌"版。
  // 三个音的**时序**是刻意排开的：胡牌音 0s → 翻鸡音 0.75s（见 settle）→ 结算窗音 1.1s
  // （见 showResult）。同时响会糊成一团噪音，错开才听得清"胡了 → 翻鸡 → 结算"这三步。
  const _big=!!(res.pat&&res.pat.fan>=17);
  SFX.play(zimo?(_big?'huBig':'zimo'):(_big?'huBig':'hu'));
  if(_hot)SFX.play('hotcannon',{delay:0.55});   // 热炮（杠上炮）：再叠一段"烧掉"的下行音
  if(winners.length>1)log(`一炮${winners.length===2?'双响':'多响'}：${winners.map(w=>NAMES[w]).join('、')} 同时胡`);
}

// ===== 鸡牌：身份 / 归属 / 结算（贵阳捉鸡）=====
/* 本节是鸡分的**唯一权威实现**：改规则只改这里，界面、日志、测试都跟着它走。
   与规则条目一一对应，注释里标了 ①~⑤（对应需求里的五条）。

   ## 一、算鸡的牌只有两种（用户 2026-09-16 定稿）
     · **幺鸡(1条)**   —— 1 分/张
     · **乌骨鸡(8筒)** —— 1 分/张
     其他牌一律不是鸡：翻牌**不会**把别的牌变成鸡。

   ## 二、翻牌决定"金"（不新增鸡的种类）
   · **翻牌** = 牌墙里第 1 张未摸的牌（G.wall 栈顶）。**有玩家胡牌且牌墙未空**时才翻。
   · **翻牌定出"本局的鸡"** = 翻到的牌的**下一张**（点数 +1；9 之后回到 1）—— 例：翻 **4万** → **鸡是 5万**。
       代码里 G.chickenCard 存的就是这张"下一张"（`settle()` 里 `s*9+((t%9+1)%9)`）；
       翻到的牌本身存在 G.flipCard。
   · **本局的鸡**正好是上面两种之一 → 该牌种本局 **2 分/张**（叫"金"）：
       翻到 **9条** → 金幺鸡（幺鸡 2 分/张）；翻到 **7筒** → 金乌骨鸡（8筒 2 分/张）。
   · 翻到别的牌（例：翻 4万 → 鸡是 5万）→ 本局**没有金鸡**，幺鸡 / 8筒 各 1 分/张。
   · "叫牌的手上有鸡牌的都得，有几个得几个" = 叫牌家的 幺鸡/8筒 **有几张算几张**（见 §三）。

   ## 三、计数口径（按**牌种**记，不按"在手/打出"记）
   · **鸡 = 幺鸡(1条) / 乌骨鸡(8筒)** —— 只有这两类牌算分。
   · **叫牌家**：手牌 + 副露 + 自己牌河，**全算**（都是他自己的鸡，"有几个得几个"）。
   · **未叫家**：**不能收** —— 手里的、牌河里的都不给他算分（明细里显示 0 分）；
        但**打出的** 幺鸡/8筒 会**转给每个叫牌家**（§四的"包鸡"）。

   ## 四、收付方向（用户 2026-09-16 定稿；**旧口径作废**）
   · **每个叫牌家按自己的鸡数，向其他三家各收一份**（叫牌家、未叫家**都要付**）。
   · **未叫家只付不收**（他的鸡不算分）。
   · **包鸡**：未叫家**打出的** 幺鸡/8筒 归**每个叫牌家**各一份（留着的仍不算）；**第一张打出的那张 = 冲锋鸡 → 算 2 份**（那张牌只按冲锋鸡算，不再重复算 1 份常鸡）。
   · 热炮（杠上炮）：点炮者的鸡**全烧**（不收、也不当包鸡赔），但**该他付的照付**。
   · 用户给的算例（叫牌家 0 / 3 / 4 只，未叫家 1 只留着的）：
        0 只的收 0 付 7 → −7；未叫家收 0 付 7 → −7；3 只的收 9 付 4 → +5；4 只的收 12 付 3 → +9（合计 0）。
   · 无人叫牌 → 鸡分不计；叫牌家都没有鸡、也没有包鸡 → 无有效鸡分。
   · 旧口径（已作废）：只在"叫牌 ↔ 未叫"之间结算、叫牌家之间"互不赔"。
     **四家都叫牌时现在照样互收互付**（各自鸡数不同就有净额）。

   ## 五、冲锋鸡（③）/ 责任鸡（④）—— 独立收付，不走上面这套
   · 冲锋鸡 = **每个牌种一只**：本局**第一张**被打出的 幺鸡、以及**第一张**被打出的 乌骨鸡
     （用户 2026-09-16："冲1条和冲8筒应该都算两个；如果两个在一家，就有4个"）。
     分值 2（= 那张牌**算两个**；常规统计里已把它扣掉，不重复算 1 份）；
     该**牌种**本局是金鸡 → 4；同一家持两只 → 相加。
     **责任转移**：这只牌被**叫牌家**碰/杠走 → 持有者换成碰走者（前提是"碰走者叫牌或胡牌"，
     在结算时判定）；碰走者未叫 → 不转移，仍归原打出者。
     收付：持有者叫牌 → **其他三家各付**（含胡牌家 —— 胡了牌也照样付）；
           持有者未叫 → 他给**每个**叫牌/胡牌玩家各付。
   · 责任鸡 = 打出的**幺鸡**被**叫牌家碰/杠走** → 那副露按碰 3 / 杠 4 张计入碰走者的鸡分
     （他随后按自己的鸡数向三家各收），打出这张牌的人**多付 1 分**。
     前提：碰走者必须叫牌（否则那副露的鸡不算）；打出者必须未叫（包鸡只算未叫家打出的鸡）。
   ⚠️ 牌种口径（用户 2026-09-15 明确）：**乌骨鸡参与冲锋鸡、不参与责任鸡**。
      即：第一张打出的乌骨鸡可以是冲锋鸡（也能被碰走后转移责任），但乌骨鸡被碰走**不产生**
      那额外的 1 分。牌种由 `isChargeTile`（冲锋鸡：幺鸡或乌骨鸡）与 `isRespTile`（责任鸡：只认幺鸡）决定。
   ⚠️ 明杠与碰同等处理（代码里 how 区分）。 */
const YAOJI=9, WUGUJI=25;
// 冲锋鸡的牌种 = 幺鸡 或 乌骨鸡（用户 2026-09-15 定稿：不做开关，固定如此；
// 也不叫什么"黑八" —— 这张牌就叫**乌骨鸡(8筒)**）。
const BAOTING_FAN=17, TIANTING_FAN=34, OPEN_FOLLOW_FAN=4;   // 报听/天听/开局跟 的番值
/* 报听的口径说明（两个来源有冲突，这里按**用户的表**实现，一行可切）：
   · 百科《贵阳捉鸡》：「起手牌天听（庄家起手牌或闲家摸第一张牌时叫牌）可以报听，此后不能换牌、
     摸着牌就必须打（也不能杠牌），直到胡牌」+「报听者的牌按清一色 10 番计」；
   · 用户的番表：报听 17 番、天听 34 番（且注明"庄家不可天听"）。
   → 本实现取用户的表：闲家首摸即报听 = 天听 34；庄家开局即报听 = 报听 17。
     若要用百科口径（一律按清一色 10 番），把下面两个常量改成 10 / 10 即可。 */
const isChargeTile=c=>isChickenTile(c);      // 冲锋鸡用：幺鸡 或 乌骨鸡（固定，无开关）
/* 责任鸡④（"打出的鸡被碰/杠走 → 打出者多付 1 分"）**只认幺鸡**。
   用户口径（2026-09-15）："乌骨鸡参与冲锋鸡，不算责任鸡" —— 乌骨鸡被碰走只影响冲锋鸡的责任转移，
   不产生那额外的 1 分。（要让乌骨鸡也算，把这里改成 isChickenTile 即可。） */
const isRespTile=c=>c===YAOJI;

// 一张牌在本局作为"鸡"的分值；不是鸡 → 0
// 🔴 用户 2026-09-16 定稿：**算分的是三类** ——
//    ① 幺鸡(1条)   1 分/张（本局的鸡正好是它 → 金 2 分/张）
//    ② 乌骨鸡(8筒) 1 分/张（同上）
//    ③ **翻牌鸡** = 翻到的牌的**下一张**那张牌种（例：翻 5万 → **6万 就是翻牌鸡**）→ 1 分/张
//    ③ 与 ①/② 重合时（本局的鸡就是幺鸡/8筒）按「金」的 2 分/张 算，**不再重复加一份**。
//    归属："叫牌的都算" —— 叫牌家的 手牌 + 副露 + 自己牌河，有几张算几张。
//    ⚠️ 但**包鸡仍然只认 幺鸡/8筒**（未叫家打出的翻牌鸡不赔）；
//       冲锋鸡 / 责任鸡 也仍然只认 幺鸡/8筒（翻牌鸡不产生冲锋鸡、不产生责任鸡）。
function chickenValue(c,fc){
  if(c===YAOJI)  return fc===YAOJI?2:1;      // 幺鸡(1条)：本局金幺鸡 → 2 分/张
  if(c===WUGUJI) return fc===WUGUJI?2:1;     // 乌骨鸡(8筒)：本局金乌骨鸡 → 2 分/张
  if(fc!==null&&fc!==undefined&&c===fc)return 1;   // ③ 翻牌鸡（翻到的牌的下一张）
  return 0;                                   // 其他牌都不是鸡
}
// 鸡牌在界面上的叫法：麻将桌上就叫"幺鸡/乌骨鸡"（用户 2026-09-16：结算里不要带 (1条)/(8筒) 的注解）
const chickenName=c=>(c===YAOJI?'幺鸡':c===WUGUJI?'乌骨鸡':cname(c));

/* 一家"鸡"的分布（只统计、不判分）。只认 **幺鸡(1条) / 乌骨鸡(8筒)** 两种牌。
   ⚠️ 必须按**牌种**分别记 keep/disc：分值是按**牌种**定的（金鸡只把"那一个牌种"翻倍），
      口径也是按牌种判的（叫牌家自己的全算 / 未叫家只算打出去的）—— 合成一个总数就区分不了了。 */
function chickenSurvey(p){
  const fc=G.chickenCard;
  const keep={},disc={};
  const put=(o,c)=>{if(!chickenValue(c,fc))return;o[c]=(o[c]||0)+1;};
  toList(G.hands[p]).forEach(c=>put(keep,c));
  // 副露：碰 3 张 / 杠 4 张，都算"留在自己门前"（保留）
  G.melds[p].forEach(m=>{for(let k=0;k<(m.type==='gang'?4:3);k++)put(keep,m.card);});
  (G.discards[p]||[]).forEach(c=>put(disc,c));
  const rows=Object.keys(Object.assign({},keep,disc)).map(Number).sort((a,b)=>a-b)
    .map(c=>({c:c,v:chickenValue(c,fc),keep:keep[c]||0,disc:disc[c]||0}));
  return {p:p,rows:rows};
}
/* 一行里某个牌种怎么称呼（用户 2026-09-16 定稿）：
     · 幺鸡 / 乌骨鸡         → 「幺鸡」「乌骨鸡」
     · 其中本局是金鸡的那一个  → 「幺鸡(金)」
     · 翻牌鸡（不是幺鸡/8筒）  → **直接写牌名**（「5筒」）—— 第 2 行已经说了翻牌鸡是哪张，
       这里再挂一个「(翻牌鸡)」只是重复；翻牌鸡每局都换，光看牌名+第 2 行就能对上。 */
function chickenRowLabel(c,fc){
  if(c===YAOJI)  return fc===YAOJI?'幺鸡(金)':'幺鸡';
  if(c===WUGUJI) return fc===WUGUJI?'乌骨鸡(金)':'乌骨鸡';
  return cname(c);
}
// 一家的鸡："幺鸡×2，5筒×1"（用户 2026-09-16：**只要类型与数量**）
//   · 不再分「留 / 打」两段 —— 叫牌家留着的和打出的都算他的，本来就是一个总数。
//   · 未叫家**不显示**（他的鸡一律不算分，写出来只是占地方），所以本函数不给 neg 参数。
//   · ⚠️ **已被算作冲锋鸡的那几张要从这里扣掉**（用户 2026-09-16 亲自纠的）：
//     那张牌的价值已经由「冲锋鸡×N」表达，再列一次就是同一张牌出现两处 ——
//     只打了 1 张 1条 且它就是冲锋鸡 → 只写「冲锋鸡×1」，**不写**「幺鸡×1」；
//     打了 2 张 1条（第 1 张是冲锋鸡）→ `冲锋鸡×1，幺鸡×1`。
//   · 排序：按**牌号**（万 → 条 → 筒）；冲锋鸡写在自己的牌号位置上、且**同牌种时排在普通鸡之前**
//     （用 k=c（冲）与 k=c+0.5（普通）实现，正好对上用户给的两个例子）。
//     里面"分值怎么算"完全没变 —— 扣掉的那张本来就不按常鸡计价（见 ③ 段的 cut()）。
function chickenCells(s, chargeCards){
  const fc=G.chickenCard;
  const m=new Map();                       // 保序：rows 已按牌号排好
  s.rows.forEach(r=>{const n=(r.keep||0)+(r.disc||0); if(n)m.set(r.c,(m.get(r.c)||0)+n);});
  (chargeCards||[]).forEach(c=>{           // 扣掉"已按冲锋鸡算过"的那张
    if(!m.has(c))return;
    const n=m.get(c)-1;
    if(n>0)m.set(c,n); else m.delete(c);
  });
  const items=[];
  m.forEach((n,c)=>items.push({k:c+0.5, t:chickenRowLabel(c,fc)+'×'+n}));
  (chargeCards||[]).forEach(c=>items.push({k:c, t:'冲锋鸡×1'}));
  items.sort((a,b)=>a.k-b.k);
  return items.map(x=>x.t).join('，');
}
/* 一家的杠文字："杠9万(自)"（用户 2026-09-16：闷豆/爬坡豆/点豆**统一写成「杠」**）
   杠要写清**谁放的** —— 自 / 对 / 上 / 下（点豆写放那张牌的人，自杠写「自」）。
   ⚠️ 分类顺序不能反：补杠的 meld 继承了原来那副碰的 from(>=0)，
      先判 from 会把它误算成点豆（douSettle 里踩过同一个坑，见那里的注释）。
   ⚠️ 三种豆分值完全一样（各 3 分），区别只在"谁付"，而"谁付"由括号里的座位说清了，
      所以行里不必再分种类；豆的收付由下面的「豆：」行单独讲。 */
const SEAT_ABBR=['自','下','对','上'];      // 座位号 → 简称（0＝自己 / 1＝下家 / 2＝对家 / 3＝上家）
function douCells(p){
  const gs=(G.melds[p]||[]).filter(m=>m.type==='gang'&&!m.void);
  return gs.map(m=>{
    const isPoint=(!m.paPo&&m.from>=0);
    return '杠'+cname(m.card)+'('+(isPoint?(SEAT_ABBR[m.from]||'他'):'自')+')';
  }).join('，');
}
// 一家的全部鸡的**张数**与分值（含宽窄口径之外的自有部分，供显示 ）
function chickenOwnPts(s){return s.rows.reduce((a,r)=>a+(r.keep+r.disc)*r.v,0);}

/* 鸡分结算。total 传数组 = 真结算；传 null = **只统计不落分**（黄庄用，规则："黄庄豆鸡不算分"）。
   写进 total，并把可直接显示的明细 push 到 lines。
   顺序：① 翻牌（写清"翻到什么、本局的鸡是什么"） → ② 每家鸡的类型/数量 → ③ 常鸡收付 → ④ 冲锋鸡 → ⑤ 责任鸡 */
function chickenSettle(win, lines, total, burn, tail){
  // tail：冲锋鸡 / 责任鸡 的行推到这里（现在这两行已删、收不到东西了，接口留着）。
  // ⚠️ 用户 2026-09-16 起：**胡牌分不在这里** —— 四家行只写「他名下能收的分（鸡 + 杠）」，
  //    胡牌单独一行（`上家点炮→下家胡牌（共 N 分）`，见 settle）。
  const out=Array.isArray(tail)?tail:lines;
  const winList=(Array.isArray(win)?win:[win]).filter(p=>typeof p==='number'&&p>=0&&p<4);   // 可能多家同时胡
  const dry=!total;
  const fc=G.chickenCard;
  const called=[0,1,2,3].map(p=>winList.includes(p)||isTing(p));   // 叫牌家 = 胡牌者(可多家) ∪ 叫牌者
  const callList=[0,1,2,3].filter(p=>called[p]);
  const unList=[0,1,2,3].filter(p=>!called[p]);
  const sur=[0,1,2,3].map(p=>chickenSurvey(p));
  // 热炮（杠上炮）：点炮者的鸡全部烧掉 —— 他的鸡不收、也不因此产生赔付
  const burnList=(Array.isArray(burn)?burn:[]).filter(p=>typeof p==='number'&&p>=0&&p<4);
  const isBurned=p=>burnList.includes(p);
  // 本局有没有金鸡（非 null = 有）：金鸡就是"本局的鸡正好是 幺鸡 / 乌骨鸡 之一"那种情况。
  // 名字只当**判据**用，真正显示的字一律走 chickenName()（免得两处叫法各写一套、改一个漏一个）。
  const goldName=(fc===YAOJI||fc===WUGUJI)?chickenName(fc):null;
  /* 第 2 行（用户 2026-09-16 定的六行结构）：翻到什么 → 翻牌鸡是哪张。
     ⚠️ G.chickenCard 存的是**翻到的牌的下一张**（= 翻牌鸡），翻到的牌本身是 G.flipCard。
     ⚠️ 用户 2026-09-16：**不再写「（1 分/张）」** —— 分值表在 README / 帮助里，结算窗只报"是哪张"；
        只有**金**要留一个标记（那会改分值，不提就是漏信息）。 */
  const flipTxt=(G.flipCard===null||G.flipCard===undefined)
    ?'牌墙已空，不翻牌'
    :`翻${cname(G.flipCard)} → 翻牌鸡 ${chickenName(fc)}${goldName?'（金）':''}`;
  // ⚠️ 第 3~6 行要用到下面算出来的 ownC/thrownC，所以四家行**挪到收付算完之后**再 push。

  // ③ 常鸡（幺鸡 / 8筒）的收付 —— 用户 2026-09-16 定稿（**与旧口径不同**，规则见文件头 §四）：
  //    · **每个叫牌家按自己的鸡数，向其他三家各收一份**（叫牌家、未叫家**都要付**）。
  //    · **未叫家不能收**：他的鸡都不算分（②段明细里显示 0 分）。
  //    · **包鸡**：未叫家**打出的** 幺鸡/8筒 归**每个叫牌家**各一份（留着的仍不算）。
  //    · 热炮：点炮者的鸡**全烧**（不收、也不当包鸡赔），但**该他付的照付**。
  //    用户给的算例（对家 3 只、上家 4 只、你 0 只、下家未叫 1 只留着的）：
  //      对家 每家收 3 × 3 家、上家 每家收 4 × 3 家 → 你 −7、下家 −7、对家 +5、上家 +9（合计 0）。
  // 冲锋鸡那只牌由 ④ 段单独结算（2 / 4 分）—— 常规统计里要把这 1 张**扣掉**，否则同一张牌算两次。
  //   用户 2026-09-16：未叫家第一张打出 1条 + 第一张打出 8筒、他自己没叫 → **给各家 4 个**；
  //   按"4 + 每张 1 个 = 6"就是重复了。即"冲锋鸡算两个"= **那张牌就值 2 个**，不是再加 2 个。
  const chargeOwner=ch=>{ if(!ch.via)return ch.p; return called[ch.p]?ch.p:ch.from; };
  const skipCharge={};                                  // p → {牌: 已经按冲锋鸡算过的张数}
  (G.chargeChickens||[]).forEach(ch=>{
    const o=chargeOwner(ch);
    skipCharge[o]=skipCharge[o]||{};
    skipCharge[o][ch.card]=(skipCharge[o][ch.card]||0)+1;
  });
  const cut=(p,c,n)=>{                                  // 扣掉"已按冲锋鸡算过"的张数（不会扣成负数）
    const k=(skipCharge[p]||{})[c]||0;
    return Math.max(0,n-k);
  };
  const ownC=[0,1,2,3].map(p=>{
    if(!called[p]||isBurned(p))return 0;
    return sur[p].rows.reduce((a,r)=>a+cut(p,r.c,r.keep+r.disc)*r.v,0);
  });
  const thrownC=[0,1,2,3].map(p=>{
    if(called[p]||isBurned(p))return 0;                 // 只有**未叫家打出的**鸡才算包鸡
    return sur[p].rows.reduce((a,r)=>a+((r.c===YAOJI||r.c===WUGUJI)?cut(p,r.c,r.disc)*r.v:0),0);
  });
  const sumOwn=ownC.reduce((a,b)=>a+b,0);
  const sumThrown=thrownC.reduce((a,b)=>a+b,0);
  if(!dry){
    // ⚠️ 这里**只算钱、不出行**（用户 2026-09-16：把「鸡分：」那行去掉）：
    //    每个叫牌家按自己的鸡数向其他三家各收一份；未叫家只付不收；包鸡每个叫牌家各一份。
    for(let i=0;i<4;i++){
      const recv=(called[i]&&!isBurned(i))?(3*ownC[i]+sumThrown):0;   // 三家各收自己那份 + 包鸡各一份
      const pay=(sumOwn-ownC[i])+((!called[i]&&!isBurned(i))?thrownC[i]*callList.length:0);
      total[i]+=recv-pay;bookAdd(i,recv);bookAdd(i,-pay);
    }
  }
  /* ---- ④ 冲锋鸡的「持有者 / 只数 / 分值」**提前算**（用户 2026-09-16）----
     四家行要写「冲锋鸡×N」，而「（共 N 分）」还要把它的分值加进去 → 必须在这两行之前算出来。
     收付（改 total）仍留在下面 ④ 段里，两处共用 chargeHold / chargeVal，不会走偏。 */
  const cvOf=card=>((fc===card)?4:2);                  // 该牌种本局是金鸡 → 4 分
  const chargeOf=[0,0,0,0], chargeVal=[0,0,0,0];       // 座位 → 只数 / 分值
  const chargeHold={};                                 // 持有者 → 他持有的冲锋鸡
  (G.chargeChickens||[]).forEach(ch=>{
    // 持有者（含责任转移）与 ③ 段共用同一个 chargeOwner，两处判定不会走偏
    const holder=chargeOwner(ch);
    (chargeHold[holder]=chargeHold[holder]||[]).push({card:ch.card});
  });
  Object.keys(chargeHold).forEach(k=>{
    const a=+k, list=chargeHold[k];
    chargeOf[a]=list.length;
    chargeVal[a]=list.reduce((sum,h)=>sum+cvOf(h.card),0);   // 同一家多只 → 相加
  });

  /* ---- 第 2 行 + 第 3~6 行（用户 2026-09-16 定的结构）----
     顺序：**自己 → 对家 → 上家 → 下家**（用户指定，不是出牌顺序）。
     每行 = 名字［叫牌/未叫］+ 他的杠 + 他的鸡（金 / 翻牌鸡 都挂在牌种上），项之间用「，」分隔。
     · **未叫家只列他要赔的那只冲锋鸡**，杠与鸡一律不写（都不算他的分，列了只是占地方）。
     · 行尾 `（共 N 分）` = 这一家名下的分值合计（常鸡 + 冲锋鸡 + 胡牌；每项按**单价**算，不乘家数）。
       ⚠️ 它是**显示口径**，不等于侧栏的本局净额（净额 = 收 − 付）。渲染时靠 `.line` 的
       flex+space-between 把它**靠右对齐**（见 resultLineHTML）。
     · 他打出去的鸡进了包鸡 → 该行尾巴补一句 `→ 包鸡 各 N 分`（写在**打出那张鸡的那一家自己**这一行里）。
     "钱怎么走"不再单独占一行，方向由侧栏（rSide）的本局净额体现。 */
  // 这一家的**杠分**（每个豆 3 分）：要并进「（共 N 分）」—— 用户 2026-09-16 的口径，
  // 照他自己举的例子：下家 `杠9条(自)，1万×2（共 5 分）` = 杠 3 + 翻牌鸡 2。
  const douPts=p=>((G.melds[p]||[]).filter(m=>m.type==='gang'&&!m.void).length*3);
  lines.push(flipTxt);
  [0,2,3,1].forEach(p=>{
    // 这一家持有的冲锋鸡（牌号列表）—— 传进 chickenCells 是为了把那张牌从常鸡里扣掉、
    // 并在自己的牌号位置上插一项「冲锋鸡×1」（用户 2026-09-16 亲自纠的重复计数）。
    const ck=(chargeHold[p]||[]).map(h=>h.card);
    const seg=[];
    if(called[p]){                                   // 叫牌家：杠 + 鸡（含冲锋鸡）
      const dou=douCells(p);               if(dou)seg.push(dou);
      const chk=chickenCells(sur[p],ck);   if(chk)seg.push(chk);
    }else if(chargeOf[p]){                           // 未叫家：只报他赔出去的那只冲锋鸡
      seg.push('冲锋鸡×'+chargeOf[p]);
    }
    let txt=`${NAMES[p]}［${called[p]?'叫牌':'未叫'}］${seg.length?' '+seg.join('，'):''}`;
    if(thrownC[p])txt+=` → 包鸡 各 ${thrownC[p]} 分`;
    // 「（共 N 分）」= 这一家**名下能收的分**：鸡（含冲锋鸡/翻牌鸡）+ 杠（每个 3 分）。
    //   ⚠️ 胡牌那几分**不在**这里 —— 它单独一行（`上家点炮→下家胡牌（共 N 分）`，见 settle）。
    //   未叫家持有冲锋鸡/杠是**负数**（那笔是他赔出去的）：`下家［未叫］ 冲锋鸡×1（共 -2 分）`。
    if(called[p])txt+=`（共 ${ownC[p]+chargeVal[p]+douPts(p)} 分）`;
    else if(chargeOf[p])txt+=`（共 -${chargeVal[p]+douPts(p)} 分）`;
    if(isBurned(p))txt+=' · 鸡全烧（热炮）';
    lines.push(txt);
  });
  if(!dry&&!callList.length)lines.push('本局无人叫牌 → 鸡分不计');
  if(burnList.length)lines.push('热炮（杠上炮）：'+burnList.map(x=>NAMES[x]).join('、')+' 的鸡全部不算分');
  /* 黄庄（dry）：只统计、不落分。
     "本局豆、鸡都不算分"那句由 endGame 在鸡明细**之后**统一写出（读起来更顺），
     这里不再重复一遍 —— 原来两处都写，明细里会连着出现两句同样的话。 */

  // ④ 冲锋鸡（③）—— 本局第一张被打出的 幺鸡 一只、第一张被打出的 乌骨鸡 一只（**每个牌种各一只**）
  //    持有者：默认 = 打出者；被碰/杠走且**碰走者叫牌**（叫牌或胡牌）→ 转移给碰走者。
  //    ⚠️ 叫牌状态在**结算这一刻**才判：碰的当时他还没叫牌、后来叫牌了，也算他叫牌。
  //    分值：2 分（该**牌种**本局是金鸡 → 4 分）；同一家同时持两只 → 相加
  //          （例：幺鸡 2 + 乌骨鸡 2 = 4；金幺鸡时 4 + 2 = 6。用户 2026-09-16）
  //    收付：持有者叫牌 → **其他三家各付**（含胡牌家 —— 胡了牌也照样付）；
  //          持有者未叫 → 他给每个叫牌家各付（鸡分只在"叫牌 ↔ 未叫"之间走）。
  Object.keys(chargeHold).forEach(k=>{
    const a=+k, val=chargeVal[a];
      if(called[a]){
        // 付款方 = **其他三家**（含胡牌家！）—— 用户口径："就算胡牌了，该付的照付"。
        const payers=[0,1,2,3].filter(q=>q!==a);
        if(!dry)payers.forEach(q=>{total[q]-=val;total[a]+=val;bookAdd(q,-val);bookAdd(a,val);});
    }else if(callList.length){
      if(!dry)callList.forEach(q=>{total[a]-=val;total[q]+=val;bookAdd(a,-val);bookAdd(q,val);});
    }
    // 全场无人叫牌 → 不结算（什么都不做）
  });
  /* ⚠️ 用户 2026-09-16：**冲锋鸡不再单独出一行**（原来写「…打出的第一张X（叫牌）→ 其他三家各付 N 分」）。
     钱照旧在算（上面这几行 total 的加减**一行没动**），只是结算窗不再解释"这笔钱哪来的"——
     方向由侧栏的本局净额体现。**别为了"看得清"把行进重新加回来**，用户点名删过两次这类汇总行
     （先是「鸡分：」，再是「冲锋鸡：」）。 */

  // ⑤ 责任鸡（④）—— "其它家给 3 鸡、打出的给 4 鸡"
  //    打出的**幺鸡**被**叫牌家**碰/杠走：那副露进碰走者的门前（碰 3 / 杠 4 张，已在③段按"保留"计入他的鸡数，
  //    所以他按自己的鸡数向三家各收），本条只额外收**打出者那 1 分**。
  //    两个前提（都在结算时判）：
  //      ① 碰走者必须叫牌 —— 否则那副露的鸡不算（未叫家保留的常鸡不计），整条不结算；
  //      ② 打出者必须未叫 —— 包鸡只算**未叫家打出的鸡**；打出者本人也叫牌时，这张牌随牌进了碰走者的
  //         副露（已在③段算他的），不再多收这 1 分。
  //    ⚠️ 同样**不再单独出行**（用户 2026-09-16），只保留这 1 分的收付。
  const rps=G.respChickens||[];
  rps.forEach(rp=>{
    // 牌种二次把关：责任鸡只认幺鸡（乌骨鸡"参与冲锋鸡、不算责任鸡"）。
    if(!isRespTile(rp.card))return;
    if(!called[rp.by])return;
    if(called[rp.from])return;
    if(!dry){total[rp.from]-=1;total[rp.by]+=1;bookAdd(rp.from,-1);bookAdd(rp.by,1);}
  });
  return {detail:sur,called:called,fieldChicken:fc};
}
// 热炮（杠上炮）惩罚：「点炮者杠前成的那个豆不算」。
// 实现：把该玩家本局刚成的那个杠的收益**整体撤销** —— 直接从 G.douLog 里找那一笔
//（douSettle 记下的逐家 delta）**精确反向**，所以不管是"收"还是"倒赔"都能撤对，
// 不必按 2/3/1 去重算（旧写法就是重算，改成统一 3 个之后会算错）。
// ⚠️ 因此它必须排在 douSettle **之后**调用（见 settle）。
function hotCannonRepeal(p,lines,total){
  const g=G.hotCannonGang;
  if(!g||g.p!==p)return;
  const e=(G.douLog||[]).find(x=>x.p===p&&x.card===g.card&&x.paPo===!!g.paPo);
  if(!e){
    lines.push(`热炮惩罚：${NAMES[p]} 本局刚成的那个豆找不到结算记录 → 只按分数 ×2 处理`);
    return;
  }
  for(let q=0;q<4;q++){total[q]-=e.d[q];bookAdd(q,-e.d[q]);}   // 精确反向：那笔豆整体不算（账本一起反）
  lines.push(`热炮惩罚：${NAMES[p]} 本局刚成的那个豆不算 → 撤销「${e.txt}」`);
}
/* ===== 豆（杠）的结算 —— 用户口径（2026-09-15 更新）=====
   **每个豆一律 3 分**（自杠的闷豆 / 爬坡豆、以及别人放的点豆，都算 3 个），
   方向由「杠家自己有没有叫牌」决定：

   ┌ 杠家**叫牌** ─────────────────────────────────────
   │  · 自杠（闷豆 / 转弯豆）→ **其他三家各付 3 个**（最多收 9 个）
   │  · 点豆（别人放的第四张）→ **只有放杠那家付 3 个**，另外两家不用给
   └ 杠家**未叫牌** ───────────────────────────────────
      · 自杠 → 杠家**倒赔给每个叫牌家各 3 个**（三家都叫牌 → 这一个豆共开出去 9 个）
      · 点豆 → 杠家**倒赔给放杠那家 3 个**（前提：放杠那家也叫牌；他不叫牌就不用给）

   ⚠️ 与旧版的三点不同：① 不再分 2 / 3 / 1，**统一 3**；
      ② 未叫牌者由"豆不算分"改成**倒赔**；③ 点豆只跟放杠那一家结算，不牵动另外两家。
   ⚠️ 抢杠胡时被抢的那个补杠【没成】→ 跳过（否则会与抢杠番数互相抵消）。
   ⚠️ 每笔都记进 G.douLog（含四家逐笔 delta）→ 热炮撤销时**精确反向**，不必重算。
   黄庄时豆、鸡都不算分（走 endGame 的查叫）。

   抽成独立函数的目的：结算规则以后要改只动这里，也能被自测脚本直接调用验证。 */
function douSettle(win,from,isQG,lines,total){
  const winList=(Array.isArray(win)?win:[win]);
  const skipGang=isQG?{p:from,card:G.winTile}:null;
  const DOU=3;                                 // 每个豆一律 3 分
  G.douLog=[];                                 // 本次逐笔明细（供热炮精确反向）
  for(let p=0;p<4;p++){
    const mine=winList.includes(p)||isTing(p);  // 杠家自己算不算"叫牌"（胡牌者天然算）
    const myGangs=(G.melds[p]||[]).filter(m=>m.type==='gang'&&!m.void);
    myGangs.forEach(m=>{
      if(skipGang&&p===skipGang.p&&m.card===skipGang.card&&m.paPo)return;
      // ⚠️ 顺序不能反：补杠的 meld 继承了那副碰的 from（>=0），先判 from 会把它误算成"点豆"。
      const isPoint=(!m.paPo&&m.from>=0);      // 点豆 = 别人放的第 4 张
      const kind=m.paPo?'转弯豆（补杠）':(isPoint?'点豆（明杠）':'闷豆（暗杠）');
      // 对手：点豆只跟**放杠那一家**算；自杠跟**其他三家**算
      const others=isPoint?[m.from]:[0,1,2,3].filter(q=>q!==p);
      const d=[0,0,0,0];
      let txt;
      if(mine){
        // 杠家叫牌 → 对手付给他
        others.forEach(q=>{d[q]-=DOU;d[p]+=DOU;});
        txt=isPoint
          ? `杠牌 ${NAMES[m.from]}→${NAMES[p]}（共 ${DOU} 分）`
          : `杠牌 三家→${NAMES[p]}（共 ${DOU} 分）`;
      }else{
        // 杠家未叫牌 → 他**倒赔**给叫牌家（点豆只赔放杠那一家）
        const recv=others.filter(q=>winList.includes(q)||isTing(q));
        if(!recv.length){
          lines.push(isPoint
            ? `${NAMES[p]} ${kind}${cname(m.card)}：他未叫牌、放杠的 ${NAMES[m.from]} 也没叫牌 → 这个豆不结算（不叫牌不用给）`
            : `${NAMES[p]} ${kind}${cname(m.card)}：他未叫牌，且场上没有叫牌家 → 这个豆不结算`);
          return;
        }
        recv.forEach(q=>{d[p]-=DOU;d[q]+=DOU;});
        txt=`杠牌 ${NAMES[p]}→${recv.map(q=>NAMES[q]).join('、')}（共 ${DOU} 分，他未叫牌要倒赔）`;
      }
      for(let q=0;q<4;q++)total[q]+=d[q];
      bookDelta(d);
      lines.push(txt);
      G.douLog.push({p:p,card:m.card,paPo:!!m.paPo,from:m.from,d:d.slice(),txt:txt});
    });
  }
}
/* 结算账本：只记「每家收了多少 / 付了多少」—— 侧栏那句「（收 X − 付 Y）」用它。
   ⚠️ 它**只影响显示**，真正改钱的永远是 `total`：所有写 total 的地方都要同步 bookAdd / bookDelta，
      否则侧栏的算式会跟净额对不上（净额取自 total）。
   ⚠️ 模块级变量；每局结算前 bookInit() 一次（settle / endGame 各一次）。 */
let BOOK=null;
function bookInit(){BOOK={plus:[0,0,0,0],minus:[0,0,0,0]};}
function bookAdd(p,v){if(!BOOK||!v)return;if(v>0)BOOK.plus[p]+=v;else BOOK.minus[p]-=v;}
function bookDelta(d){if(!BOOK)return;for(let p=0;p<4;p++)bookAdd(p,d[p]);}

/* win 既可以是单个座位号，也可以是**座位号数组**（一炮双响/一炮多响：一张牌被多家同时胡）。
   多家时：每家各算自己的牌型番、放炮者**分别各赔**；豆 / 鸡 / 开局跟只结算一次。 */
function settle(win,from,zimo,hotCannon){
  const winners=(Array.isArray(win)?win.slice():[win]).filter(p=>typeof p==='number'&&p>=0&&p<4);
  const winner=winners.length?winners[0]:-1;
  // ---- 翻鸡牌：牌墙顶指示牌的「下一张」----
  let chicken=null,flip=null;
  if(G.wall.length>0){flip=G.wall[G.wall.length-1];const s=(flip/9)|0;chicken=s*9+((flip%9+1)%9);}
  G.flipCard=flip;
  G.chickenCard=chicken;
  G.fieldChicken=chicken;
  const lines=[],total=[0,0,0,0];
  bookInit();                       // 账本清空（侧栏「（收 X − 付 Y）」用）
  const isZimo=!!zimo;
  const isQG=!!G.qiangGang;
  const qgMul=isQG?4:1;
  const isHC=!!hotCannon&&!isZimo&&!isQG;
  const hcMul=isHC?2:1;
  const flower=isZimo&&G.gangFlower;
  // ---- 逐家算牌型番（多家胡时每家各算各的）----
  const info=winners.map(w=>{
    let pat=huPattern(G.hands[w],G.melds[w]);
    if(!pat)pat={fan:1,name:'平胡'};
    // 天胡 / 地胡：庄家 / 闲家第一次摸牌即自摸（取代基础牌型，取最高）
    const isTian=isZimo&&w===G.dealer&&G.firstDraw[w];
    const isDi  =isZimo&&w!==G.dealer&&G.firstDraw[w];
    let baseFan=pat.fan,patName=pat.name;
    if(isTian){baseFan=33;patName='天胡';}
    else if(isDi){baseFan=23;patName='地胡';}
    // 报听 / 天听（见 canBaoTing 的注释）：按 17 / 34 与牌型番**取最高**，不叠加。
    if(G.bao[w]){
      const bf=baoFanOf(w);
      if(bf>baseFan){baseFan=bf;patName=G.baoName[w]||'报听';}
    }
    // 自摸 +1 番；杠上花 +1 番；抢杠 ×4；热炮 ×2
    const zimoFan=isZimo?1:0;
    const totalFan=(baseFan+(flower?1:0)+zimoFan)*qgMul*hcMul;   // ⚠️ 不含杠：豆按 douSettle 单独结算
    const bonusTxt=[
      isQG?'抢杠胡（×4）':'',
      isHC?'热炮（×2）':'',
      patName===pat.name?pat.name:'',
      flower?'杠上花（+1分）':'',
      isZimo?'自摸（+1分）':''
    ].filter(Boolean).join(' + ');
    return {p:w,pat:pat,patName:patName,fan:totalFan,bonusTxt:bonusTxt};
  });
  const multi=info.length>1;
  // 胡牌方式（第一行那段）：自摸 / 点炮 / 抢杠 / 热炮；杠上花额外挂一个后缀
  const howTxt=(isZimo?'自摸'
      :(isQG?`抢杠胡（${NAMES[from]}补杠包赔）`
      :(isHC?`热炮（${NAMES[from]}点炮）`:`${NAMES[from]}点炮`)))
      +(flower?' · 杠上花+1':'');
  /* ---------------- 第一行（用户 2026-09-16 定的结构）----------------
     谁胡了 · 胡牌类型 N 分 · 谁点炮 / 自摸。
     原来"同一件事"分散在【大字标题】【金色徽章 平胡 · 2 分】【明细行 自摸 平胡：…】三处，
     现在收成一行、由标题（h2）承担，那两处都删掉。 */
  const head=multi
    ? `${info.length===2?'一炮双响':'一炮多响'}：${info.map(x=>NAMES[x.p]).join('、')} 同时胡 · ${isZimo?'自摸':NAMES[from]+'点炮'}`
    : `${winner===PLAYER?'你胡了':NAMES[winner]+'胡了'} · ${info[0].patName} ${info[0].fan} 分 · ${howTxt}`;
  // 多家胡：每家自己的牌型 / 分值各占一行（标题那行放不下，且各家牌型可能不同）
  if(multi)info.forEach(x=>lines.push(`${NAMES[x.p]}：${x.patName} ${x.fan} 分`));
  /* ---- 胡牌收付：一行写清「谁付给谁、多少分」（用户 2026-09-16 定的写法）----
     · 点炮：`上家点炮→下家胡牌（共 1 分）`
     · 自摸：`三家→下家自摸（共 2 分）`
     · 抢杠：`上家补杠被抢→下家胡牌（共 4 分）`｜热炮：`上家热炮（杠上炮）→下家胡牌（共 N 分）`
     一炮双响 / 多响 → 每家各一行。这一段**排在四家行之后、杠行之前**。 */
  const huLines=[];
  info.forEach(x=>{
    if(isZimo){
      for(let p=0;p<4;p++)if(p!==x.p){total[p]-=x.fan;total[x.p]+=x.fan;bookAdd(p,-x.fan);bookAdd(x.p,x.fan);}
      huLines.push(`三家→${NAMES[x.p]}自摸（共 ${x.fan} 分）`);
    }else{
      total[from]-=x.fan;total[x.p]+=x.fan;bookAdd(from,-x.fan);bookAdd(x.p,x.fan);
      const how=isQG?`${NAMES[from]}补杠被抢`:(isHC?`${NAMES[from]}热炮（杠上炮）`:`${NAMES[from]}点炮`);
      huLines.push(`${how}→${NAMES[x.p]}胡牌（共 ${x.fan} 分）`);
    }
  });
  // 热炮附加惩罚：点炮者「杠前成的那个豆不算」—— 必须排在豆结算之后
  // （热炮撤销要用 douSettle 记下的 G.douLog 精确反向）
  G.gangFlower=false;
  /* ---- 下面各段的**显示顺序**（用户 2026-09-16 定）：
       第 1 行（head，在标题里）→ 第 2 行翻牌 + 第 3~6 行四家（chickenSettle 的前半 → headLines）
       → 豆 / 开局跟（douLines）→ 冲锋鸡 / 责任鸡（tailLines）。
     ⚠️ 计算顺序**不能**跟着显示顺序走：豆必须先算（热炮撤销要读 G.douLog），鸡才能判"该付的照付"；
        所以这里用三个数组攒行，最后按显示顺序拼接。 */
  const headLines=[],douLines=[],tailLines=[];
  // ---- 豆（杠）结算：**每个豆 3 分**，方向看杠家叫没叫牌（见 douSettle）----
  douSettle(winners,from,isQG,douLines,total);
  if(isHC)hotCannonRepeal(from,douLines,total);   // ⚠️ 必须在豆结算之后，见函数头注释
  // 开局跟：三家都跟打同一张 → 跟打的每家从**庄家**收 4 分（庄家共付 12）。
  if(G.openFollow&&G.openFollow.ok){
    [0,1,2,3].forEach(q=>{if(q!==G.dealer){total[G.dealer]-=OPEN_FOLLOW_FAN;total[q]+=OPEN_FOLLOW_FAN;bookAdd(G.dealer,-OPEN_FOLLOW_FAN);bookAdd(q,OPEN_FOLLOW_FAN);}});
    douLines.push(`开局跟：庄家 ${NAMES[G.dealer]} 首张 ${cname(G.openFollow.card)}，其余三家都跟打 → 三家各收 ${OPEN_FOLLOW_FAN} 分（庄家付）`);
  }
  // ---- 捉鸡结算：鸡牌身份 / 归属 / 收付全在 chickenSettle 里（含规则①~⑤，见上方长注释）----
  // 热炮（杠上炮）时把点炮者传给鸡结算 → 他的鸡全部不算
  const chRes=chickenSettle(winners,headLines,total,isHC?[from]:null,tailLines);
  // 显示顺序：四家行（headLines）→ 胡牌收付（huLines）→ 杠（douLines）→ 冲锋鸡/责任鸡（tailLines）
  lines.push(...headLines,...huLines,...douLines,...tailLines);
  const det=chRes.detail;
  const chickens=det.map(s=>chickenOwnPts(s));
  SFX.play('chicken',{delay:0.75});   // 翻鸡牌：排在"胡牌音"之后（见 doHu 的时序注释）
  // 记录本局得分并累计到总分
  G.roundScore=total.slice();
  for(let p=0;p<4;p++)G.scores[p]+=total[p];
  G.result={winner:winner,winTile:isZimo?-1:G.winTile,winners:winners.slice()};
  /* ---- 定庄（用户规则）----
     自摸 / 单家点炮 → 胡牌者接庄；
     **一炮双响**（正好 2 家）→ 由「上局庄家逆时针第一个胡牌者」做庄；
     **一炮多响**（≥3 家）→ **放炮者**坐庄。
     （座位号 +1 就是逆时针下一位，所以"逆时针第一个" = 从庄家起偏移最小的那个胡牌者。） */
  if(winners.length){
    if(!isZimo&&winners.length>=3)G.nextDealer=from;
    else if(!isZimo&&winners.length===2){
      let best=winners[0],bestOff=99;
      winners.forEach(w=>{const off=(w-G.dealer+4)%4;if(off<bestOff){bestOff=off;best=w;}});
      G.nextDealer=best;
    }else G.nextDealer=winner;
  }
  endHandBookkeeping(winner);        // 写本地记录（G.nextDealer 已在上面算好，别再覆盖）
  render();
  // 回报的番数即结算番数（自摸已含 +1）
  return {winner,head,lines,total,chickens,chicken,winTile:isZimo?-1:G.winTile,
          pat:{name:info[0].patName,fan:info[0].fan},fan:info[0].fan,zimo:isZimo,detail:det,
          winners:winners.slice(),list:info};
}
// 叫牌：手牌 3n+1 张时，存在某张牌补进来即可胡（自摸口径，不受豆豆通行证限制）
// ⚠️ 函数名沿用 isTing，但**贵阳叫法是"叫牌"**：本项目对玩家可见的一切文案
//（界面 / 日志 / 结算明细 / 文档）都写「叫牌 / 未叫牌」，不出现"听牌"。
function isTing(p){
  const n=G.hands[p].reduce((a,b)=>a+b,0);
  if(n%3!==1)return false;
  for(let c=0;c<27;c++){
    G.hands[p][c]++;
    const ok=canWinWithMelds(G.hands[p],G.melds[p]);
    G.hands[p][c]--;
    if(ok)return true;
  }
  return false;
}
/* 叫牌（叫牌）后的**牌型番值**：取各张能胡的牌里最高的那个番型。
   用于黄庄查叫（未叫牌者要赔给叫牌者"对应番值"）。
   ⚠️ 取最高是常见约定（对叫牌者有利）；若要按最低/指定某张算，改这里一处即可。 */
function tingFan(p){
  const n=G.hands[p].reduce((a,b)=>a+b,0);
  if(n%3!==1)return {fan:0,name:''};
  let fan=0,name='';
  for(let c=0;c<27;c++){
    G.hands[p][c]++;
    if(canWinWithMelds(G.hands[p],G.melds[p])){
      const pat=huPattern(G.hands[p],G.melds[p]);
      if(pat&&pat.fan>fan){fan=pat.fan;name=pat.name;}
    }
    G.hands[p][c]--;
  }
  return {fan:fan||1,name:name||'平胡'};
}
/* 黄庄查叫：未叫牌（未叫牌）者赔给每个叫牌者「其叫牌牌型的番值」。
   规则原文：「牌摸完后无人胡牌叫黄庄，需查牌确定玩家是否叫牌(及叫牌)及叫牌后的牌型番数……
   若有人叫牌、有人未叫牌，未叫牌玩家需分别赔付每个叫牌玩家对应的番值；黄庄后所有豆鸡不算分」。
   ⚠️ 番值取"能胡的各张牌里最高的那个番型"（常见约定，对叫牌者有利）；改口径只动 tingFan。 */
function chajiaoSettle(lines,total){
  const tingL=[],noL=[];
  for(let p=0;p<4;p++)(isTing(p)?tingL:noL).push(p);
  if(tingL.length&&noL.length){
    tingL.forEach(t=>{
      const pf=tingFan(t);
      noL.forEach(n=>{total[n]-=pf.fan;total[t]+=pf.fan;bookAdd(n,-pf.fan);bookAdd(t,pf.fan);});
      lines.push(`${NAMES[t]} 叫牌（${pf.name} ${pf.fan} 分）：未叫牌的 ${noL.map(n=>NAMES[n]).join('、')} 各赔 ${pf.fan} 分`);
    });
  }else if(!tingL.length){
    lines.push('四家都没叫牌，查叫不计分');
  }else{
    lines.push('四家都叫牌了，查叫互相不赔');
  }
  return {tingL:tingL,noL:noL};
}
function endGame(){
  G.phase='over';
  /* ===== 黄庄查叫 =====
     贵阳捉鸡规则：「牌摸完后无人胡牌叫黄庄，需查牌确定玩家是否叫牌(及叫牌)及叫牌后的
     牌型番数……若有人叫牌、有人未叫牌，未叫牌玩家需分别赔付每个叫牌玩家对应的番值；
     黄庄后所有『豆』『鸡』不算分」。 */
  const lines=[],total=[0,0,0,0];
  /* 行顺序与"有人胡牌"那局保持一致（用户 2026-09-16 定的结构）：翻牌 + 四家在前，查叫在后。
     ⚠️ 查叫要先算出来（它给出 tingL、并把赔分记进 total），但**行**可以后拼 —— 所以攒两个数组。 */
  bookInit();                       // 账本清空（侧栏「（收 X − 付 Y）」用）
  const chLines=[],chickenLines=[];
  const ch=chajiaoSettle(chLines,total);
  // 黄庄也要写出各家的鸡类型/数量（规则要求）；total 传 null = **只统计不落分**
  // ——「黄庄后所有豆、鸡都不算分」。
  chickenSettle(-1,chickenLines,null);
  lines.push(...chickenLines,...chLines);
  lines.push('黄庄：本局豆、鸡都不算分');      // 写在鸡明细**之后**（先看到各家有几张鸡，再说这局不算分）
  SFX.play('liuju');   // 黄庄：下行两音（泄气但不刺耳）
  const tingL=(ch&&ch.tingL)||[];
  // 先落分再记账（endHandBookkeeping 会把 G.scores 写进存档）
  G.roundScore=total.slice();
  for(let p=0;p<4;p++)G.scores[p]+=total[p];
  G.result={winner:-1,winTile:-1,ting:tingL.slice()};
  /* 黄庄定庄（用户 2026-09-15 口径）：
     · 叫牌者中**含庄家** → 庄家连庄；
     · **3 家叫牌、1 家未叫** → 由**未叫的那家**坐庄；
     · 其余「部分叫牌」情形（庄家未叫、未叫者 ≥2 家）→ 由**离庄家最近的叫牌者**坐庄
       （QQ官方规则补全；不要这一档就把下面那个 else 分支删掉，回到"一律连庄"）；
     · 无人叫牌 / 四家全叫 → 庄家连庄。 */
  G.nextDealer=null;
  const calledP=[0,1,2,3].filter(pp=>isTing(pp));
  let nd=G.dealer;
  if(calledP.length===3){
    const un=[0,1,2,3].filter(pp=>!isTing(pp))[0];
    if(typeof un==='number')nd=un;
  }else if(calledP.length>0&&calledP.length<3){
    if(calledP.indexOf(G.dealer)>=0)nd=G.dealer;
    else{let bo=9;calledP.forEach(pp=>{const off=(pp-G.dealer+4)%4;if(off<bo){bo=off;nd=pp;}});}
  }
  G.nextDealer=nd;
  lines.push(`下局坐庄：${NAMES[nd]}${nd===G.dealer?'（连庄）':'（接庄）'}`);
  // ⚠️ 这里**只能调一次**（`endHandBookkeeping` 里做的是 `r.hands=(r.hands||0)+1`，没有幂等保护）——
  //    曾经连着写了两行，黄庄时"局数"会 +2，和有人胡牌那局（+1）对不上。
  endHandBookkeeping(-1);            // 黄庄：局数照样记一笔（庄位已由上面 nextDealer 定好）
  render();
  // 黄庄也要亮牌：牌墙摸完了，四家都是什么牌、谁叫牌谁没叫牌，摊开才看得明白
  // 标题那行就说清"黄庄 + 无人胡牌"，第一行不再重复一遍（对齐"有人胡牌"那局的标题写法）
  let main='';
  lines.forEach(l=>main+=resultLineHTML(l));
  let side=`<div class="rScores">`;
  // 顺序 = 自己 → 对家 → 上家 → 下家（与上面四家行同一顺序）；净额后面挂「（收 X − 付 Y）」
  [0,2,3,1].forEach(p=>{const v=total[p];
    side+=`<div class="line"><span>${NAMES[p]}${tingL.includes(p)?' <span style="color:#0a7">叫牌</span>':' <span style="color:#aaa">未叫</span>'}</span><span><span style="color:${v>=0?'#0a7':'#c00'}">${v>=0?'+':''}${v} 分</span>${bookSpan(p)}</span></div>`;});
  side+=`</div><div class="scoreSummary">${scoreSummaryHtml()}</div>`;
  const rBtns=`<div class="rBtns"><button class="gray" onclick="closeResult()">再来一局</button></div>`;
  setResultBox(`<h2>黄庄 · 无人胡牌</h2><div class="rMain">${main}</div><div class="rSide">${side}</div>`+rBtns);
  openResult();
  // 结算**直接展开**（用户 2026-09-16：不要先收在角落、再点一下才放大）。
  // 牌桌上的四家手牌在 phase==='over' 时本来就已经翻开，不需要收起窗体才看得到；
  // 想回到"一览牌桌"仍然点窗外的空白即可（onResultMaskClick 会收起）。
}

// 累计积分表（结算弹窗用）
/* 侧栏每家净额后面那句「（收 X − 付 Y）」—— 数据来自结算账本 BOOK（见 bookAdd）。
   独立成一个 span：窄屏放不下时它会自己折到下一行（.rScores .line 加了 flex-wrap）。 */
function bookSpan(p){
  if(!BOOK)return '';
  const a=BOOK.plus[p],b=BOOK.minus[p];
  if(!a&&!b)return '';
  return `<span class="bk">（收 ${a} − 付 ${b}）</span>`;
}
// 累计积分：顺序也跟上面四家行一致（自己 → 对家 → 上家 → 下家）
function scoreSummaryHtml(){
  return `<div class="line" style="font-weight:700"><span>累计积分</span><span>总分</span></div>`
    +[0,2,3,1].map(p=>{
      const n=NAMES[p],v=G.scores[p];
      return `<div class="line"><span>${p===PLAYER?'<b>'+n+'</b>':n}</span><span style="color:${v>0?'#0a7':v<0?'#c00':'#666'};font-weight:700">${v>0?'+':''}${v}</span></div>`;
    }).join('');
}
// 结算窗内容统一加装：右上角「×」+ 收起后的操作说明。
// （收起提示原来是个浮层伪元素，位置固定，会压在自己的手牌上；放进窗内最稳。）
/* 结算窗的一行文字 → HTML。用户 2026-09-16：四家行右端的「（共 N 分）」要**靠右对齐**。
   .line 本身就是 flex + justify-content:space-between，所以只要把行切成两个 span 就自然靠右；
   行尾可能还有别的尾巴（热炮标记），一起放进右段，保证它仍然贴着右边。 */
function resultLineHTML(l){
  const m=/^(.*)（共 (-?\d+) 分）(.*)$/.exec(l);      // ⚠️ 负号要带上：未叫家持有冲锋鸡时是 `（共 -2 分）`
  if(m&&/［叫牌］|［未叫］/.test(m[1]))
    return `<div class="line"><span>${m[1]}</span><span class="rp">（共 ${m[2]} 分）${m[3]}</span></div>`;
  return `<div class="line"><span>${l}</span></div>`;
}
function setResultBox(inner){
  document.getElementById('resultBox').innerHTML=
    `<button class="xBtn" type="button" aria-label="关闭" onclick="hideResult()">×</button>`
    +inner
    +`<div class="peekHint">点窗体看明细 · 点窗外的空白收回角落 · 点右上角「×」关掉</div>`;
}
// 打开结算窗（展开态）。**没有任何自动收起定时器** —— 只有用户动作才改变状态
// （点窗体=展开 / 点窗外空白=收回角落 / 点「×」=关闭；当年那个 3.2 秒 setTimeout 已删）。
function openResult(){
  const r=document.getElementById('result');
  if(!r||!r.style)return;
  if(r.classList)r.classList.remove('peekMode');
  r.style.display='flex';
  if(document.body&&document.body.classList)document.body.classList.add('isResult');
  syncReopenBtn();
  clearTimeout(showResult._t);
  // ⚠️ 这里**故意没有**"N 秒后自动收起"的定时器。
  //    老版本展开了 3.2 秒就自己缩回角落 —— 用户正在看明细时窗体自己跑掉，
  //    实测反馈就是"点开放大了，怎么又自动缩回去了"。
  //    现在只在**用户自己动作**时改变状态：点窗体/「本局详情」= 展开；点窗外空白处或「×」= 收起/关闭。
}
function showResult(res){
  /* 标题 = 第一行（用户 2026-09-16 定的结构）：谁胡了 · 胡牌类型 N 分 · 谁点炮 / 自摸。
     原来标题只写"你胡了！"，牌型与分值另起一个金色徽章、后面又跟一行明细 —— 同一件事说三遍；
     现在收成一行由标题承担（res.head 在 settle 里拼好）。 */
  const title=`<h2>${res.head||(res.winner===PLAYER?'你胡了':NAMES[res.winner]+'胡了')}</h2>`;
  // 内容拆成两段：rMain=这局怎么胡的，rSide=得分+累计积分+操作按钮。
  // 竖屏上下排（原来的样子），横屏自动变左右两栏 —— 400px 高的横屏放不下
  // 竖排的 546px 内容，底部按钮要滚动才够得到（见 CSS ③ 档）。
  let main='';
  res.lines.forEach(l=>main+=resultLineHTML(l));
  let side=`<div class="rScores">`;
  [0,2,3,1].forEach(p=>{const v=res.total[p];side+=`<div class="line"><span>${NAMES[p]}<span style="color:#aaa;font-size:11px"> 本局</span></span><span><span style="color:${v>=0?'#0a7':'#c00'}">${v>=0?'+':''}${v} 分</span>${bookSpan(p)}</span></div>`;});
  side+=`</div><div class="scoreSummary">${scoreSummaryHtml()}</div>`;
  // 完局后三家手牌已亮正面；这里给一个「点牌桌看牌」的入口，
  // 点一下把结算窗缩到角落，四家手牌一览无遗。
  // 完局后把**牌墙里没摸到的牌**也全部翻开（用户要求）：
  // 按 万→条→筒 理好、用最小的牌面紧凑排开，让玩家知道这局还剩哪些没出来。
  // ⚠️ 它是**结算窗的独立一块**（直接挂在 .box 下、flex:1 1 100%）：竖屏是最后一行；
  //    横屏 .box 是两栏，靠 flex-wrap + 100% 让墙牌独占第二行 —— 塞进右栏会被挤成很窄一条、
  //    多出好几行，实测把窗体顶出 17px（超过 max-height 就滚动，等于没做）。
  // 「再来一局」**放到最下面**（用户要求）：排在"未摸到的牌"那一块之后，独立一整块
  // （横屏 .box 是两栏布局，不写成 100% 宽会被排成第三栏）。
  const rBtns=`<div class="rBtns"><button class="gray" onclick="closeResult()">再来一局</button></div>`;
  const wallSorted=(G.wall||[]).slice().sort((a,b)=>a-b);
  const wallBlock=`<div class="rWall"><div class="rWallT">未摸到的牌 · ${wallSorted.length} 张</div>`
      + `<div class="rWallG">`
      + wallSorted.map(c=>`<div class="tile w">${tileFace(c)}</div>`).join('')
      + `</div></div>`;
  SFX.play('settle',{delay:1.1});   // 结算窗的音：落在胡牌长音的尾巴上，不和它糊在一起
  setResultBox(title+`<div class="rMain">${main}</div><div class="rSide">${side}</div>`+wallBlock+rBtns);
  openResult();
  // 结算**直接展开**（同上：用户要求弹出即大图）
}
// 把结算窗缩到角落（不遮牌桌），此时可以直接看四家的亮牌
function peekTable(){
  const r=document.getElementById('result');
  if(!r||r.style.display==='none')return;
  clearTimeout(showResult._t);       // 手动收起后别再被定时器打扰
  r.classList.add('peekMode');
  syncReopenBtn();
}
// 关闭结算窗：回到牌桌看牌，牌桌上的手牌仍是亮着的；
// 右上角留一个「本局详情」药丸，随时能把结算数据叫回来（旧版关掉就再也看不到了）
function hideResult(){
  const r=document.getElementById('result');
  if(r){r.style.display='none';r.classList.remove('peekMode');}
  SFX.play('tap');
  if(document.body&&document.body.classList)document.body.classList.remove('isResult');
  syncReopenBtn();
}
function reopenResult(){
  if(G.phase!=='over')return;
  // ⚠️ 必须先 openResult()：点过右上角「×」之后窗体的 display 是 none，
  //    而 expandResult() 只负责去掉 peekMode（收起态→展开），**不会**把它重新显示出来 ——
  //    少这一步就会出现"关掉后再点「本局详情」弹不出来"（用户实测反馈）。
  openResult();
  expandResult();
}
/* 展开结算窗（点收起态的窗体、或点「本局详情」都走这里）：
   展开 3.2 秒后自动收回角落 —— 别一直挡着牌桌。 */
function expandResult(){
  const r=document.getElementById('result');
  if(!r)return;
  // 保险：单独调用时若窗体是关着的，先把它显示出来
  if(r.style&&r.style.display==='none')openResult();
  SFX.play('tap');
  if(r.classList)r.classList.remove('peekMode');
  syncReopenBtn();
  clearTimeout(showResult._t);
  // ⚠️ 这里**故意没有**"N 秒后自动收起"的定时器。
  //    老版本展开了 3.2 秒就自己缩回角落 —— 用户正在看明细时窗体自己跑掉，
  //    实测反馈就是"点开放大了，怎么又自动缩回去了"。
  //    现在只在**用户自己动作**时改变状态：点窗体/「本局详情」= 展开；点窗外空白处或「×」= 收起/关闭。

function syncReopenBtn(){

function onResultMaskClick(e){
  const r=document.getElementById('result');
  if(!r||!e||!e.target)return;
  const inBox=e.target.id!=='result';                  // 点在窗体里（含按钮）
  const tag=(e.target.tagName||'').toLowerCase();
  const peek=!!(r.classList&&r.classList.contains('peekMode'));
  if(inBox){
    // 点窗体内的**按钮**不在这里处理（它们有自己的 onclick，比如「再来一局」直接开新局；
    // 这里再展开会把刚关掉的结算窗又弹出来）。
    if(tag==='button')return;
    if(peek){ SFX.play('tap'); expandResult(); }       // 收起态 → 展开看明细（提示文案一直这么说，但以前点了没反应）
    return;

  // （用户明确要求过："误触空白就把结算窗关掉，反而让人以为没地方开下一局"。）
  if(peek)return;

// ===== SVG 牌面绘制（对齐真实麻将牌）=====
// 真牌观感的三条硬指标：
//   1) 万：粗黑体汉字，数字占上半、[萬]占下半且笔画粗重、几乎顶满牌宽
//   2) 条：竹条有【立体圆柱感】—— 中间一道纵向高光 + 两侧暗边 + 两端深色竹节环
//   3) 筒：同心圆"饼"有【体积】—— 由外向内 深色环 → 亮色环 → 深色芯 → 高光点
// 所有牌共用一个 <defs>：纸张渐变、描边、筒/条的配色渐变，避免逐帧重复定义。
const WAN_CN=['一','二','三','四','五','六','七','八','九'];

// 主色（取真牌经典配色：朱红 / 靛蓝 / 竹青）
const C_RED='#b81c26', C_BLUE='#17458c', C_GREEN='#146b34';
// 每色的 亮 / 中 / 暗 三阶，用于做圆柱与圆饼的立体渐变
const SHADE={
  [C_RED]:  {hi:'#f0757e', mid:'#c9242f', lo:'#7e1119', edge:'#5e0c12'},
  [C_BLUE]: {hi:'#7ba6e8', mid:'#1d55ad', lo:'#0e3170', edge:'#0a2454'},
  [C_GREEN]:{hi:'#6dc487', mid:'#17803c', lo:'#0a4a22', edge:'#063316'},
};
const sh=c=>SHADE[c]||SHADE[C_GREEN];
// 纸张（牌面底色）—— 真牌是暖白象牙色，不是纯白
const PAPER='#f7f2e4', PAPER_HI='#fffdf6', PAPER_LO='#e6dcc4';
// 共用的渐变/滤镜定义。id 带前缀 fs- 避免和页面其它 SVG 冲突。
function faceDefs(){
  let d='<defs>';
  // 牌面纸底：左上受光、右下微暗
  d+=`<linearGradient id="fs-paper" x1="0" y1="0" x2="0.55" y2="1">`
    +`<stop offset="0" stop-color="${PAPER_HI}"/><stop offset="0.5" stop-color="${PAPER}"/>`
    +`<stop offset="1" stop-color="${PAPER_LO}"/></linearGradient>`;
  // 竹条横向渐变：左暗 → 中亮 → 右暗（圆柱感的关键，直接在渐变里做，省一堆叠加矩形）
  for(const c of [C_GREEN,C_RED]){
    const s=sh(c);
    d+=`<linearGradient id="fs-cyl-${c.slice(1)}" x1="0" y1="0" x2="1" y2="0">`
      +`<stop offset="0" stop-color="${s.lo}"/><stop offset="0.18" stop-color="${s.mid}"/>`
      +`<stop offset="0.42" stop-color="${s.hi}"/><stop offset="0.62" stop-color="${s.mid}"/>`
      +`<stop offset="1" stop-color="${s.edge}"/></linearGradient>`;
  }
  // 筒"饼"径向渐变：中心亮、外周暗，制造球面凸起
  for(const c of [C_GREEN,C_RED,C_BLUE]){
    const s=sh(c);
    d+=`<radialGradient id="fs-dot-${c.slice(1)}" cx="0.36" cy="0.32" r="0.75">`
      +`<stop offset="0" stop-color="${s.hi}"/><stop offset="0.45" stop-color="${s.mid}"/>`
      +`<stop offset="1" stop-color="${s.lo}"/></radialGradient>`;
  }
  d+='</defs>';
  return d;
}
const cylFill=c=>`url(#fs-cyl-${c.slice(1)})`;
const dotFill=c=>`url(#fs-dot-${c.slice(1)})`;

  // ⚠️ 不要用 kids[0].style.width 当基准：上一轮我们把它写成了 "var(--tw)"，
  //    parseFloat("var(--tw)") 恒为 NaN，会让整个缩放静默失效。
  //    这里改为：先清掉上一轮内联的 --tw，量一次自然宽度，量完立刻还原。
  const first=kids[0];

  // 但放大要有两个刹车的：
